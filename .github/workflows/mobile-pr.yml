name: Mobile PR Orchestrator

# Thin orchestrator layer between a mobile repo's own develop.yml and
# develop-mobile-ci.yml (LAB-2096). Bakes in everything every existing
# mobile caller (mc-training-arc-sung-jinwoo-mobile, mangalab,
# shout-mobile) repeats today - pr_number/pr_url/is_dependabot
# computation, the `if: github.event.action != 'closed'` guard, the PR
# concurrency group, the actionlint sibling job, and the
# `pull-requests: write` grant develop-mobile-ci.yml's
# a11y/design-system/dead-code/tech-debt jobs need (see that file's own
# header comment - a caller missing this fails the ENTIRE run with
# `startup_failure`, 0 jobs, even with every enable_* flag off, since
# GitHub validates the whole callee permission graph before dispatching
# any job). A caller repo `develop.yml` now only needs
# `uses: .../mobile-pr.yml@main` with zero `with:` keys for the common
# case - see templates/mobile-pr.yml for the minimal shape.
#
# `id-token: write` is carried through for `codecov_use_oidc: true`
# callers (Codecov OIDC auth in the `test` job) - GitHub's permission-graph
# validation applies to it the same way it applies to `pull-requests:
# write`, so it must be granted here even though it's only actually used
# when that input is true.
#
# github.event.pull_request is available here because the outermost
# trigger (the calling repo's own develop.yml) is still `pull_request` -
# that context flows transitively through the whole `workflow_call` chain,
# so pr_number/pr_url/is_dependabot are computed directly below instead of
# being caller-supplied inputs.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory (relative to the repo root) the Expo app lives in.
        type: string
        required: false
        default: '.'
      pr_base_sha:
        description: >
          Only used by the `tech-debt` job (when `enable_tech_debt` is
          true) to compute a delta vs. the PR's base branch. Leave empty
          (default) to skip the delta and get current-totals only.
        type: string
        required: false
        default: ''
      also_treat_actions_bot_as_dependabot:
        description: >
          OR'd into the computed is_dependabot expression - set true for a
          repo whose main.yml pre-creates check-runs for its own CalVer
          version-bump PR (opened by github-actions[bot]), so this PR's
          optional scan/test jobs get skipped the same way a real
          dependabot[bot] PR's would.
        type: boolean
        required: false
        default: false
      enable_ls_lint:
        description: Run `yarn lint:ls` (filename/directory convention lint).
        type: boolean
        default: true
      enable_test:
        description: Run `yarn test:coverage` + upload to Codecov.
        type: boolean
        default: true
      codecov_use_oidc:
        description: Use Codecov's OIDC auth instead of a token.
        type: boolean
        default: false
      codecov_token_secret_name:
        description: >
          Documentation only for which secret backs the token-mode Codecov
          upload - see develop-mobile-ci.yml's identical input.
        type: string
        required: false
        default: 'CODECOV_TOKEN'
      enable_a11y:
        description: Run `yarn a11y`.
        type: boolean
        default: true
      enable_design_system:
        description: Run `yarn design-system`.
        type: boolean
        default: true
      enable_dead_code:
        description: Run `yarn dead-code` (knip).
        type: boolean
        default: true
      enable_duplicate_code:
        description: Run `yarn duplicate-code` (jscpd). Off by default.
        type: boolean
        default: false
      enable_security_scan:
        description: Run the Trivy filesystem vuln/secret scan (HIGH,CRITICAL fail).
        type: boolean
        default: true
      security_scan_trivyignores:
        description: >
          Comma-separated list of relative paths to .trivyignore file(s), or
          a single .trivyignore.yaml file.
        type: string
        required: false
        default: ''
      enable_dependency_audit:
        description: Run `yarn npm audit`. Off by default.
        type: boolean
        default: false
      enable_tech_debt:
        description: >
          Run the grep-based tech-debt metrics report and post it as a
          sticky PR comment. Opt-in - defaults false.
        type: boolean
        default: false
      extra_deps_paths:
        description: >
          Space-separated list of additional paths (relative to
          working-directory) to carry from the `setup` job into every
          downstream job, beyond node_modules.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: PeterChauYEG/labone-actions/.github/workflows/develop-mobile-ci.yml@main
    secrets: inherit
    with:
      working-directory: ${{ inputs.working-directory }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
      pr_base_sha: ${{ inputs.pr_base_sha }}
      is_dependabot: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (inputs.also_treat_actions_bot_as_dependabot && github.event.pull_request.user.login == 'github-actions[bot]') }}
      enable_ls_lint: ${{ inputs.enable_ls_lint }}
      enable_test: ${{ inputs.enable_test }}
      codecov_use_oidc: ${{ inputs.codecov_use_oidc }}
      codecov_token_secret_name: ${{ inputs.codecov_token_secret_name }}
      enable_a11y: ${{ inputs.enable_a11y }}
      enable_design_system: ${{ inputs.enable_design_system }}
      enable_dead_code: ${{ inputs.enable_dead_code }}
      enable_duplicate_code: ${{ inputs.enable_duplicate_code }}
      enable_security_scan: ${{ inputs.enable_security_scan }}
      security_scan_trivyignores: ${{ inputs.security_scan_trivyignores }}
      enable_dependency_audit: ${{ inputs.enable_dependency_audit }}
      enable_tech_debt: ${{ inputs.enable_tech_debt }}
      extra_deps_paths: ${{ inputs.extra_deps_paths }}

  actionlint:
    if: github.event.action != 'closed'
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
