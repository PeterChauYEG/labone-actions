name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    secrets: inherit
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number || 0 }}
      pr_url: ${{ github.event.pull_request.html_url || '' }}

  unit-tests:
    name: unit-tests
    runs-on: [self-hosted, catfood, catfood-minimal]
    steps:
      - uses: actions/checkout@v7

      - name: Test file-linear-ticket.sh
        run: bash scripts/file-linear-ticket.test.sh

      - name: Test file-ci-failure-ticket.sh
        run: bash scripts/file-ci-failure-ticket.test.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test package-cluster.mjs
        run: node scripts/lib/package-cluster.test.mjs

      - name: File Linear ticket for failure
        if: failure() && github.event_name == 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh unit-tests
