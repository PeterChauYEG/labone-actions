name: Develop Python CI

# Reusable PR-time CI for Python repos (data pipelines, MCP servers, ML/robotics
# scripts). Callers are thin wrappers: `on: pull_request` -> `uses:
# PeterChauYEG/labone-actions/.github/workflows/develop-python-ci.yml@main`
# with `secrets: inherit`.
#
# Unlike develop-node-ci.yml, there is no shared `setup` + cache-restore
# stage installing the *project's own* deps here: Python dependency
# management is not uniform across consumer repos (pyproject.toml,
# requirements.txt, or neither). The standalone dev tools each job needs
# (ruff, pip-audit) are a different story though - those aren't tied to the
# project's own dependency format, so `lint` and `dependency-audit` both go
# through `setup-python-uv`, a cached `uv tool install` wrapper (mirrors
# setup-node-yarn/setup-node-pnpm's shape) instead of a bare, uncached `pip
# install --break-system-packages <tool>` on every single run.
#
# `lint` is a HARD gate: `ruff check <lint_path>`, always on.
#
# `test` runs a caller-supplied `test_command` (default `python3 -m
# pytest`) as a HARD gate when enabled. There's no standard Python
# equivalent of package.json's `test` script name, so the command itself is
# an input rather than assumed.
#
# `security-scan` reimplements the same Trivy invocation security-scan.yml
# already established (severity HIGH,CRITICAL, exit-code 1, no default
# .trivyignore baseline) as inline steps, same as develop-node-ci.yml.
#
# `dependency-audit` (pip-audit) is OFF by default, unlike develop-node-ci's
# dependency-audit. Node callers share one lockfile format (yarn.lock);
# Python callers here don't share one dependency-declaration format, so
# forcing this on would fail loudly for repos with neither a
# requirements.txt nor a pyproject.toml. Callers opt in explicitly and may
# set `requirements_file` if it's not the default `requirements.txt`.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory (relative to the repo root) the Python project lives in.
        type: string
        required: false
        default: '.'
      is_dependabot:
        description: >
          Whether this PR was opened by dependabot[bot]. Caller must
          compute this from github.event.pull_request.user.login, since
          reusable workflows can't see that context directly. When true,
          `test`, `security-scan` and `dependency-audit` are skipped
          (`lint` stays on).
        type: boolean
        required: false
        default: false
      lint_path:
        description: Path (relative to working-directory) passed to `ruff check`.
        type: string
        required: false
        default: '.'
      enable_fmt:
        description: >
          Run `ruff format --check <fmt_path>` as a hard gate - same tool
          as `lint` (`ruff check`), different command. Standardized on by
          default - `labone-actions` sets the fleet-wide baseline, callers
          don't opt into it piecemeal. A caller not yet `ruff format`-clean
          will go red on its next PR until it runs `ruff format .` once
          locally - a one-time fix, not an ongoing cost. See the CI doc's
          Migration plan for the "Python has no fmt job" gap this closes.
        type: boolean
        default: true
      fmt_path:
        description: Path (relative to working-directory) passed to `ruff format --check`.
        type: string
        required: false
        default: '.'
      enable_typecheck:
        description: >
          Run `mypy <typecheck_path>` as a hard gate. Standardized on by
          default - `labone-actions` sets the fleet-wide baseline, callers
          don't opt into it piecemeal. A caller with no mypy config and
          pre-existing type errors will go red on its next PR until fixed
          (or a `mypy.ini`/`[tool.mypy]` narrows scope) - unlike Node's
          `tsc --noEmit`, there's no established mypy/pyright convention
          across Python callers yet, so this is expected, not a bug. See
          the CI doc's Migration plan for the "Python has no typecheck
          job" gap this closes.
        type: boolean
        default: true
      typecheck_path:
        description: Path (relative to working-directory) passed to `mypy`.
        type: string
        required: false
        default: '.'
      enable_test:
        description: Run `test_command`.
        type: boolean
        default: true
      test_command:
        description: Command used to run the test suite.
        type: string
        required: false
        default: 'python3 -m pytest'
      enable_security_scan:
        description: Run the Trivy filesystem vuln/secret scan (HIGH,CRITICAL fail).
        type: boolean
        default: true
      security_scan_trivyignores:
        description: >
          Comma-separated list of relative paths to .trivyignore file(s), or
          a single .trivyignore.yaml file, passed straight through to
          trivy-action's `trivyignores` input. Empty by default - this
          shared workflow ships no default ignore baseline.
        type: string
        required: false
        default: ''
      enable_dependency_audit:
        description: >
          Run `pip-audit` against `requirements_file`. Off by default - see
          this file's header comment.
        type: boolean
        default: false
      requirements_file:
        description: Path (relative to working-directory) to a requirements.txt for pip-audit.
        type: string
        required: false
        default: 'requirements.txt'
      enable_dead_code:
        description: >
          Run a dead-code scan via `dead_code_script` (vulture).
          Standardized on by default - `labone-actions` sets the
          fleet-wide baseline, callers don't opt into it piecemeal. Only
          `robot-7` has `scripts/dead_code_scan.py` today - every other
          Python caller will see this job report `failure` (script not
          found) until it adds one, same one-time-fix framing as
          `enable_fmt` above. Advisory-only (see `danger-comment`) - never
          fails the job itself, just files a ticket.
        type: boolean
        default: true
      dead_code_script:
        description: Path (relative to working-directory) to the dead-code-scan script.
        type: string
        required: false
        default: 'scripts/dead_code_scan.py'
      enable_duplicate_code:
        description: >
          Run a duplicate-code scan via `duplicate_code_script` (jscpd, Python
          tokenizer, needs a `.jscpd.json`). Standardized on by default -
          same rationale as `enable_dead_code` above; only `robot-7` has
          `scripts/duplicate-code-scan.sh`/`.jscpd.json` today, every other
          caller reports `failure` until it adds them. Advisory-only, never
          fails the job itself.
        type: boolean
        default: true
      duplicate_code_script:
        description: Path (relative to working-directory) to the duplicate-code-scan script.
        type: string
        required: false
        default: 'scripts/duplicate-code-scan.sh'
      enable_file_size:
        description: >
          Run a file-size scan via `file_size_script` (pylint's `too-many-lines`
          C0302). Report-only by design - never fails the job. Standardized
          on by default - same rationale as `enable_dead_code` above; only
          `robot-7` has `scripts/file_size_scan.py` today, every other
          caller reports `failure` (script not found) until it adds one.
        type: boolean
        default: true
      file_size_script:
        description: Path (relative to working-directory) to the file-size-scan script.
        type: string
        required: false
        default: 'scripts/file_size_scan.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      python_deps: ${{ steps.filter.outputs.python_deps }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/python-changes@main
        id: filter

  actionlint:
    name: actionlint
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    secrets: inherit
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main

  lint:
    name: lint
    needs: changes
    runs-on: [self-hosted, catfood, catfood-python]
    if: ${{ needs.changes.outputs.python == 'true' }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-python-uv@main
        with:
          tool: ruff
          cache-key-prefix: lint
      - run: ruff check ${{ inputs.lint_path }}
        working-directory: ${{ inputs.working-directory }}

  fmt:
    name: fmt
    needs: changes
    runs-on: [self-hosted, catfood, catfood-python]
    if: ${{ inputs.enable_fmt && needs.changes.outputs.python == 'true' }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-python-uv@main
        with:
          tool: ruff
          cache-key-prefix: fmt
      - run: ruff format --check ${{ inputs.fmt_path }}
        working-directory: ${{ inputs.working-directory }}

  typecheck:
    name: typecheck
    needs: changes
    runs-on: [self-hosted, catfood, catfood-python]
    if: ${{ inputs.enable_typecheck && needs.changes.outputs.python == 'true' }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-python-uv@main
        with:
          tool: mypy
          cache-key-prefix: typecheck
      - run: mypy ${{ inputs.typecheck_path }}
        working-directory: ${{ inputs.working-directory }}

  test:
    name: test
    needs: changes
    runs-on: [self-hosted, catfood, catfood-python]
    if: ${{ inputs.enable_test && !inputs.is_dependabot }}
    steps:
      - uses: actions/checkout@v7
      - run: ${{ inputs.test_command }}
        working-directory: ${{ inputs.working-directory }}

  security-scan:
    name: security-scan
    needs: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot && needs.changes.outputs.python_deps == 'true' }}
    # Feeds the `danger-comment` aggregator below. The Trivy step keeps
    # failing the job on its own exit-code (via the final `exit 1` step) -
    # this is still a HARD gate, unchanged - continue-on-error here only
    # lets this job reach its own report/outcome-capturing step instead of
    # stopping dead at Trivy like before.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: vuln
          label: vulnerabilities
          report-heading: '### security-scan'
          working-directory: ${{ inputs.working-directory }}
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - if: ${{ steps.scan.outputs.outcome == 'failure' }}
        run: exit 1

  secret-scan:
    name: secret-scan
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: secret
          label: secrets
          report-heading: '### secret-scan'
          working-directory: ${{ inputs.working-directory }}
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - if: ${{ steps.scan.outputs.outcome == 'failure' }}
        run: exit 1

  dependency-audit:
    name: dependency-audit
    runs-on: [self-hosted, catfood, catfood-python]
    if: ${{ inputs.enable_dependency_audit && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above (still a HARD gate, via the final `exit 1`
    # step).
    outputs:
      outcome: ${{ steps.report.outputs.outcome }}
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-python-uv@main
        with:
          tool: pip-audit
          cache-key-prefix: dependency-audit
      - id: audit
        continue-on-error: true
        run: pip-audit -r ${{ inputs.requirements_file }} 2>&1 | tee /tmp/dependency-audit.log
        working-directory: ${{ inputs.working-directory }}
      - uses: PeterChauYEG/labone-actions/.github/actions/build-dependency-audit-report@main
        id: report
        if: always()
        with:
          outcome: ${{ steps.audit.outcome }}
      - if: ${{ steps.audit.outcome == 'failure' }}
        run: exit 1

  dead-code:
    name: dead-code
    needs: changes
    runs-on: [self-hosted, catfood, catfood-python]
    if: ${{ inputs.enable_dead_code && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above. Advisory-only - never fails the job.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-python-uv@main
        with:
          tool: vulture
          cache-key-prefix: dead-code
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: python3 ${{ inputs.dead_code_script }} 2>&1 | tee /tmp/dead-code.log
      - name: Build dead-code report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "outcome=${{ steps.scan.outcome }}" >> "$GITHUB_OUTPUT"
          {
            echo "report<<DEAD_CODE_REPORT_EOF"
            if [ -f "${{ inputs.working-directory }}/dead-code-report.md" ]; then
              cat "${{ inputs.working-directory }}/dead-code-report.md"
            else
              echo '### dead-code'
              echo
              echo '(no report written - see the dead-code job'"'"'s own log)'
            fi
            echo "DEAD_CODE_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

  duplicate-code:
    name: duplicate-code
    needs: changes
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_duplicate_code && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see dead-code's identical
    # comment above. jscpd's Python tokenizer needs Node, not uv - same
    # reason `robot-7`'s own equivalent job runs on catfood-node.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - name: Install jscpd
        run: |
          tmp="$(mktemp -d)"
          echo "JSCPD_TMP=${tmp}" >> "$GITHUB_ENV"
          NPM_CONFIG_CACHE="${tmp}/npm-cache" npm install --prefix "${tmp}/jscpd" jscpd --silent
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          PATH="${JSCPD_TMP}/jscpd/node_modules/.bin:$PATH" bash ${{ inputs.duplicate_code_script }} duplicate-code-report.md
      - name: Build duplicate-code report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "outcome=${{ steps.scan.outcome }}" >> "$GITHUB_OUTPUT"
          {
            echo "report<<DUPLICATE_CODE_REPORT_EOF"
            if [ -f "${{ inputs.working-directory }}/duplicate-code-report.md" ]; then
              cat "${{ inputs.working-directory }}/duplicate-code-report.md"
            else
              echo '### duplicate-code'
              echo
              echo '(no report written - see the duplicate-code job'"'"'s own log)'
            fi
            echo "DUPLICATE_CODE_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

  file-size:
    name: file-size
    needs: changes
    runs-on: [self-hosted, catfood, catfood-python]
    if: ${{ inputs.enable_file_size && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see dead-code's identical
    # comment above. Report-only by design - `steps.scan` has no `exit 1`
    # step, so this job itself never fails; `outputs.outcome` still reflects
    # a real finding so danger-comment/file-linear-tickets can report on it
    # like every other advisory job (fixes the fleet-wide "file-size never
    # files a ticket" gap - see the CI doc's Migration plan).
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-python-uv@main
        with:
          tool: pylint
          cache-key-prefix: file-size
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: python3 ${{ inputs.file_size_script }}
      - name: Build file-size report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "outcome=${{ steps.scan.outcome }}" >> "$GITHUB_OUTPUT"
          {
            echo "report<<FILE_SIZE_REPORT_EOF"
            if [ -f "${{ inputs.working-directory }}/file-size-report.md" ]; then
              cat "${{ inputs.working-directory }}/file-size-report.md"
            else
              echo '### file-size'
              echo
              echo '(no report written - see the file-size job'"'"'s own log)'
            fi
            echo "FILE_SIZE_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

  # Single aggregator for every scan/gate job above that reports findings:
  # security-scan, secret-scan, dependency-audit, dead-code, duplicate-code,
  # file-size. Posts ONE sticky PR comment covering all six and files
  # (deduped, via scripts/file-linear-ticket.sh - already per-PR-per-job
  # deduped, see that script's own header) a Linear ticket for whichever of
  # them failed - instead of each independently generating its own
  # Dangerfile / posting its own sticky comment / filing its own ticket.
  # Mirrors develop-node-ci.yml's identical `danger-comment` job.
  #
  # `if: always()` so this still runs (and can report) when an upstream job
  # failed - same rationale as required-checks' identical `if: always()`
  # below. The `needs.*.result != 'skipped'` check skips this job entirely
  # only when every one of the six was skipped.
  danger-comment:
    name: danger-comment
    needs: [security-scan, secret-scan, dependency-audit, dead-code, duplicate-code, file-size]
    if: |
      always() &&
      (needs.security-scan.result != 'skipped' ||
       needs.secret-scan.result != 'skipped' ||
       needs.dependency-audit.result != 'skipped' ||
       needs.dead-code.result != 'skipped' ||
       needs.duplicate-code.result != 'skipped' ||
       needs.file-size.result != 'skipped')
    runs-on: [self-hosted, catfood, catfood-python]
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Checked out separately (not the caller repo) purely to get
      # scripts/file-linear-ticket.sh, which lives in labone-actions
      # regardless of which repo calls this workflow.
      - uses: PeterChauYEG/labone-actions/.github/actions/build-danger-comment@main
        with:
          heading: '## Dependency & security checks'
          sticky-header: dependency-checks
          entries: |
            [
              {"name": "security-scan", "result": ${{ toJSON(needs.security-scan.result) }}, "report": ${{ toJSON(needs.security-scan.outputs.report) }}},
              {"name": "secret-scan", "result": ${{ toJSON(needs.secret-scan.result) }}, "report": ${{ toJSON(needs.secret-scan.outputs.report) }}},
              {"name": "dependency-audit", "result": ${{ toJSON(needs.dependency-audit.result) }}, "report": ${{ toJSON(needs.dependency-audit.outputs.report) }}},
              {"name": "dead-code", "result": ${{ toJSON(needs.dead-code.result) }}, "report": ${{ toJSON(needs.dead-code.outputs.report) }}},
              {"name": "duplicate-code", "result": ${{ toJSON(needs.duplicate-code.result) }}, "report": ${{ toJSON(needs.duplicate-code.outputs.report) }}},
              {"name": "file-size", "result": ${{ toJSON(needs.file-size.result) }}, "report": ${{ toJSON(needs.file-size.outputs.report) }}}
            ]
  # One matrix job replaces what used to be nearly-identical
  # "File Linear ticket for <job>" steps living inside `danger-comment`
  # itself (only the job name / report path varied) - see develop-ci.yml's
  # identical job for the full rationale, including why the `matrix`
  # context can't gate this job's own `if:` (only step-level `if:`/`with:`/
  # `run:`).
  file-linear-tickets:
    name: file-linear-ticket (${{ matrix.job }})
    needs: [security-scan, secret-scan, dependency-audit, dead-code, duplicate-code, file-size]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        job: [security-scan, secret-scan, dependency-audit, dead-code, duplicate-code, file-size]
    runs-on: [self-hosted, catfood, catfood-minimal]
    permissions:
      contents: read
    steps:
      - name: Checkout labone-actions scripts
        if: ${{ needs[matrix.job].outputs.outcome == 'failure' }}
        uses: PeterChauYEG/labone-actions/.github/actions/checkout-scripts@main
      - name: File Linear ticket
        if: ${{ needs[matrix.job].outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ needs[matrix.job].outputs.report }}
        run: |
          printf '%s\n' "$REPORT" > /tmp/report.md
          bash labone-actions/scripts/file-linear-ticket.sh ${{ matrix.job }} /tmp/report.md

  # `needs:` lists every job in this file that's currently a REAL (blocking)
  # gate: `lint`, `test`, `security-scan`, `secret-scan`, `dependency-audit`.
  # Deliberately excludes `changes` (infra/plumbing, not a gate itself) and
  # `danger-comment`/`file-linear-tickets` (the aggregated sticky-comment/
  # Linear-ticket jobs above - purely advisory/reporting, neither fails on
  # its own).
  #
  # `if: always()` so this job still runs (and can report a real result)
  # even when an upstream gate job fails/is cancelled - a `skipped` result on
  # any needed job (from `enable_*: false`/`is_dependabot` gating) must NOT
  # fail this job - only `failure`/`cancelled` should.
  required-checks:
    name: required-checks
    needs: [changes, actionlint, lint, fmt, typecheck, test, security-scan, secret-scan, dependency-audit]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
