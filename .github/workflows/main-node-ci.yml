name: Main Node CI

# Reusable push-to-main CI+deploy for yarn/Node/NestJS backend service repos
# (LAB-1247). Callers are thin wrappers: `on: push: branches: [main]` ->
# `uses: PeterChauYEG/labone-actions/.github/workflows/main-node-ci.yml@main`
# with `secrets: inherit`. See README.md for the full caller example.
#
# Mirrors develop-node-ci.yml's job set as plain pass/fail gates (same as
# main-ci.yml's relationship to develop-ci.yml) plus `deploy` and
# `slack-notification`. Input and job names are intentionally identical to
# develop-node-ci.yml's - see that file's header comment for the
# lint/typecheck/test rationale (zero-warnings lint, strict typecheck,
# coverage-threshold-is-the-consumer's-job test gate) - it all applies here
# unchanged.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >
          Directory (relative to the repo root) the Node/NestJS service
          lives in. Defaults to `.` (repo root) so a single-service repo
          caller keeps working with zero changes. Set this for a monorepo
          caller.
        type: string
        required: false
        default: '.'
      is_dependabot:
        description: >
          Whether the triggering commit was authored by dependabot[bot].
          Caller must compute this from github.event.head_commit.author.name,
          since reusable workflows can't see that context directly. When
          true, `test` is skipped (`lint`, `typecheck` and `build` stay on),
          and deploy itself is skipped.
        type: boolean
        required: false
        default: false
      enable_build:
        description: Run `yarn build`.
        type: boolean
        default: true
      enable_test:
        description: Run `yarn test:coverage`.
        type: boolean
        default: true
      enable_deploy:
        description: Push to the dokku remote after all gates pass.
        type: boolean
        default: true
      dokku_remote_url:
        description: >
          Dokku git remote URL to push to, e.g.
          ssh://dokku@192.168.1.31:22/<app-name>. Required if enable_deploy
          is true.
        type: string
        required: false
        default: ''
      enable_slack_notification:
        description: Post the deploy result to Slack after `deploy` completes.
        type: boolean
        default: true
      extra_deps_paths:
        description: >
          Space-separated list of additional paths (relative to
          working-directory) to carry from the `setup` job into every
          downstream job, beyond node_modules - e.g. a gitignored
          src/generated/ directory populated by a `postinstall` codegen
          script (e.g. an OpenAPI SDK). Passed straight through to
          setup-node-yarn's extra-paths input.
        type: string
        required: false
        default: ''
      extra_deps_cache_key_glob_1:
        description: >
          Extra glob (relative to working-directory) folded into every
          job's node_modules cache key alongside yarn.lock - e.g.
          `prisma/schema.prisma` for a repo whose `postinstall` script runs
          `prisma generate`. Without this, the node_modules cache key only
          changes when yarn.lock changes, so editing a `postinstall`
          codegen input without also bumping a dependency leaves every job
          restoring stale generated output (a cache hit skips
          `yarn install`/`postinstall` entirely - see setup-node-yarn's
          `extra-cache-key-glob-1` input for the full rationale). Passed
          straight through to setup-node-yarn/setup-node-pnpm's
          extra-cache-key-glob-1 input in every job below - must be set
          identically across all of them (setup, lint, typecheck, build,
          test) so each job's independently-computed cache key actually
          matches setup's. A caller needing two extra patterns also has
          extra_deps_cache_key_glob_2.
        type: string
        required: false
        default: ''
      extra_deps_cache_key_glob_2:
        description: Second extra glob - see extra_deps_cache_key_glob_1.
        type: string
        required: false
        default: ''
      test_script_args:
        description: >
          Extra args passed straight through to the `test` job's
          cached-script `script-args` input, appended to `yarn
          test:coverage`. Defaults to `--cache --cacheDirectory
          .jestcache`, matching every existing Jest-based caller's prior
          hardcoded behavior with zero changes required on their end. A
          consumer whose `test:coverage` script isn't Jest (e.g. Vitest,
          which doesn't recognize `--cache`/`--cacheDirectory` and exits
          with `CACError: Unknown option --cacheDirectory`) should override
          this - typically to '' - to disable/replace the Jest-specific
          flags.
        type: string
        required: false
        default: '--cache --cacheDirectory .jestcache'

permissions:
  contents: read

# This workflow owns its concurrency group. Callers must NOT declare their
# own `concurrency:` block with this same group - a caller and its nested
# `workflow_call` fighting over one identical group name deadlocks (GitHub
# can't resolve a group shared between a parent run and its own child run)
# and the run gets canceled. See main-ci.yml's identical comment (bit
# laboratory-one-web in production 2026-08-04, blocking every push-to-main
# deploy until the caller's duplicate concurrency block was removed) and
# README.md "Concurrency" for the full explanation, including how this is
# unrelated to (and doesn't replace) the gha-runner host's own per-repo/
# global job-concurrency semaphore.
#
# `cancel-in-progress: true` is a deliberate, confirmed tradeoff: a rapid
# second push to main will cancel whatever the first run's `deploy` step
# was doing mid-flight. That's accepted because leaving main pinned to
# stale code deployed by a superseded run is worse.
concurrency:
  group: main-node-ci-${{ github.repository }}
  cancel-in-progress: true


jobs:
  # LAB-2097: same path-filter pattern as develop-node-ci.yml's `changes`
  # job - see that file's header comment for the full `node`/`ls_lint`
  # filter-list rationale and the "unconfirmed, erring broad" caveat, which
  # applies identically here (main-node-ci.yml intentionally keeps its
  # input/job names identical to develop-node-ci.yml's, per this file's own
  # header comment). This workflow only runs on `push` to main (not
  # `pull_request`), so `dorny/paths-filter@v3` diffs against
  # `github.event.before` instead of a PR base - `pull-requests: read`
  # permission isn't needed here (dropped vs. develop-node-ci.yml's
  # `changes` job), only `contents: read`.
  #
  # Like develop-node-ci.yml, `ls_lint` is unused today - neither this file
  # nor develop-node-ci.yml runs an `ls-lint` job - left in for output-shape
  # parity and so a future `ls-lint` job here can gate on it immediately.
  #
  # A gated job (lint/typecheck/build/test below) that's skipped resolves
  # to `needs.*.result == 'skipped'`, NOT `'failure'` - so `deploy`'s own
  # `if:` (which only blocks on `contains(needs.*.result, 'failure')` /
  # `'cancelled'`, see that job's own comment) still runs normally even on
  # a push whose only changes are docs/config. This is the exact same
  # skipped-doesn't-block-deploy behavior `test` already relies on today
  # via `is_dependabot` (a dependabot push already produces a `skipped`
  # `test` result that doesn't block `deploy`) - LAB-2097 doesn't change
  # that contract, only adds a second, independent way a job can resolve to
  # `skipped`.
  changes:
    name: changes
    runs-on: [self-hosted, catfood]
    permissions:
      contents: read
    outputs:
      node: ${{ steps.filter.outputs.node }}
      ls_lint: ${{ steps.filter.outputs.ls_lint }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/package.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/.yarnrc.yml'
              - '**/tsconfig*.json'
              - '**/.eslintrc*'
              - '**/eslint.config.*'
              - '**/jest.config.*'
              - '**/vitest.config.*'
            ls_lint:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '.ls-lint.yml'

  setup:
    name: setup
    runs-on: [self-hosted, catfood]
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          # Same secret already used by web callers for the private
          # eslint-plugin-lab-react-standards git dependency - a sibling
          # ticket adds a lab-nest-standards rule set to that same
          # labone-eslint-plugin package for backend services, consumed the
          # same way, so this needs to be wired up here too.
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          # Only push-to-main writes a fresh node_modules cache entry - PR
          # runs (develop-node-ci.yml) only read it. See setup-node-yarn's
          # cache-write input description and README.md "Caching strategy".
          cache-write: 'true'

  lint:
    name: lint
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    # See develop-node-ci.yml's `lint` job comment for the skipped-
    # satisfies-branch-protection precedent (this file's own `build`/`test`
    # jobs already skip via `if:` on `enable_*`/`is_dependabot` today, relied
    # on by branch protection) that this new condition rides on.
    if: ${{ needs.changes.outputs.node == 'true' }}
    steps:
      # Zero-tolerance gate: this just runs `yarn lint` and fails on any
      # non-zero exit. Whether that actually means "zero warnings" depends
      # on the caller's own lint script passing --max-warnings=0 to eslint
      # - see develop-node-ci.yml's header comment and README.md.
      # cache-write true: only main-node-ci.yml writes a new .eslintcache
      # entry - see cached-script's cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-deps-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-deps-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: lint
          script-args: --cache --cache-location .eslintcache
          cache-path: .eslintcache
          cache-key-prefix: eslintcache
          cache-key-extra-glob-1: .eslintrc*
          cache-key-extra-glob-2: eslint.config.*
          cache-write: 'true'

  typecheck:
    name: typecheck
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    # See the `lint` job's comment above.
    if: ${{ needs.changes.outputs.node == 'true' }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-deps-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-deps-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: typecheck
          script-args: --incremental --tsBuildInfoFile tsconfig.tsbuildinfo
          cache-path: tsconfig.tsbuildinfo
          cache-key-prefix: tsbuildinfo
          cache-key-extra-glob-1: tsconfig*.json
          cache-write: 'true'

  build:
    name: build
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_build && needs.changes.outputs.node == 'true' }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-deps-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-deps-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: build

  test:
    name: test
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_test && !inputs.is_dependabot && needs.changes.outputs.node == 'true' }}
    steps:
      # Hard gate - does NOT enforce a coverage threshold itself. That's
      # each consumer's responsibility via their own jest/vitest config
      # (recommended default: 90% lines/branches). See README.md.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-deps-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-deps-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: test:coverage
          script-args: ${{ inputs.test_script_args }}
          cache-path: .jestcache
          cache-key-prefix: jestcache
          cache-key-extra-glob-1: jest.config.*
          cache-write: 'true'

  # LAB-2103: single aggregator job so caller repos' branch protection can
  # require ONE context (`required-checks`) instead of a hand-maintained
  # list of this workflow's individual job-name contexts - see
  # develop-node-ci.yml's identical job comment for the full rationale
  # (job/input names are intentionally identical between the two files per
  # this file's own header comment).
  #
  # `needs:` lists this file's REAL (blocking) gates: `lint`, `typecheck`,
  # `build`, `test`. Deliberately excludes `changes`/`setup` (infra, not
  # gates) - this file has no `security-scan`/`dependency-audit`/
  # `dead-code` jobs (unlike `develop-node-ci.yml`), so there's nothing
  # advisory to exclude here. Also deliberately excludes `deploy` and
  # `slack-notification`: this workflow only runs on `push` to `main`, not
  # `pull_request`, so branch protection's required-status-checks
  # mechanism (what `required-checks` exists to aggregate for) never
  # actually applies to it - `required-checks` here mirrors
  # `develop-node-ci.yml`'s gate set 1:1 for consistency/parity rather than
  # gating anything real. Kept to the same 4 jobs as a deliberate, callable
  # judgment: `deploy` has its own well-established `needs.*.result`
  # failure/cancelled check already (see that job's own comment below), so
  # folding it into `required-checks` too would be redundant rather than
  # additive.
  #
  # `if: always()` for the same reason as `deploy`'s own `if:` below -
  # without it, GitHub's default scheduling skips this job outright
  # whenever any `needs:` entry resolves to `skipped` (e.g. every gate job
  # here when `needs.changes.outputs.node == 'false'`), which is the
  # opposite of what an aggregator gate needs. A `skipped` result must NOT
  # fail this job - only `failure`/`cancelled` should.
  required-checks:
    name: required-checks
    needs: [lint, typecheck, build, test]
    runs-on: [self-hosted, catfood]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  deploy:
    name: deploy
    runs-on: [self-hosted, catfood]
    needs: [lint, typecheck, build, test]
    # Skipped-but-not-run gate jobs (enable_* false) must not block deploy,
    # only actual failures/cancellations should - hence checking
    # needs.*.result instead of relying on the default all-must-succeed job
    # dependency semantics, which treats "skipped" the same as "failed" for
    # a needs chain. That intent only actually works with always() here:
    # without it, GitHub's own default scheduling skips this job outright
    # whenever ANY needs entry is skipped (e.g. test, which is skipped for
    # dependabot commits via is_dependabot) before this custom expression is
    # ever evaluated - confirmed live, deploy silently no-op'd on every run
    # triggered by a dependabot commit. always() forces evaluation of the
    # expression below instead of GitHub's implicit success()-only default.
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !inputs.is_dependabot && inputs.enable_deploy
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push to Dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: ${{ inputs.dokku_remote_url }}
          ssh_private_key: ${{ secrets.DOKKU_DEPLOY_SSH_KEY }}
          # dokku/github-action's `branch` input defaults to "master" - every
          # caller here checks out `main` (this workflow only runs on
          # push-to-main), so without this the action pushed main's content
          # to the dokku remote's `master` ref, which Dokku doesn't build
          # from (it warns "you must push to main" and no-ops). The job
          # still reported green because the git push itself succeeded -
          # only the actual deploy silently never happened.
          branch: main

  slack-notification:
    name: slack-notification
    needs: [deploy]
    if: ${{ always() && inputs.enable_slack_notification && needs.deploy.result == 'failure' }}
    runs-on: [self-hosted, catfood]
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.repository }} deploy: ${{ needs.deploy.result }}"
            }
