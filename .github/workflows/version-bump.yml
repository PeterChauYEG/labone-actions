name: Version Bump

# Reusable CalVer version-bump workflow. Callers are thin wrappers: `on:
# schedule` + `workflow_dispatch` -> `uses:
# PeterChauYEG/labone-actions/.github/workflows/version-bump.yml@main` with
# `secrets: inherit`. See README.md for the full caller example.
#
# Converged from laboratory-one-web's and ai-harness-web's byte-identical
# `.github/workflows/version-bump.yml` (verified via diff against
# laboratory-one-web's copy at the time this was written).
#
# IMPORTANT — this workflow depends on the caller repo providing
# `./scripts/bump-version.sh <new-version>`, which actually rewrites the
# version in the repo's own files (package.json etc). That script is
# deliberately NOT centralized here: it's repo-specific (which files carry a
# version string varies per repo), so every caller must have its own copy at
# that exact path.
#
# IMPORTANT — every caller repo MUST have a `GH_PAT` secret (a PAT with at
# least Contents: read/write on that repo). This workflow pushes the bump
# commit and its tag directly to `main`, which is a protected branch — a
# real PAT is required for that push to succeed at all. See the "Verify
# GH_PAT is configured" step below for the failure mode without it.

run-name: Version Bump (CalVer)

on:
  workflow_call: {}

# This workflow owns its concurrency group — do NOT also declare
# `concurrency:` in the caller with this same group. See main-ci.yml's
# identical comment for why (a caller + its nested workflow_call sharing one
# group name deadlocks) and README.md "Concurrency" for the full writeup.
concurrency:
  group: version-bump-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-bump:
    name: version-bump
    runs-on: [self-hosted, catfood]
    steps:
      - name: Verify GH_PAT is configured
        # `main` is a protected branch (required status checks), and this
        # job pushes the bump commit and its tag directly to it —
        # secrets.GITHUB_TOKEN cannot push to a protected branch. Fail
        # loudly here instead of letting `Checkout code` below either
        # silently fall back to GITHUB_TOKEN or fail with an opaque auth
        # error later. To fix: create a PAT scoped to this repo with at
        # least Contents: read/write, then add it as this repo's `GH_PAT`
        # secret.
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::secrets.GH_PAT is not set on this repository. version-bump.yml requires a real PAT (not GITHUB_TOKEN) to push the bump commit and tag directly to the protected main branch. Create a PAT (Contents: read/write) and add it as this repo's GH_PAT secret."
            exit 1
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Self-heal untagged bump commit
        # If the "Create Git Tag" step below ever fails after the bump
        # commit has already been pushed to main (e.g. a transient push
        # failure, or the job getting cancelled between the two pushes),
        # the bump commit lands on main with NO tag, and nothing ever goes
        # back to create it — so any tag-triggered downstream automation
        # (e.g. an EAS build firing on `push: tags: v*`) silently never
        # runs, even though the version bump itself succeeded.
        #
        # Run this on every invocation, before anything else: if main's
        # current HEAD is itself a "chore: bump version to X" commit and the
        # matching tag doesn't exist yet (locally or on origin), create and
        # push it now. This makes a stalled tag self-heal on the very next
        # scheduled/dispatched run.
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          HEAD_MSG=$(git log -1 --format=%s HEAD)

          if [[ "$HEAD_MSG" =~ ^chore:\ bump\ version\ to\ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TAG="v${VERSION}"

            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists on origin, nothing to self-heal"
            else
              echo "HEAD (${HEAD_SHA}) is bump commit for ${VERSION} but ${TAG} is missing on origin — creating it now"
              git tag "$TAG" "$HEAD_SHA"
              git push origin "$TAG"
            fi
          else
            echo "HEAD is not a version-bump commit, nothing to self-heal"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Check for new commits since last bump
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            echo "No previous tag found, proceeding with bump"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW_COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline | grep -v "chore: bump version" || true)
          if [[ -z "$NEW_COMMITS" ]]; then
            echo "No new commits since ${LAST_TAG}, skipping version bump"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found since ${LAST_TAG}, proceeding with bump"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CalVer version
        if: steps.check.outputs.bumped == 'true'
        id: calver
        run: |
          YEAR=$(date +%y)
          # %j is the day of year, already zero-padded to 3 digits (001-366)
          # by GNU/BSD date. Do NOT switch this to the non-padded `%-j` -
          # that drops the format down to 1-2 digits for the first ~99 days
          # of the year (e.g. day 91 -> "91" instead of "091"), which both
          # breaks the intended 2-digit-year.3-digit-day-of-year CalVer
          # shape and, because the resulting CALVER_BASE then never matches
          # a previously-stored zero-padded value, silently resets PATCH to
          # 0 on every run instead of incrementing same-day bumps.
          DAY_OF_YEAR=$(date +%j)
          CALVER_BASE="${YEAR}.${DAY_OF_YEAR}"

          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [[ "$CURRENT_VERSION" == "${CALVER_BASE}."* ]]; then
            PATCH=$(echo "$CURRENT_VERSION" | cut -d'.' -f3)
            if [[ -z "$PATCH" ]]; then
              PATCH=0
            fi
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${CALVER_BASE}.${NEW_PATCH}"
          else
            NEW_VERSION="${CALVER_BASE}.0"
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Bump version in all files
        if: steps.check.outputs.bumped == 'true'
        run: ./scripts/bump-version.sh ${{ steps.calver.outputs.new_version }}

      - name: Commit and push version bump
        # Direct push to main, no PR. `main`'s branch protection only
        # requires status checks (lint, typecheck) that gate PR merges, not
        # direct pushes — "require a pull request before merging" is not
        # enabled on any current caller repo — so a PR here bought nothing
        # but a PR-CI dependency, and this job's self-hosted runner pool has
        # only ~2 ephemeral runners: this job sitting on one of them while
        # polling for its own PR's CI (which needed a runner from the same
        # pool) was pure self-inflicted contention that made the old
        # 15-minute poll time out on nearly every run.
        #
        # `Checkout code` above already authenticated with
        # `token: ${{ secrets.GH_PAT }}`, so actions/checkout persisted that
        # PAT as the credential for this working tree — a plain
        # `git push origin main` picks it up with no extra auth setup.
        if: steps.check.outputs.bumped == 'true'
        id: commit
        run: |
          NEW_VERSION="${{ steps.calver.outputs.new_version }}"

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git add package.json
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push origin main

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag
        if: steps.check.outputs.bumped == 'true'
        run: |
          VERSION="${{ steps.calver.outputs.new_version }}"
          SHA="${{ steps.commit.outputs.sha }}"
          TAG="v${VERSION}"

          git tag "$TAG" "$SHA"
          git push origin "$TAG"
          echo "Tagged $SHA as $TAG"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
