name: Version Bump

# Reusable CalVer version-bump workflow. Callers are thin wrappers: `on:
# schedule` + `workflow_dispatch` -> `uses:
# PeterChauYEG/labone-actions/.github/workflows/version-bump.yml@main` with
# `secrets: inherit`. See README.md for the full caller example.
#
# Converged from laboratory-one-web's and ai-harness-web's byte-identical
# `.github/workflows/version-bump.yml` (verified via diff against
# laboratory-one-web's copy at the time this was written).
#
# IMPORTANT — this workflow depends on the caller repo providing
# `./scripts/bump-version.sh <new-version>`, which actually rewrites the
# version in the repo's own files (package.json etc). That script is
# deliberately NOT centralized here: it's repo-specific (which files carry a
# version string varies per repo), so every caller must have its own copy at
# that exact path.
#
# IMPORTANT — every caller repo MUST have a `GH_PAT` secret (a PAT with at
# least Contents: read/write and Pull requests: read/write on that repo).
# See the "Verify GH_PAT is configured" step below for why this is required
# and what breaks without it (LAB-2087).

run-name: Version Bump (CalVer)

on:
  workflow_call: {}

# This workflow owns its concurrency group — do NOT also declare
# `concurrency:` in the caller with this same group. See main-ci.yml's
# identical comment for why (a caller + its nested workflow_call sharing one
# group name deadlocks) and README.md "Concurrency" for the full writeup.
concurrency:
  group: version-bump-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    name: version-bump
    runs-on: [self-hosted, catfood]
    steps:
      - name: Verify GH_PAT is configured
        # Every git-writing step below (checkout's push credentials, the
        # bump-branch push, and the PR creation) must run as a real PAT, not
        # secrets.GITHUB_TOKEN. GitHub's documented anti-recursion rule
        # suppresses `pull_request`/`push` events for anything authored by
        # GITHUB_TOKEN itself, and this is not a theoretical concern here:
        # across every current caller of this workflow (laboratory-one-web,
        # budget, and others), the automated bot-authored bump commit has
        # NEVER once triggered real CI in its own run history — the job
        # opens the PR, enables auto_merge, and the PR then sits blocked
        # forever until a human happens to push a follow-up commit to the
        # branch (which does trigger CI, because it's human-authored). That
        # backlog of stuck-open bump PRs going back weeks is what this check
        # prevents from recurring silently. (A sibling repo, mangalab,
        # previously concluded GITHUB_TOKEN was fine here and cited a real
        # `pull_request` run as proof — but that run's triggering commit was
        # also human-authored, not the bot's own commit; the underlying bug
        # was misdiagnosed as a non-issue there.)
        #
        # Fail loudly here instead of letting `Checkout code` below either
        # silently fall back to GITHUB_TOKEN or fail with an opaque auth
        # error. To fix: create a PAT scoped to this repo with at least
        # Contents: read/write and Pull requests: read/write, then add it as
        # this repo's `GH_PAT` secret.
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::secrets.GH_PAT is not set on this repository. version-bump.yml requires a real PAT (not GITHUB_TOKEN) to push the bump commit and open its PR, otherwise GitHub's anti-recursion rule silently drops the pull_request event, real CI never runs, and the bump PR never auto-merges (see LAB-2087). Create a PAT (Contents: read/write, Pull requests: read/write) and add it as this repo's GH_PAT secret."
            exit 1
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Check for new commits since last bump
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            echo "No previous tag found, proceeding with bump"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW_COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline | grep -v "chore: bump version" || true)
          if [[ -z "$NEW_COMMITS" ]]; then
            echo "No new commits since ${LAST_TAG}, skipping version bump"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found since ${LAST_TAG}, proceeding with bump"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CalVer version
        if: steps.check.outputs.bumped == 'true'
        id: calver
        run: |
          YEAR=$(date +%y)
          MONTH=$(date +%-m)
          DAY=$(date +%-d)
          CALVER_BASE="${YEAR}.${MONTH}${DAY}"

          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [[ "$CURRENT_VERSION" == "${CALVER_BASE}."* ]]; then
            PATCH=$(echo "$CURRENT_VERSION" | cut -d'.' -f3)
            if [[ -z "$PATCH" ]]; then
              PATCH=0
            fi
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${CALVER_BASE}.${NEW_PATCH}"
          else
            NEW_VERSION="${CALVER_BASE}.0"
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Bump version in all files
        if: steps.check.outputs.bumped == 'true'
        run: ./scripts/bump-version.sh ${{ steps.calver.outputs.new_version }}

      - name: Install gh CLI
        if: steps.check.outputs.bumped == 'true'
        run: |
          command -v gh >/dev/null 2>&1 || (
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg &&
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg &&
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null &&
            sudo apt-get update -q &&
            sudo apt-get install -y gh
          )

      - name: Clean up stale CalVer branches
        if: steps.check.outputs.bumped == 'true'
        run: |
          git fetch --prune origin
          git for-each-ref --format='%(refname:short)' refs/remotes/origin/ci/calver- \
            | sed 's|^origin/||' \
            | grep -v "^ci/calver-${{ steps.calver.outputs.new_version }}$" \
            | while IFS= read -r branch; do
                if git push origin --delete "$branch" 2>/dev/null; then
                  echo "Deleted stale branch: $branch"
                fi
              done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Commit version bump via PR
        if: steps.check.outputs.bumped == 'true'
        run: |
          NEW_VERSION="${{ steps.calver.outputs.new_version }}"
          BRANCH="ci/calver-${NEW_VERSION}"
          REPO="${{ github.repository }}"
          API="https://api.github.com"

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push origin "$BRANCH"

          # No fabricated check-runs here (LAB-2087). The push and the PR
          # creation below both authenticate as GH_TOKEN=secrets.GH_PAT (a
          # real user PAT, not GITHUB_TOKEN), so this branch's push and its
          # PR both raise genuine push/pull_request events — the caller
          # repo's real CI runs against HEAD_SHA and posts its own real
          # check-runs for whatever contexts are actually required, so
          # there's nothing left to fabricate. (A required check that
          # legitimately no-ops for a `[skip ci]`, package.json-only commit
          # — e.g. via a path filter — still reports conclusion "skipped",
          # which GitHub's branch protection treats as satisfying a required
          # status check, same as "success".) Auto-merge below simply queues
          # the PR to merge once those real checks pass, exactly like any
          # other PR.
          PR_RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/pulls" \
            -d "{\"title\":\"chore: bump version to ${NEW_VERSION} [skip ci]\",\"body\":\"Automated CalVer version bump to ${NEW_VERSION}.\",\"head\":\"${BRANCH}\",\"base\":\"main\"}")

          PR_NUMBER=$(echo "$PR_RESPONSE" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>console.log(JSON.parse(d).number))")

          # `PUT /repos/{owner}/{repo}/pulls/{pull_number}/auto_merge` (a raw
          # REST call) is NOT a real GitHub API route — it 404s
          # unconditionally regardless of PR number (confirmed via direct
          # probe: a route-not-found 404, not a PR-not-found 404). GitHub
          # only exposes auto-merge enablement via the GraphQL
          # `enablePullRequestAutoMerge` mutation, which `gh pr merge --auto`
          # wraps. Because the old REST call always failed, this step always
          # fell into its "curl failed" fallback branch below and did an
          # immediate, unconditional squash merge — bypassing every required
          # status check with zero wait, silently reintroducing the exact bug
          # class LAB-2087/LAB-2090 were meant to fix (verified live against
          # mangalab: bump PR #221 merged 2 seconds after creation with zero
          # check-runs and zero workflow runs against its head commit).
          #
          # Fixed by using `gh pr merge --auto` (GraphQL under the hood)
          # instead. If auto-merge isn't allowed on this repo at all, that's
          # a real configuration gap — fail loudly rather than silently
          # falling back to an unconditional bypass merge.
          if [ "$(gh api "repos/${REPO}" --jq .allow_auto_merge)" != "true" ]; then
            echo "::error::Auto-merge is not enabled on ${REPO}, so this workflow cannot safely wait for required status checks before merging the version-bump PR (#${PR_NUMBER}). Enable 'Allow auto-merge' in this repo's Settings > General > Pull Requests, then re-run this workflow. Refusing to fall back to an unconditional merge that would bypass required checks (see LAB-2087/LAB-2090/LAB-2102)."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --auto
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Create Git Tag
        if: steps.check.outputs.bumped == 'true'
        uses: pkgdeps/git-tag-action@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          github_repo: ${{ github.repository }}
          version: ${{ steps.calver.outputs.new_version }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: 'v'
