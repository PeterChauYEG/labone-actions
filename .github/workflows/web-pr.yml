name: Web PR Orchestrator

# Thin orchestrator layer between a Next.js/yarn web repo's own develop.yml
# and develop-ci.yml (LAB-2096). Bakes in what every existing web caller
# repeats today - pr_number/pr_url/is_dependabot computation, the
# `if: github.event.action != 'closed'` guard, the PR concurrency group,
# the actionlint sibling job, and the `pull-requests: write` grant
# develop-ci.yml's a11y/design-system/dead-code/duplicate-code/
# run-e2e-tests/react-tech-debt/max-lines/tech-debt jobs all need (every
# one of them declares its own job-level `permissions: pull-requests:
# write` for sticky-PR-comment/Linear-ticket-filing - see
# develop-node-ci.yml's identical incident, documented in this repo's
# README.md, for why a caller missing this grant fails the ENTIRE run with
# `startup_failure`/0 jobs regardless of which enable_* flags are set).
# templates/web-pr.yml previously had NO permissions block at all for its
# `ci` job - exactly the drift this orchestrator collapses. A caller repo
# `develop.yml` now only needs `uses: .../web-pr.yml@main` with zero
# `with:` keys for the common case.
#
# github.event.pull_request is available here because the outermost
# trigger (the calling repo's own develop.yml) is still `pull_request` -
# that context flows transitively through the whole `workflow_call` chain.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >
          Directory (relative to the repo root) the Next.js/yarn app lives
          in. Set this for a monorepo caller, e.g. `prototype`.
        type: string
        required: false
        default: '.'
      pr_base_sha:
        description: >
          Only used by the `tech-debt` job (when `enable_tech_debt` is
          true) to compute a delta vs. the PR's base branch.
        type: string
        required: false
        default: ''
      also_treat_actions_bot_as_dependabot:
        description: >
          OR'd into the computed is_dependabot expression - set true for a
          repo whose main.yml pre-creates check-runs for its own CalVer
          version-bump PR (opened by github-actions[bot]).
        type: boolean
        required: false
        default: false
      enable_ls_lint:
        description: Run the ls-lint file naming check.
        type: boolean
        default: true
      enable_build:
        description: Run `yarn build`.
        type: boolean
        default: true
      enable_test:
        description: Run `yarn test:coverage`.
        type: boolean
        default: true
      enable_a11y:
        description: Run `yarn a11y` (accessibility scan), advisory only.
        type: boolean
        default: true
      enable_design_system:
        description: Run `yarn design-system`, advisory only.
        type: boolean
        default: true
      enable_dead_code:
        description: Run `yarn dead-code`, advisory only.
        type: boolean
        default: true
      enable_duplicate_code:
        description: Run `yarn duplicate-code`, advisory only.
        type: boolean
        default: true
      enable_e2e:
        description: Run `yarn run-e2e-scan` (Playwright e2e), hard gate.
        type: boolean
        default: true
      enable_react_tech_debt:
        description: Run `yarn react-tech-debt`, advisory only.
        type: boolean
        default: true
      enable_max_lines:
        description: Run `yarn max-lines`, advisory only.
        type: boolean
        default: true
      enable_tech_debt:
        description: >
          Run the grep-based tech-debt metrics report and post it as a
          sticky PR comment. Opt-in - defaults false.
        type: boolean
        default: false
      extra_deps_paths:
        description: >
          Space-separated list of additional paths (relative to
          working-directory) to carry from the `setup` job into every
          downstream job, beyond node_modules and .next/cache.
        type: string
        required: false
        default: ''
      test_script_args:
        description: >
          Extra CLI args forwarded to the caller's `test:coverage` script.
          Override for a Vitest-based caller (see develop-ci.yml's
          identical input for the LAB-1333 caveat).
        type: string
        required: false
        default: '--cache --cacheDirectory .jestcache'

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
    uses: PeterChauYEG/labone-actions/.github/workflows/develop-ci.yml@main
    secrets: inherit
    with:
      working-directory: ${{ inputs.working-directory }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
      pr_base_sha: ${{ inputs.pr_base_sha }}
      is_dependabot: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (inputs.also_treat_actions_bot_as_dependabot && github.event.pull_request.user.login == 'github-actions[bot]') }}
      enable_ls_lint: ${{ inputs.enable_ls_lint }}
      enable_build: ${{ inputs.enable_build }}
      enable_test: ${{ inputs.enable_test }}
      enable_a11y: ${{ inputs.enable_a11y }}
      enable_design_system: ${{ inputs.enable_design_system }}
      enable_dead_code: ${{ inputs.enable_dead_code }}
      enable_duplicate_code: ${{ inputs.enable_duplicate_code }}
      enable_e2e: ${{ inputs.enable_e2e }}
      enable_react_tech_debt: ${{ inputs.enable_react_tech_debt }}
      enable_max_lines: ${{ inputs.enable_max_lines }}
      enable_tech_debt: ${{ inputs.enable_tech_debt }}
      extra_deps_paths: ${{ inputs.extra_deps_paths }}
      test_script_args: ${{ inputs.test_script_args }}

  actionlint:
    if: github.event.action != 'closed'
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
