name: Develop Mobile CI

# Reusable PR-time CI for Expo/React Native mobile repos
# (mc-training-arc-sung-jinwoo-mobile, mangalab, shout-mobile). Callers are
# thin wrappers: `on: pull_request` -> `uses:
# PeterChauYEG/labone-actions/.github/workflows/develop-mobile-ci.yml@main`
# with `secrets: inherit`. See README.md for the full caller example.
#
# CALLER'S `ci` JOB MUST ALSO SET `permissions: {contents: read,
# pull-requests: write}` — the `danger-comment` aggregator job below (see
# its own `permissions:` block) needs `pull-requests: write` for its
# sticky-PR-comment feature, and GitHub validates the full callee
# permission graph before dispatching any job, so a caller missing this
# fails its ENTIRE PR CI run with `startup_failure`/0 jobs, even with every
# `enable_*` flag off. `templates/mobile-pr.yml` already has this set
# correctly. See README.md's "`develop-mobile-ci.yml`" caller example for
# the full explanation.
#
# Same cache-restore-per-job caching strategy as develop-node-ci.yml (LAB-1371,
# both are Yarn Berry - reuses the same setup-node-yarn action as-is), but a
# mobile-app-shaped job set: lint/ls-lint/
# typecheck/test plus the web-style a11y/design-system/dead-code/
# duplicate-code scans (all three source repos already run these, unlike
# develop-node-ci.yml's backend-service callers, which have none of them -
# this is closer in spirit to develop-ci.yml's Next.js job set than
# develop-node-ci.yml's plain NestJS one).
#
# Every job that reports findings (peer-deps/a11y/design-system/dead-code/
# duplicate-code/security-scan/secret-scan/dependency-audit/tech-debt) now
# just runs its check with `continue-on-error: true` and exposes
# `outputs: {outcome, report}` - posting a sticky PR comment and filing a
# (deduped, via scripts/file-linear-ticket.sh) Linear ticket on failure is
# centralized in the single `danger-comment` aggregator job near the end of
# this file, rather than each of the nine independently generating its own
# Dangerfile/comment/ticket, which is what this repo did until now. Each
# job still fails itself (an explicit final `exit 1` step) exactly when it
# used to - `danger-comment` only adds reporting, it changes no pass/fail
# semantics. pr_number/pr_url are caller-supplied for the same reason
# godot-develop-ci.yml takes them.
#
# `is_dependabot` should be computed by the caller to also cover
# `github-actions[bot]` (the CalVer version-bump PRs main.yml opens against
# itself) alongside the literal `dependabot[bot]` check - see README.md.
# Only mangalab's current CI actually guards every job against
# github-actions[bot] today; the other two repos' PR workflow don't, which
# looks like a latent gap rather than an intentional difference.
#
# `peer-deps` is a hard, always-on gate that runs `yarn install --immutable`
# and fails if any YN0060 (incompatible peer dependency) lines appear in the
# output. Runs as a plain checkout+corepack+setup-node job (no node_modules
# cache needed) so it stays fast and independent of the `setup` job. No
# `.yarnrc.yml` changes are required in individual repos - detection is done
# by grepping the install output directly.
#
# `lint`/`typecheck` are HARD, always-on gates (no dependabot skip - a
# broken lint/type error is exactly what a dependency bump can cause,
# mirroring develop-node-ci.yml's same reasoning for its own lint/
# typecheck jobs).
#
# `security-scan`/`dependency-audit` reimplement the same Trivy/audit
# invocations security-scan.yml and develop-node-ci.yml already established
# as inline steps (not nested `uses:` calls) so they run against the
# restored, installed tree - same reasoning as develop-node-ci.yml.
# `dependency-audit` (`yarn npm audit`) is a genuinely new capability: none
# of the three source repos have an audit job in their PR workflow today.
#
# `tech-debt` is develop-ci.yml's grep-based tech-debt metrics
# report (useEffect/RN Animated/eslint-disable/@ts-ignore/any/TODO-FIXME-
# HACK/console.log counts), reused as-is here since it's stack-agnostic
# TypeScript/React counting, not web- or Next.js-specific. Same opt-in
# `enable_tech_debt` (default false) and `pr_base_sha` delta input as
# develop-ci.yml - see `.github/actions/tech-debt-report`'s own header
# comment for the full metric list.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory (relative to the repo root) the Expo app lives in.
        type: string
        required: false
        default: '.'
      pr_number:
        type: number
        required: false
        default: 0
      pr_url:
        type: string
        required: false
        default: ''
      pr_base_sha:
        description: >
          github.event.pull_request.base.sha from the caller. Only used by
          the `tech-debt` job (when `enable_tech_debt` is true) to compute
          a delta vs. the PR's base branch. Leave empty (default) to skip
          the delta and get current-totals only.
        type: string
        required: false
        default: ''
      is_dependabot:
        description: >
          Whether this PR was opened by dependabot[bot] (or, per this
          file's header comment, by github-actions[bot] for a CalVer
          version-bump PR). Caller must compute this from
          github.event.pull_request.user.login. When true, `ls-lint`,
          `test`, `a11y`, `design-system`, `dead-code`, `duplicate-code`,
          `security-scan` and `dependency-audit` are skipped (`lint` and
          `typecheck` stay on).
        type: boolean
        required: false
        default: false
      enable_ls_lint:
        description: Run `yarn lint:ls` (filename/directory convention lint).
        type: boolean
        default: true
      enable_test:
        description: Run `yarn test:coverage` + upload to Codecov.
        type: boolean
        default: true
      codecov_use_oidc:
        description: >
          Use Codecov's OIDC auth instead of a token. Both modes exist
          across the three source repos' own workflows today (even
          inconsistently within a single repo) - default false (token
          mode), set true for OIDC-configured callers.
        type: boolean
        default: false
      codecov_token_secret_name:
        description: >
          Name of the secret holding the Codecov upload token, only used
          when codecov_use_oidc is false. Reusable workflows can't
          reference `secrets.<dynamic-name>` directly, so this is
          documentation for the caller's `secrets: inherit` - the job
          itself always reads `secrets.CODECOV_TOKEN`. Kept as an input so
          a caller using a differently-named secret knows to rename it
          before adopting this workflow, rather than silently getting an
          empty token.
        type: string
        required: false
        default: 'CODECOV_TOKEN'
      enable_a11y:
        description: Run `yarn a11y`.
        type: boolean
        default: true
      enable_design_system:
        description: Run `yarn design-system`.
        type: boolean
        default: true
      enable_dead_code:
        description: Run `yarn dead-code` (knip).
        type: boolean
        default: true
      enable_duplicate_code:
        description: >
          Run `yarn duplicate-code` (jscpd). Off by default -
          mc-training-arc-sung-jinwoo-mobile has no .jscpd.json/job today,
          unlike mangalab/shout-mobile which both do.
        type: boolean
        default: false
      enable_security_scan:
        description: Run the Trivy filesystem vuln/secret scan (HIGH,CRITICAL fail).
        type: boolean
        default: true
      security_scan_trivyignores:
        description: >
          Comma-separated list of relative paths to .trivyignore file(s), or
          a single .trivyignore.yaml file, passed straight through to
          trivy-action's `trivyignores` input. Empty by default.
        type: string
        required: false
        default: ''
      enable_dependency_audit:
        description: >
          Run `yarn npm audit`. Off by default - genuinely new, no source
          repo has this in its PR workflow today.
        type: boolean
        default: false
      enable_tech_debt:
        description: >
          Run the grep-based tech-debt metrics report (useEffect/RN
          Animated/eslint-disable/@ts-ignore/any/TODO-FIXME-HACK/
          console.log counts) and post it as a sticky PR comment. Opt-in -
          defaults false since no source repo has this today.
        type: boolean
        default: false
      extra_deps_paths:
        description: >
          Space-separated list of additional paths (relative to
          working-directory) to carry from the `setup` job into every
          downstream job, beyond node_modules. Passed straight through to
          setup-node-yarn's extra-paths input.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      mobile_source: ${{ steps.filter.outputs.mobile_source }}
      mobile_deps: ${{ steps.filter.outputs.mobile_deps }}
      tsconfig: ${{ steps.filter.outputs.tsconfig }}
      eslint_config: ${{ steps.filter.outputs.eslint_config }}
      jest_config: ${{ steps.filter.outputs.jest_config }}
      react_ui: ${{ steps.filter.outputs.react_ui }}
      ls_lint: ${{ steps.filter.outputs.ls_lint }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/mobile-changes@main
        id: filter

  actionlint:
    name: actionlint
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    secrets: inherit
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
      pr_url: ${{ inputs.pr_url }}

  setup:
    name: setup
    needs: changes
    runs-on: [self-hosted, catfood]
    steps:
      # cache-write: 'false' - unlike main-ci.yml/main-node-ci.yml's own
      # `setup` job, this workflow has no push-to-main trigger to gate a
      # write on at all (see the `lint`/`typecheck`/`test` jobs' own
      # comments below), so every mobile job only ever reads an existing
      # bundle from setup-node-yarn's shared, host-persistent
      # content-addressed store, falling back to a fully local, unshared
      # install on a miss - never writing into that shared store itself.
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: setup
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          cache-write: 'false'

  peer-deps:
    name: peer-deps
    needs: changes
    # catfood-node, not catfood-minimal: this job's own steps run
    # `corepack enable` + `actions/setup-node@v7`, which need the Node
    # toolchain catfood-minimal deliberately excludes (see images/minimal's
    # own description in gha-runner-docker's README) - same fix as
    # develop-ci.yml's identical peer-deps job, see that one's comment for
    # the confirmed live failure this caused.
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ needs.changes.outputs.mobile_deps == 'true' }}
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment. Still a HARD gate (unchanged) via the final `exit 1` step.
    outputs:
      outcome: ${{ steps.check.outputs.outcome }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/peer-deps-check@main
        id: check
        with:
          working-directory: ${{ inputs.working-directory }}
      - if: ${{ steps.check.outputs.outcome == 'failure' }}
        run: exit 1

  lint:
    name: lint
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    if: ${{ needs.changes.outputs.mobile_source == 'true' || needs.changes.outputs.mobile_deps == 'true' || needs.changes.outputs.eslint_config == 'true' }}
    steps:
      # No main-*-ci.yml counterpart exists for mobile repos in this repo,
      # so the .eslintcache script cache stays a plain restore+save
      # (cache-write: 'true', unaffected - still ordinary actions/cache,
      # safely scoped per-PR-branch by GitHub itself). deps-cache-write is
      # set independently to 'false': setup-node-yarn's shared,
      # host-persistent bundle store has no such per-branch scoping (it's
      # one directory per repo, content-addressed by lockfile hash across
      # every branch), so it must only ever be written by an actual
      # push-to-main run - which this workflow never is. See
      # cached-script's deps-cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: lint
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: lint
          script-args: --cache --cache-location .eslintcache
          cache-path: .eslintcache
          cache-key-prefix: eslintcache
          cache-key-extra-glob-1: .eslintrc*
          cache-key-extra-glob-2: eslint.config.*
          cache-write: 'true'
          deps-cache-write: 'false'

  ls-lint:
    name: ls-lint
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_ls_lint && !inputs.is_dependabot && needs.changes.outputs.ls_lint == 'true' }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: ls-lint
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - run: yarn lint:ls
        working-directory: ${{ inputs.working-directory }}

  typecheck:
    name: typecheck
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    steps:
      # No main-*-ci.yml counterpart exists for mobile repos, so the
      # tsbuildinfo script cache stays a plain restore+save (cache-write:
      # 'true', unaffected - ordinary actions/cache, safely scoped
      # per-PR-branch). deps-cache-write: 'false' independently - see
      # `lint`'s identical comment above and cached-script's
      # deps-cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: typecheck
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: typecheck
          script-args: --incremental --tsBuildInfoFile tsconfig.tsbuildinfo
          cache-path: tsconfig.tsbuildinfo
          cache-key-prefix: tsbuildinfo
          cache-key-extra-glob-1: tsconfig*.json
          cache-write: 'true'
          deps-cache-write: 'false'

  test:
    name: test
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_test && !inputs.is_dependabot }}
    steps:
      # No main-*-ci.yml counterpart exists for mobile repos, so the
      # jestcache script cache stays a plain restore+save (cache-write:
      # 'true', unaffected - ordinary actions/cache, safely scoped
      # per-PR-branch), same as lint/typecheck above (LAB-1333).
      # deps-cache-write: 'false' independently - see `lint`'s identical
      # comment above and cached-script's deps-cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: test
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: test:coverage
          script-args: --cache --cacheDirectory .jestcache
          cache-path: .jestcache
          cache-key-prefix: jestcache
          cache-key-extra-glob-1: jest.config.*
          cache-write: 'true'
          deps-cache-write: 'false'
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: ${{ inputs.codecov_use_oidc }}
          token: ${{ !inputs.codecov_use_oidc && secrets.CODECOV_TOKEN || '' }}
          working-directory: ${{ inputs.working-directory }}

  a11y:
    name: a11y
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_a11y && !inputs.is_dependabot && needs.changes.outputs.react_ui == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: a11y
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: a11y
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/a11y-report.md
          working-directory: ${{ inputs.working-directory }}

  design-system:
    name: design-system
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_design_system && !inputs.is_dependabot && needs.changes.outputs.react_ui == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: design-system
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: design-system
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/design-system-report.md
          working-directory: ${{ inputs.working-directory }}

  dead-code:
    name: dead-code
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_dead_code && !inputs.is_dependabot && needs.changes.outputs.mobile_source == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: dead-code
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: dead-code
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/dead-code-report.md
          working-directory: ${{ inputs.working-directory }}

  duplicate-code:
    name: duplicate-code
    needs: [setup, changes]
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_duplicate_code && !inputs.is_dependabot && needs.changes.outputs.mobile_source == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: duplicate-code
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: duplicate-code
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/report/jscpd-report.md
          working-directory: ${{ inputs.working-directory }}

  security-scan:
    name: security-scan
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot && needs.changes.outputs.mobile_deps == 'true' }}
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment. Still a HARD gate (unchanged) via the final `exit 1` step.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: vuln
          label: vulnerabilities
          report-heading: '### security-scan'
          working-directory: ${{ inputs.working-directory }}
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - if: ${{ steps.scan.outputs.outcome == 'failure' }}
        run: exit 1

  secret-scan:
    name: secret-scan
    needs: setup
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: secret
          label: secrets
          report-heading: '### secret-scan'
          working-directory: ${{ inputs.working-directory }}
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - if: ${{ steps.scan.outputs.outcome == 'failure' }}
        run: exit 1

  dependency-audit:
    name: dependency-audit
    needs: setup
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_dependency_audit && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      # `yarn npm audit` resolves entirely from yarn.lock against the
      # registry - no installed node_modules tree needed, just the yarn
      # binary itself. So this job checks out + enables Corepack + sets up
      # Node directly instead of restoring the setup job's full deps
      # artifact like every other job here.
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.working-directory }}/package.json
      - id: audit
        continue-on-error: true
        run: yarn npm audit 2>&1 | tee /tmp/dependency-audit.log
        working-directory: ${{ inputs.working-directory }}
      - name: Build dependency-audit report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          outcome="${{ steps.audit.outcome }}"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "report<<DEPENDENCY_AUDIT_REPORT_EOF"
            echo '### dependency-audit'
            echo
            if [ "$outcome" = 'failure' ]; then
              echo '❌ Known vulnerabilities found:'
              echo '```'
              tail -n 60 /tmp/dependency-audit.log 2>/dev/null || echo '(no log captured)'
              echo '```'
            else
              echo '✅ No known vulnerabilities found.'
            fi
            echo "DEPENDENCY_AUDIT_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - if: ${{ steps.audit.outcome == 'failure' }}
        run: exit 1

  tech-debt:
    name: tech-debt
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_tech_debt && !inputs.is_dependabot && needs.changes.outputs.mobile_source == 'true' }}
    permissions:
      contents: read
    # Feeds the `danger-comment` aggregator below - metrics-only, never
    # fails (no `outcome`/ticket-filing - matching this action's own "never
    # fails the job" contract), just a report section in the combined
    # comment.
    outputs:
      report: ${{ steps.tech-debt-report.outputs.report }}
    steps:
      # No setup-node-yarn call: this is a plain grep over the tracked
      # .ts/.tsx tree, no installed node_modules needed - just check out
      # the repo, same as security-scan/dependency-audit above.
      - uses: actions/checkout@v7
      - uses: PeterChauYEG/labone-actions/.github/actions/tech-debt-report@main
        id: tech-debt-report
        with:
          working-directory: ${{ inputs.working-directory }}
          pr-number: ${{ inputs.pr_number }}
          base-sha: ${{ inputs.pr_base_sha }}

  # Single aggregator for every scan/gate job above that reports findings:
  # peer-deps, a11y, design-system, dead-code, duplicate-code, security-scan,
  # secret-scan, dependency-audit, tech-debt. Posts ONE sticky PR comment
  # covering all nine and files (deduped, via scripts/file-linear-ticket.sh)
  # a Linear ticket for whichever of them failed - instead of each
  # independently generating its own Dangerfile / posting its own sticky
  # comment / filing its own ticket, which is what this repo did until now.
  # `tech-debt` is metrics-only and never fails (no `outcome` output, so no
  # ticket-filing step for it below) - its report still gets a section in
  # the combined comment.
  #
  # `if: always()` so this still runs (and can report) when an upstream job
  # failed - same rationale as required-checks' identical `if: always()`
  # below. Skips entirely only when every one of the nine was skipped.
  danger-comment:
    name: danger-comment
    needs:
      [
        peer-deps,
        a11y,
        design-system,
        dead-code,
        duplicate-code,
        security-scan,
        secret-scan,
        dependency-audit,
        tech-debt,
      ]
    if: |
      always() &&
      (needs.peer-deps.result != 'skipped' ||
       needs.a11y.result != 'skipped' ||
       needs.design-system.result != 'skipped' ||
       needs.dead-code.result != 'skipped' ||
       needs.duplicate-code.result != 'skipped' ||
       needs.security-scan.result != 'skipped' ||
       needs.secret-scan.result != 'skipped' ||
       needs.dependency-audit.result != 'skipped' ||
       needs.tech-debt.result != 'skipped')
    runs-on: [self-hosted, catfood]
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Checked out separately (not the caller repo) purely to get
      # scripts/file-linear-ticket.sh, which lives in labone-actions
      # regardless of which repo calls this workflow.
      - uses: PeterChauYEG/labone-actions/.github/actions/build-danger-comment@main
        with:
          heading: '## Dependency & code-health checks'
          sticky-header: dependency-checks
          entries: |
            [
              {"name": "peer-deps", "result": ${{ toJSON(needs.peer-deps.result) }}, "report": ${{ toJSON(needs.peer-deps.outputs.report) }}},
              {"name": "a11y", "result": ${{ toJSON(needs.a11y.result) }}, "report": ${{ toJSON(needs.a11y.outputs.report) }}},
              {"name": "design-system", "result": ${{ toJSON(needs.design-system.result) }}, "report": ${{ toJSON(needs.design-system.outputs.report) }}},
              {"name": "dead-code", "result": ${{ toJSON(needs.dead-code.result) }}, "report": ${{ toJSON(needs.dead-code.outputs.report) }}},
              {"name": "duplicate-code", "result": ${{ toJSON(needs.duplicate-code.result) }}, "report": ${{ toJSON(needs.duplicate-code.outputs.report) }}},
              {"name": "security-scan", "result": ${{ toJSON(needs.security-scan.result) }}, "report": ${{ toJSON(needs.security-scan.outputs.report) }}},
              {"name": "secret-scan", "result": ${{ toJSON(needs.secret-scan.result) }}, "report": ${{ toJSON(needs.secret-scan.outputs.report) }}},
              {"name": "dependency-audit", "result": ${{ toJSON(needs.dependency-audit.result) }}, "report": ${{ toJSON(needs.dependency-audit.outputs.report) }}},
              {"name": "tech-debt", "result": ${{ toJSON(needs.tech-debt.result) }}, "report": ${{ toJSON(needs.tech-debt.outputs.report) }}}
            ]
      - name: File Linear ticket for peer-deps
        if: ${{ needs.peer-deps.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh peer-deps /tmp/peer-deps-report.md
      - name: File Linear ticket for a11y
        if: ${{ needs.a11y.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh a11y /tmp/a11y-report.md
      - name: File Linear ticket for design-system
        if: ${{ needs.design-system.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh design-system /tmp/design-system-report.md
      - name: File Linear ticket for dead-code
        if: ${{ needs.dead-code.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh dead-code /tmp/dead-code-report.md
      - name: File Linear ticket for duplicate-code
        if: ${{ needs.duplicate-code.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh duplicate-code /tmp/duplicate-code-report.md
      - name: File Linear ticket for security-scan
        if: ${{ needs.security-scan.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh security-scan /tmp/security-scan-report.md
      - name: File Linear ticket for secret-scan
        if: ${{ needs.secret-scan.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh secret-scan /tmp/secret-scan-report.md
      - name: File Linear ticket for dependency-audit
        if: ${{ needs.dependency-audit.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh dependency-audit /tmp/dependency-audit-report.md

  required-checks:
    name: required-checks
    needs: [changes, actionlint, setup, peer-deps, lint, ls-lint, typecheck, test, a11y, design-system, dead-code, duplicate-code, security-scan, secret-scan, dependency-audit, tech-debt]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
