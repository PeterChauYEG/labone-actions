name: Node PR Orchestrator

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: '.'
      package_manager:
        type: string
        required: false
        default: 'yarn'
      also_treat_actions_bot_as_dependabot:
        type: boolean
        required: false
        default: false
      enable_dependency_audit:
        description: Set false if this repo is Yarn Classic, not Berry.
        type: boolean
        default: true
      security_scan_trivyignores:
        type: string
        required: false
        default: ''
      extra_deps_paths:
        type: string
        required: false
        default: ''
      extra_deps_cache_key_glob_1:
        type: string
        required: false
        default: ''
      extra_deps_cache_key_glob_2:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
    uses: PeterChauYEG/labone-actions/.github/workflows/develop-node-ci.yml@main
    secrets: inherit
    with:
      working-directory: ${{ inputs.working-directory }}
      package_manager: ${{ inputs.package_manager }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
      is_dependabot: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (inputs.also_treat_actions_bot_as_dependabot && github.event.pull_request.user.login == 'github-actions[bot]') }}
      enable_build: true
      enable_test: true
      enable_security_scan: true
      enable_dependency_audit: ${{ inputs.enable_dependency_audit }}
      enable_dead_code: false
      security_scan_trivyignores: ${{ inputs.security_scan_trivyignores }}
      extra_deps_paths: ${{ inputs.extra_deps_paths }}
      extra_deps_cache_key_glob_1: ${{ inputs.extra_deps_cache_key_glob_1 }}
      extra_deps_cache_key_glob_2: ${{ inputs.extra_deps_cache_key_glob_2 }}

  actionlint:
    if: github.event.action != 'closed'
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
