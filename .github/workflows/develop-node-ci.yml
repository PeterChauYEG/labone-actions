name: Develop Node CI

# Reusable PR-time CI for yarn- or pnpm-based Node/NestJS backend service
# repos (LAB-1247, pnpm support LAB-1268). Callers are thin wrappers: `on:
# pull_request` -> `uses:
# PeterChauYEG/labone-actions/.github/workflows/develop-node-ci.yml@main`
# with `secrets: inherit`. See README.md for the full caller example.
#
# CALLER'S `ci` JOB MUST ALSO SET `permissions: {contents: read,
# pull-requests: write}` — the `dead-code`/`duplicate-code` jobs below (see
# their own `permissions:` blocks) need `pull-requests: write` for their
# sticky-PR-comment feature, and GitHub validates the full callee
# permission graph before dispatching any job, so a caller missing this
# fails its ENTIRE PR CI run with `startup_failure`/0 jobs, even with
# `enable_dead_code`/`enable_duplicate_code` off. See README.md's
# "`develop-node-ci.yml` — inputs and jobs" caller example for the full
# explanation.
#
# This is the backend-service sibling of develop-ci.yml (which targets
# Next.js/React web repos) - same `setup` + artifact-restore caching
# strategy and the same `enable_*`/`is_dependabot` input conventions, but a
# different, backend-appropriate job set: no a11y/design-system/e2e/
# react-tech-debt/max-lines scans (those are web-specific and have no
# NestJS equivalent yarn script). Most jobs here are still plain pass/fail
# gates, matching how main-ci.yml's jobs already behave, but `dead-code`
# and `duplicate-code` are the exception - like develop-ci.yml's identical
# jobs, they post a sticky PR comment and file a Linear ticket on failure
# (advisory-only, `blocking: 'false'`, so neither ever fails the job
# itself).
#
# `lint` is a HARD, ZERO-TOLERANCE gate: this workflow only runs `<package
# manager> lint` and fails the job on any non-zero exit. It CANNOT itself
# enforce "zero warnings" - that depends entirely on the caller's own `lint`
# script in package.json invoking eslint with `--max-warnings=0` (e.g.
# `eslint . --max-warnings=0`). A caller whose `lint` script omits that flag
# will have warnings silently pass through as a green check. See README.md.
#
# `typecheck` expects the caller to run `tsc --noEmit` (or equivalent)
# against a `tsconfig.json` that extends the shared `strict: true`
# `tsconfig.base.json` in labone-eslint-plugin.
#
# `test` runs `<package manager> test:coverage` as a HARD gate, but this
# workflow has no visibility into per-service coverage thresholds - it
# relies entirely on the test runner's own exit code. Coverage-threshold
# enforcement (jest `coverageThreshold` / vitest `coverage.thresholds`) is
# each consumer's responsibility; a recommended default is 90%
# lines/branches. A caller with no coverage threshold configured gets a
# green check on any coverage number, including 0%. See README.md.
#
# `security-scan` restores deps then runs the same Trivy invocation
# security-scan.yml already established (severity HIGH,CRITICAL,
# exit-code 1, no default `.trivyignore` baseline shipped from here - any
# suppression is a deliberate, visible `.trivyignore`/`.trivyignore.yaml`
# living in the consumer repo, passed in via `security_scan_trivyignores`).
# Reimplemented as inline steps here (not a nested `uses:
# security-scan.yml` call) so it can restore the deps artifact like every
# other job below and scan the installed tree, not just the lockfile.
#
# `dependency-audit` runs `yarn npm audit` for `package_manager: yarn`
# callers (this repo, and the yarn-based NestJS services it targets, are on
# Yarn Berry - see setup-node-yarn's `.yarn/cache` paths - so this is the
# Berry command; Yarn Classic repos would use `yarn audit` instead) or
# `pnpm audit` for `package_manager: pnpm` callers, as a HARD gate with no
# severity floor: any known vulnerability fails the job.
#
# `package_manager` (LAB-1268) selects between the two - see the input's own
# description below for the full contract. Every `<package manager>
# <script>` step in this file is written as `${{ inputs.package_manager }}
# <script>` so switching the input is the only change a caller needs to
# make; both CLIs accept the same "run this package.json script, forward
# extra args" invocation syntax.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >
          Directory (relative to the repo root) the Node/NestJS service
          lives in. Defaults to `.` (repo root) so a single-service repo
          caller keeps working with zero changes. Set this for a monorepo
          caller.
        type: string
        required: false
        default: '.'
      package_manager:
        description: >
          Package manager the caller repo uses - 'yarn' or 'pnpm'
          (LAB-1268). Selects setup-node-yarn vs. setup-node-pnpm in the
          `setup` job and every downstream job (each job restores deps
          itself via cached-script - see cached-script/setup-node-yarn's
          own descriptions), and is substituted directly as the CLI
          command in every "<package manager> <script>" step below (e.g.
          "pnpm lint") - both CLIs accept the same "run this package.json
          script" invocation syntax. Also selects which lockfile
          (yarn.lock vs pnpm-lock.yaml) the dependency-audit job's
          install-vuln-check command targets. Defaults to 'yarn' so every
          existing caller keeps working with zero changes.
        type: string
        required: false
        default: 'yarn'
      is_dependabot:
        description: >
          Whether this PR was opened by dependabot[bot]. Caller must
          compute this from github.event.pull_request.user.login, since
          reusable workflows can't see that context directly. When true,
          `test`, `security-scan` and `dependency-audit` are skipped
          (`lint`, `typecheck` and `build` stay on - a broken build/type
          error is exactly what a dependency bump can cause).
        type: boolean
        required: false
        default: false
      pr_number:
        description: >
          github.event.pull_request.number from the caller. Only used by
          the `dead-code` and `duplicate-code` jobs (when `enable_dead_code`/
          `enable_duplicate_code` is true) for their sticky PR comment and
          Linear ticket-filing link - see develop-ci.yml's identical input
          for the pattern this was copied from. Harmless to leave at its
          default (0) for every caller that doesn't enable either.
        type: number
        required: false
        default: 0
      pr_url:
        description: >
          github.event.pull_request.html_url from the caller. Only used by
          the `dead-code` and `duplicate-code` jobs (when
          `enable_dead_code`/`enable_duplicate_code` is true) - see
          `pr_number` above.
        type: string
        required: false
        default: ''
      enable_ls_lint:
        description: >
          Run the ls-lint file naming check (`yarn lint:ls`), gated on the
          `changes` job's `ls_lint` output. Opt-in, unlike develop-ci.yml's
          identical input (which defaults true) - this is a brand-new
          capability for backend repos and no caller has migrated to it
          yet, so each repo opts in explicitly as it migrates, same
          rationale as `enable_dead_code` below.
        type: boolean
        required: false
        default: false
      enable_build:
        description: Run `yarn build`.
        type: boolean
        default: true
      enable_test:
        description: Run `yarn test:coverage`.
        type: boolean
        default: true
      enable_security_scan:
        description: Run the Trivy filesystem vuln/secret scan (HIGH,CRITICAL fail).
        type: boolean
        default: true
      enable_dependency_audit:
        description: Run `yarn npm audit` (fails on any known vulnerability).
        type: boolean
        default: true
      enable_dead_code:
        description: >
          Run a dead-code scan (`yarn dead-code`) with a sticky PR comment +
          Linear ticket filing on failure, advisory-only (never blocks the
          job - see `scan-with-report`'s `blocking` input). Opt-in, unlike
          most other `enable_*` inputs above - defaults false since no
          consumer repo of this workflow has this today (LAB-1866). Mirrors
          develop-ci.yml's `dead-code` job. Note: the underlying
          `scan-with-report` action always runs `yarn <script>` regardless
          of `package_manager`, so this only works for `package_manager:
          yarn` callers today - a `pnpm` caller enabling this would fail.
        type: boolean
        required: false
        default: false
      enable_duplicate_code:
        description: >
          Run a duplicate-code scan (`yarn duplicate-code`) with a sticky
          PR comment + Linear ticket filing on failure, advisory-only
          (never blocks the job - see `scan-with-report`'s `blocking`
          input). Opt-in, unlike most other `enable_*` inputs above -
          defaults false since no consumer repo of this workflow has this
          today, same rationale as `enable_dead_code` above. Mirrors
          develop-ci.yml's `duplicate-code` job. Note: the underlying
          `scan-with-report` action always runs `yarn <script>` regardless
          of `package_manager`, so this only works for `package_manager:
          yarn` callers today - a `pnpm` caller enabling this would fail.
        type: boolean
        required: false
        default: false
      security_scan_trivyignores:
        description: >
          Comma-separated list of relative paths to .trivyignore file(s), or
          a single .trivyignore.yaml file, passed straight through to
          trivy-action's `trivyignores` input. Empty by default - this
          shared workflow ships no default ignore baseline, so every
          suppression is a deliberate, visible file living in the consumer
          repo. See README.md.
        type: string
        required: false
        default: ''
      extra_deps_paths:
        description: >
          Space-separated list of additional paths (relative to
          working-directory) to carry from the `setup` job into every
          downstream job, beyond node_modules - e.g. a gitignored
          src/generated/ directory populated by a `postinstall` codegen
          script (e.g. an OpenAPI SDK). Passed straight through to
          setup-node-yarn's extra-paths input.
        type: string
        required: false
        default: ''
      extra_deps_cache_key_glob_1:
        description: >
          Extra glob (relative to working-directory) folded into every
          job's node_modules cache key alongside yarn.lock/pnpm-lock.yaml -
          e.g. `prisma/schema.prisma` for a repo whose `postinstall` script
          runs `prisma generate`. Without this, the node_modules cache key
          only changes when the lockfile changes, so editing a
          `postinstall` codegen input without also bumping a dependency
          leaves every job restoring stale generated output (a cache hit
          skips `install`/`postinstall` entirely - see setup-node-yarn's
          `extra-cache-key-glob-1` input for the full rationale). Passed
          straight through to setup-node-yarn/setup-node-pnpm's
          extra-cache-key-glob-1 input in every job below - must match
          main-node-ci.yml's identical input for the same caller, since
          both workflows compute the same cache key and PR runs only read
          what push-to-main last wrote. A caller needing two extra patterns
          also has extra_deps_cache_key_glob_2.
        type: string
        required: false
        default: ''
      extra_deps_cache_key_glob_2:
        description: Second extra glob - see extra_deps_cache_key_glob_1.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # LAB-2097: path-filters that skip lint/typecheck/build/test below when
  # the PR touches nothing they'd actually re-check. Runs first, no
  # dependencies, so it overlaps with `setup` instead of gating it -
  # `setup` (dep install/cache restore) still runs unconditionally since
  # `dead-code`/`security-scan`/`dependency-audit` below are NOT gated by
  # this job's outputs (out of scope for LAB-2097 - only
  # lint/typecheck/build/test/ls-lint are). Checkout here runs against the
  # CALLER repo (this reusable workflow's checkout context is whichever
  # repo invoked it via workflow_call), which is exactly what needs
  # filtering - not this labone-actions repo itself.
  #
  # `node` covers everything lint/typecheck/build/test actually consume
  # today (checked against each job's own cached-script `script`/
  # `cache-key-extra-glob-*` inputs above): TS/JS source, package.json,
  # both supported lockfiles (package_manager: yarn vs pnpm, LAB-1268),
  # eslint/tsconfig/jest/vitest config. Not confident this list is
  # exhaustive for every one of the ~20 current callers - a repo with an
  # unusual extra config file consumed by a custom lint/build script
  # (surfaced via extra_deps_cache_key_glob_1/2, which are caller-specific
  # and can't be folded into a static filter list here) could still see a
  # stale skip. Erring toward a broader match (more false "changed"
  # positives, i.e. running when not strictly needed) rather than a
  # narrower one, since a wrong filter that skips real work is a
  # correctness bug across every caller.
  #
  # `ls_lint` was added per LAB-2097's spec for output-shape parity with the
  # `node`/`ls_lint` pair used elsewhere, ahead of develop-node-ci.yml
  # actually running an `ls-lint` job (main-node-ci.yml still doesn't).
  # It now gates the `ls-lint` job below (`enable_ls_lint`), conservatively
  # scoped to the same source-file patterns `node` uses (ls-lint polices
  # filenames of source files, not their content) plus `.ls-lint.yml`
  # itself, since no caller's actual `.ls-lint.yml` was read to confirm an
  # exact pattern - see this job's PR description for the explicit
  # "unconfirmed" callout.
  changes:
    name: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.filter.outputs.node }}
      node_source: ${{ steps.filter.outputs.node_source }}
      node_deps: ${{ steps.filter.outputs.node_deps }}
      tsconfig: ${{ steps.filter.outputs.tsconfig }}
      eslint_config: ${{ steps.filter.outputs.eslint_config }}
      jest_config: ${{ steps.filter.outputs.jest_config }}
      ls_lint: ${{ steps.filter.outputs.ls_lint }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/node-changes@main
        id: filter

  actionlint:
    name: actionlint
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    secrets: inherit
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
      pr_url: ${{ inputs.pr_url }}

  setup:
    name: setup
    needs: changes
    runs-on: [self-hosted, catfood, catfood-node]
    steps:
      - if: inputs.package_manager == 'yarn'
        uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: setup
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          # Same secret already used by web callers for the private
          # eslint-plugin-lab-react-standards git dependency - a sibling
          # ticket adds a lab-nest-standards rule set to that same
          # labone-eslint-plugin package for backend services, consumed the
          # same way, so this needs to be wired up here too.
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          # A cache-write: 'false' job still runs a real network install on
          # a cache miss (e.g. this PR's own yarn.lock change) - the
          # cache-hit-only path was the reason gh-token was previously
          # missing here, but a miss needs it exactly like main-node-ci.yml's
          # setup job. See that file's identical comment for the failure
          # mode this prevents.
          gh-token: ${{ secrets.GH_PAT }}
          # PR runs only read the node_modules cache written by
          # main-node-ci.yml. See setup-node-yarn's cache-write input
          # description and README.md "Caching strategy".
          cache-write: 'false'
      - if: inputs.package_manager == 'pnpm'
        uses: PeterChauYEG/labone-actions/.github/actions/setup-node-pnpm@main
        with:
          cache-key-prefix: setup
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          # PR runs only read the node_modules cache written by
          # main-node-ci.yml. See setup-node-pnpm's cache-write input
          # description and README.md "Caching strategy".
          cache-write: 'false'

  peer-deps:
    name: peer-deps
    needs: changes
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ needs.changes.outputs.node_deps == 'true' }}
    # `outcome`/`report` feed the `danger-comment` aggregator below, which
    # posts one sticky PR comment covering this job plus security-scan/
    # dependency-audit and files a (deduped) Linear ticket for whichever of
    # the three failed - see that job's own header comment. `outcome` is
    # this job's OWN verdict, deliberately not the same thing as this job's
    # GitHub-level result: the checks below stay `continue-on-error: true`
    # (unchanged, still advisory-only - see below), so the job itself never
    # fails and `needs.peer-deps.result` would always read 'success'.
    outputs:
      outcome: ${{ steps.check.outputs.outcome }}
      report: ${{ steps.check.outputs.report }}
    steps:
      # Advisory-only, like dead-code/duplicate-code above (see this file's
      # required-checks comment): a peer dependency conflict is real signal
      # worth surfacing, but blocking merges on it with no fix-forward path
      # (e.g. a transitive dependency's own peer range, not something the
      # repo controls) is exactly the failure mode peer-deps-check's
      # internal `continue-on-error` exists to prevent here - unlike
      # develop-ci.yml/develop-mobile-ci.yml's identical action usage, this
      # caller deliberately has no follow-up `exit 1` step.
      - uses: PeterChauYEG/labone-actions/.github/actions/peer-deps-check@main
        id: check
        with:
          package-manager: ${{ inputs.package_manager }}
          working-directory: ${{ inputs.working-directory }}

  lint:
    name: lint
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ needs.changes.outputs.node_source == 'true' || needs.changes.outputs.node_deps == 'true' || needs.changes.outputs.eslint_config == 'true' }}
    steps:
      # Zero-tolerance gate: this just runs `<package manager> lint` and
      # fails on any non-zero exit. Whether that actually means "zero
      # warnings" depends on the caller's own lint script passing
      # --max-warnings=0 to eslint - see this file's header comment and
      # README.md. cache-write false: only main-node-ci.yml writes a new
      # .eslintcache entry - see cached-script's cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: lint
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-deps-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-deps-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          package-manager: ${{ inputs.package_manager }}
          script: lint
          script-args: --cache --cache-location .eslintcache
          cache-path: .eslintcache
          cache-key-prefix: eslintcache
          cache-key-extra-glob-1: .eslintrc*
          cache-key-extra-glob-2: eslint.config.*
          cache-write: 'false'

  ls-lint:
    name: ls-lint
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_ls_lint && !inputs.is_dependabot && needs.changes.outputs.ls_lint == 'true' }}
    # setup-node-yarn only exposes GH_TOKEN as an env var scoped to its own
    # internal "Install dependencies" step (see that action's `gh-token`
    # input) - it is not re-exposed to this job's own subsequent steps. That
    # matters here because a consumer's .yarnrc.yml can set `npmAuthToken:
    # "${GH_TOKEN:-}"` for a GitHub-Packages scope, and yarn parses
    # .yarnrc.yml eagerly on EVERY invocation, not just `yarn install` - so
    # `yarn lint:ls` below would otherwise fail with "Usage Error:
    # Environment variable not found (GH_TOKEN)" once setup-node-yarn's own
    # install step finishes. Same failure mode and same fix as the
    # `dependency-audit` job's job-level env above; harmless no-op for every
    # other caller with no such .yarnrc.yml entry.
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: ls-lint
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - run: yarn lint:ls
        working-directory: ${{ inputs.working-directory }}

  typecheck:
    name: typecheck
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: typecheck
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-deps-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-deps-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          package-manager: ${{ inputs.package_manager }}
          script: typecheck
          script-args: --incremental --tsBuildInfoFile tsconfig.tsbuildinfo
          cache-path: tsconfig.tsbuildinfo
          cache-key-prefix: tsbuildinfo
          cache-key-extra-glob-1: tsconfig*.json
          cache-write: 'false'

  build:
    name: build
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_build }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: build
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-deps-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-deps-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          package-manager: ${{ inputs.package_manager }}
          script: build

  test:
    name: test
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_test && !inputs.is_dependabot }}
    steps:
      # Hard gate - does NOT enforce a coverage threshold itself. That's
      # each consumer's responsibility via their own jest/vitest config
      # (recommended default: 90% lines/branches). See README.md.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: test
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-deps-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-deps-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          package-manager: ${{ inputs.package_manager }}
          script: test:coverage
          script-args: --cache --cacheDirectory .jestcache
          cache-path: .jestcache
          cache-key-prefix: jestcache
          cache-key-extra-glob-1: jest.config.*
          cache-write: 'false'

  security-scan:
    name: security-scan
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot && needs.changes.outputs.node_deps == 'true' }}
    # Feeds the `danger-comment` aggregator below. The Trivy step keeps
    # failing the job on its own exit-code (via the final `exit 1` step) -
    # this is still a HARD gate, unchanged - continue-on-error here only
    # lets this job reach its own report/outcome-capturing step instead of
    # stopping dead at Trivy like before.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy (vulnerabilities)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          output: security-scan-report.txt
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - name: Build security-scan report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          outcome="${{ steps.trivy.outcome }}"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "report<<SECURITY_SCAN_REPORT_EOF"
            echo '### security-scan'
            echo
            if [ "$outcome" = 'failure' ]; then
              echo '❌ Trivy found HIGH/CRITICAL vulnerabilities:'
              echo '```'
              cat security-scan-report.txt 2>/dev/null || echo '(no report captured)'
              echo '```'
            else
              echo '✅ No HIGH/CRITICAL vulnerabilities found.'
            fi
            echo "SECURITY_SCAN_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - if: ${{ steps.trivy.outcome == 'failure' }}
        run: exit 1

  secret-scan:
    name: secret-scan
    needs: setup
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy (secrets)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          output: secret-scan-report.txt
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - name: Build secret-scan report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          outcome="${{ steps.trivy.outcome }}"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "report<<SECRET_SCAN_REPORT_EOF"
            echo '### secret-scan'
            echo
            if [ "$outcome" = 'failure' ]; then
              echo '❌ Trivy found HIGH/CRITICAL secrets:'
              echo '```'
              cat secret-scan-report.txt 2>/dev/null || echo '(no report captured)'
              echo '```'
            else
              echo '✅ No secrets found.'
            fi
            echo "SECRET_SCAN_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - if: ${{ steps.trivy.outcome == 'failure' }}
        run: exit 1

  dependency-audit:
    name: dependency-audit
    needs: setup
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_dependency_audit && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above (still a HARD gate, via the final `exit 1`
    # step).
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    # `yarn npm audit`/`pnpm audit` resolve advisory data against the real
    # registry, including for scoped packages published to GitHub Packages
    # (e.g. @peterchauyeg/api-components) - .yarnrc.yml's npmAuthToken:
    # "${GH_TOKEN:-}" falls back to empty without this, and yarn fails the
    # whole job with "Invalid authentication (as an anonymous user)" even
    # when there's nothing to actually audit. Every other job here restores
    # GH_TOKEN via setup-node-yarn/cached-script; this job checks out fresh
    # instead, so it needs its own job-level env.
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      # `yarn npm audit`/`pnpm audit` resolve entirely from the lockfile
      # against the registry - no installed node_modules tree needed, just
      # the package-manager binary itself. So this job checks out + enables
      # Corepack + sets up Node directly instead of restoring the setup
      # job's full deps artifact like every other job here.
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.working-directory }}/package.json
      # Hard gate, no severity floor - any known vulnerability fails the
      # job. `yarn npm audit` is the Yarn Berry command (this repo and its
      # yarn-based Node/NestJS callers use Berry, per setup-node-yarn's
      # .yarn/cache paths; a Yarn Classic repo would need `yarn audit`
      # instead) vs. `pnpm audit` for `package_manager: pnpm` callers
      # (LAB-1268) - unlike every other job's `<script>` step, this can't be
      # a single `${{ inputs.package_manager }} audit` since yarn's
      # subcommand is `npm audit`, not `audit`.
      - if: inputs.package_manager == 'yarn'
        id: audit-yarn
        continue-on-error: true
        run: yarn npm audit 2>&1 | tee /tmp/dependency-audit.log
        working-directory: ${{ inputs.working-directory }}
      - if: inputs.package_manager == 'pnpm'
        id: audit-pnpm
        continue-on-error: true
        run: pnpm audit 2>&1 | tee /tmp/dependency-audit.log
        working-directory: ${{ inputs.working-directory }}
      - name: Build dependency-audit report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ inputs.package_manager }}" = "yarn" ]; then
            outcome="${{ steps.audit-yarn.outcome }}"
          else
            outcome="${{ steps.audit-pnpm.outcome }}"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "report<<DEPENDENCY_AUDIT_REPORT_EOF"
            echo '### dependency-audit'
            echo
            if [ "$outcome" = 'failure' ]; then
              echo '❌ Known vulnerabilities found:'
              echo '```'
              tail -n 60 /tmp/dependency-audit.log 2>/dev/null || echo '(no log captured)'
              echo '```'
            else
              echo '✅ No known vulnerabilities found.'
            fi
            echo "DEPENDENCY_AUDIT_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - if: ${{ (inputs.package_manager == 'yarn' && steps.audit-yarn.outcome == 'failure') || (inputs.package_manager == 'pnpm' && steps.audit-pnpm.outcome == 'failure') }}
        run: exit 1

  dead-code:
    name: dead-code
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_dead_code && !inputs.is_dependabot && needs.changes.outputs.node_source == 'true' }}
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment and scan-with-report's own header comment for why this no
    # longer posts its own sticky comment / files its own Linear ticket.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      # scan-with-report below always runs `yarn <script>` (not
      # package-manager-aware, unlike cached-script) - see this job's
      # enable_dead_code input description - so this restores deps via
      # setup-node-yarn unconditionally rather than branching on
      # inputs.package_manager like the `setup` job does.
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: dead-code
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: dead-code
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/dead-code-report.md
          working-directory: ${{ inputs.working-directory }}
          blocking: 'false'

  duplicate-code:
    name: duplicate-code
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_duplicate_code && !inputs.is_dependabot && needs.changes.outputs.node_source == 'true' }}
    # Feeds the `danger-comment` aggregator below - see dead-code's identical
    # comment above.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      # scan-with-report below always runs `yarn <script>` (not
      # package-manager-aware, unlike cached-script) - see this job's
      # enable_duplicate_code input description - so this restores deps via
      # setup-node-yarn unconditionally rather than branching on
      # inputs.package_manager like the `setup` job does.
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: duplicate-code
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          extra-cache-key-glob-1: ${{ inputs.extra_deps_cache_key_glob_1 }}
          extra-cache-key-glob-2: ${{ inputs.extra_deps_cache_key_glob_2 }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: duplicate-code
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/duplicate-code-report.md
          working-directory: ${{ inputs.working-directory }}
          blocking: 'false'

  # Single aggregator for every scan/gate job above that reports findings:
  # peer-deps, security-scan, secret-scan, dependency-audit, dead-code,
  # duplicate-code. Posts ONE sticky PR comment covering all six and files
  # (deduped, via scripts/file-linear-ticket.sh - already per-PR-per-job
  # deduped, see that script's own header) a Linear ticket for whichever of
  # them failed - instead of each of the six independently generating its
  # own Dangerfile / posting its own sticky comment / filing its own ticket,
  # which is what this repo did until now (still true for develop-ci.yml's
  # design-system/react-tech-debt/max-lines/tech-debt jobs and
  # develop-rust-ci.yml's fmt/clippy/test - being migrated to this same
  # pattern separately).
  #
  # `if: always()` so this still runs (and can report) when an upstream job
  # failed - same rationale as required-checks' identical `if: always()`
  # below. The `needs.*.result != 'skipped'` check skips this job entirely
  # only when ALL SIX were skipped (e.g. a PR that touches no dependency or
  # source files at all) - any one of them running is enough to post a
  # comment.
  #
  # `outcome` on each upstream job's outputs is that job's OWN verdict, not
  # `needs.<job>.result` - security-scan/secret-scan/dependency-audit are
  # still hard gates (their own final `exit 1` step still makes
  # `needs.<job>.result` 'failure' too, so either would work for them), but
  # peer-deps is advisory-only and its job never fails - `needs.peer-deps.
  # result` would always read 'success', so only `outputs.outcome` reflects
  # whether it actually found a conflict.
  danger-comment:
    name: danger-comment
    needs:
      [
        peer-deps,
        security-scan,
        secret-scan,
        dependency-audit,
        dead-code,
        duplicate-code,
      ]
    if: |
      always() &&
      (needs.peer-deps.result != 'skipped' ||
       needs.security-scan.result != 'skipped' ||
       needs.secret-scan.result != 'skipped' ||
       needs.dependency-audit.result != 'skipped' ||
       needs.dead-code.result != 'skipped' ||
       needs.duplicate-code.result != 'skipped')
    runs-on: [self-hosted, catfood, catfood-node]
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Checked out separately (not the caller repo) purely to get
      # scripts/file-linear-ticket.sh, which lives in labone-actions
      # regardless of which repo calls this workflow - same rationale as
      # scan-with-report's old comment on this, now living here instead.
      - name: Checkout labone-actions scripts
        uses: actions/checkout@v7
        with:
          repository: PeterChauYEG/labone-actions
          ref: main
          path: labone-actions
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - name: Prepare reports
        id: build
        shell: bash
        env:
          PEER_DEPS_RESULT: ${{ needs.peer-deps.result }}
          PEER_DEPS_REPORT: ${{ needs.peer-deps.outputs.report }}
          SECURITY_SCAN_RESULT: ${{ needs.security-scan.result }}
          SECURITY_SCAN_REPORT: ${{ needs.security-scan.outputs.report }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SECRET_SCAN_REPORT: ${{ needs.secret-scan.outputs.report }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          DEPENDENCY_AUDIT_REPORT: ${{ needs.dependency-audit.outputs.report }}
          DEAD_CODE_RESULT: ${{ needs.dead-code.result }}
          DEAD_CODE_REPORT: ${{ needs.dead-code.outputs.report }}
          DUPLICATE_CODE_RESULT: ${{ needs.duplicate-code.result }}
          DUPLICATE_CODE_REPORT: ${{ needs.duplicate-code.outputs.report }}
        run: |
          set -uo pipefail
          printf '%s\n' "$PEER_DEPS_REPORT" > /tmp/peer-deps-report.md
          printf '%s\n' "$SECURITY_SCAN_REPORT" > /tmp/security-scan-report.md
          printf '%s\n' "$SECRET_SCAN_REPORT" > /tmp/secret-scan-report.md
          printf '%s\n' "$DEPENDENCY_AUDIT_REPORT" > /tmp/dependency-audit-report.md
          printf '%s\n' "$DEAD_CODE_REPORT" > /tmp/dead-code-report.md
          printf '%s\n' "$DUPLICATE_CODE_REPORT" > /tmp/duplicate-code-report.md
          {
            echo "report<<DANGER_COMMENT_REPORT_EOF"
            echo '## Dependency & code-health checks'
            echo
            [ "$PEER_DEPS_RESULT" != 'skipped' ] && { printf '%s\n\n' "$PEER_DEPS_REPORT"; }
            [ "$SECURITY_SCAN_RESULT" != 'skipped' ] && { printf '%s\n\n' "$SECURITY_SCAN_REPORT"; }
            [ "$SECRET_SCAN_RESULT" != 'skipped' ] && { printf '%s\n\n' "$SECRET_SCAN_REPORT"; }
            [ "$DEPENDENCY_AUDIT_RESULT" != 'skipped' ] && { printf '%s\n\n' "$DEPENDENCY_AUDIT_REPORT"; }
            [ "$DEAD_CODE_RESULT" != 'skipped' ] && { printf '%s\n\n' "$DEAD_CODE_REPORT"; }
            [ "$DUPLICATE_CODE_RESULT" != 'skipped' ] && { printf '%s\n\n' "$DUPLICATE_CODE_REPORT"; }
            echo "DANGER_COMMENT_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: PeterChauYEG/labone-actions/.github/actions/post-danger-comment@main
        with:
          report: ${{ steps.build.outputs.report }}
          sticky-header: dependency-checks
      - name: File Linear ticket for peer-deps
        if: ${{ needs.peer-deps.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh peer-deps /tmp/peer-deps-report.md
      - name: File Linear ticket for security-scan
        if: ${{ needs.security-scan.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh security-scan /tmp/security-scan-report.md
      - name: File Linear ticket for secret-scan
        if: ${{ needs.secret-scan.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh secret-scan /tmp/secret-scan-report.md
      - name: File Linear ticket for dependency-audit
        if: ${{ needs.dependency-audit.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh dependency-audit /tmp/dependency-audit-report.md
      - name: File Linear ticket for dead-code
        if: ${{ needs.dead-code.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh dead-code /tmp/dead-code-report.md
      - name: File Linear ticket for duplicate-code
        if: ${{ needs.duplicate-code.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh duplicate-code /tmp/duplicate-code-report.md

  # LAB-2103: single aggregator job so caller repos' branch protection can
  # require ONE context (`required-checks`) instead of a hand-maintained
  # list of this workflow's individual job-name contexts. Without this, any
  # rename/add/remove of a job in this shared workflow silently desyncs
  # every caller's branch protection required-status-check list -
  # permanently blocking merges with no visible error until someone thinks
  # to compare the two lists by hand. See README.md's "required-checks"
  # section for the full rationale and the caller-side branch-protection
  # follow-up this unblocks.
  #
  # `needs:` lists every job in this file that's currently a REAL
  # (blocking) gate: `lint`, `ls-lint`, `typecheck`, `build`, `test`,
  # `security-scan`, `dependency-audit`. Deliberately excludes:
  #   - `changes`/`setup` - infra/plumbing jobs, not gates themselves.
  #   - `dead-code`/`duplicate-code` - explicitly advisory-only
  #     (`blocking: 'false'` on their `scan-with-report` calls above),
  #     never fail on their own even when `enable_dead_code`/
  #     `enable_duplicate_code` is on. Making either a `needs:` dependency
  #     of a REQUIRED job would make a design-advisory scan block merges,
  #     which is exactly the failure mode `blocking: 'false'` exists to
  #     prevent.
  #   - `peer-deps` - advisory-only (`continue-on-error: true` on both its
  #     conflict-check steps), same rationale as `dead-code`/
  #     `duplicate-code`: a peer range conflict is often outside the repo's
  #     own control (a transitive dependency's peer range), so it's
  #     surfaced but never blocks merges.
  #   - `danger-comment` - the aggregated sticky-comment/Linear-ticket job
  #     above, purely advisory/reporting like `dead-code`/`duplicate-code`;
  #     it never fails on its own either.
  #
  # `if: always()` so this job still runs (and can report a real result)
  # even when an upstream gate job fails/is cancelled - without it, GitHub's
  # default scheduling would skip this job outright whenever any `needs:`
  # entry didn't succeed, which is the opposite of what an aggregator gate
  # needs to do. A `skipped` result on any needed job (from `enable_*:
  # false`, `is_dependabot`, or LAB-2097's `needs.changes.outputs.node ==
  # 'false'` path-filter gating) must NOT fail this job - that's the same
  # "skipped satisfies the requirement" precedent every `if:` in this file
  # already relies on for branch protection (see the `lint` job's comment
  # above) - only `failure`/`cancelled` should.
  required-checks:
    name: required-checks
    needs:
      [
        lint,
        ls-lint,
        typecheck,
        build,
        test,
        security-scan,
        secret-scan,
        dependency-audit,
        actionlint,
      ]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
