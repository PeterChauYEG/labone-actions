name: Main CI

# Reusable push-to-main CI+deploy for yarn/Next.js-ish web repos. Callers
# are thin wrappers: `on: push: branches: [main]` -> `uses:
# PeterChauYEG/labone-actions/.github/workflows/main-ci.yml@main` with
# `secrets: inherit`. See README.md for the full caller example.
#
# Mirrors develop-ci.yml's job set as plain pass/fail gates (no sticky PR
# comments, no Linear ticket filing - there's no PR to comment on at this
# point) plus `deploy` and `slack-notification`, matching main.yml's
# current behavior in laboratory-one-web / ai-harness-web. Input and job
# names are intentionally identical to develop-ci.yml's - see that file's
# header comment for the enable_*/is_dependabot rationale.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >
          Directory (relative to the repo root) the Next.js/yarn app lives
          in. Defaults to `.` (repo root) so every existing caller keeps
          working with zero changes. Set this for a monorepo caller, e.g.
          `prototype`.
        type: string
        required: false
        default: '.'
      is_dependabot:
        description: >
          Whether the triggering commit was authored by dependabot[bot].
          Caller must compute this from github.event.head_commit.author.name,
          since reusable workflows can't see that context directly. When
          true, every job except lint/typecheck/build is skipped, and
          deploy itself is skipped (matches existing main.yml behavior).
        type: boolean
        required: false
        default: false
      enable_ls_lint:
        description: Run the ls-lint file naming check.
        type: boolean
        default: true
      enable_build:
        description: Run `yarn build`.
        type: boolean
        default: true
      enable_test:
        description: Run `yarn test:coverage`.
        type: boolean
        default: true
      enable_a11y:
        description: Run `yarn a11y` (accessibility scan) as a pass/fail gate.
        type: boolean
        default: true
      enable_design_system:
        description: Run `yarn design-system` as a pass/fail gate.
        type: boolean
        default: true
      enable_dead_code:
        description: Run `yarn dead-code` as a pass/fail gate.
        type: boolean
        default: true
      enable_duplicate_code:
        description: >
          Run `yarn duplicate-code`. Advisory only (nextjs-ci v1.0.2,
          2026-08-20): the step still runs and still reports its outcome
          via the job's own conclusion, but a finding never fails the job
          or blocks `deploy` — it's a repo-wide scan that can trip on
          pre-existing findings unrelated to the commit that triggered the
          run. See `continue-on-error` on the job's `run: yarn
          duplicate-code` step below.
        type: boolean
        default: true
      enable_e2e:
        description: Run `yarn run-e2e-scan` (Playwright e2e) as a pass/fail gate.
        type: boolean
        default: true
      enable_react_tech_debt:
        description: Run `yarn react-tech-debt` as a pass/fail gate.
        type: boolean
        default: true
      enable_max_lines:
        description: >
          Run `yarn max-lines`. Advisory only (nextjs-ci v1.0.2,
          2026-08-20) — same rationale/mechanism as `enable_duplicate_code`
          above: still runs, never fails the job or blocks `deploy`.
        type: boolean
        default: true
      enable_deploy:
        description: Push to the dokku remote after all gates pass.
        type: boolean
        default: true
      dokku_remote_url:
        description: >
          Dokku git remote URL to push to, e.g.
          ssh://dokku@192.168.1.31:22/<app-name>. Required if enable_deploy
          is true.
        type: string
        required: false
        default: ''
      enable_slack_notification:
        description: Post the deploy result to Slack after `deploy` completes.
        type: boolean
        default: true
      extra_deps_paths:
        description: >
          Space-separated list of additional paths (relative to
          working-directory) to carry from the `setup` job into every
          downstream job, beyond node_modules and .next/cache — e.g. a
          gitignored src/generated/ directory populated by a `postinstall`
          codegen script. Passed straight through to setup-node-yarn's
          extra-paths input.
        type: string
        required: false
        default: ''
      test_script_args:
        description: >
          Extra CLI args forwarded to the caller's `test:coverage` script.
          Defaults to Jest's cache flags (every existing caller runs Jest).
          A Vitest-based caller must override this - Vitest 4 removed the
          `--cacheDirectory` CLI flag ("Unknown option `--cacheDirectory`");
          pass `--cache` only, and set the cache directory via Vite's
          `cacheDir` config option in vitest.config.ts instead (point it at
          `.jestcache` to match `cache-path` below).
        type: string
        required: false
        default: '--cache --cacheDirectory .jestcache'

permissions:
  contents: read

# This workflow owns its concurrency group. Callers must NOT declare their
# own `concurrency:` block with this same group — a caller and its nested
# `workflow_call` fighting over one identical group name deadlocks (GitHub
# can't resolve a group shared between a parent run and its own child run)
# and the run gets canceled. Bit laboratory-one-web in production 2026-08-04
# (blocked every push-to-main deploy) before the caller's duplicate was
# removed. See README.md "Concurrency" section for the full explanation,
# including how this is unrelated to (and doesn't replace) the gha-runner
# host's own per-repo/global job-concurrency semaphore.
#
# `cancel-in-progress: true` is a deliberate, confirmed tradeoff: a rapid
# second push to main will cancel whatever the first run's `deploy` step
# was doing mid-flight. That's accepted because leaving main pinned to
# stale code deployed by a superseded run is worse.
concurrency:
  group: main-ci-${{ github.repository }}
  cancel-in-progress: true


jobs:
  setup:
    name: setup
    runs-on: [self-hosted, catfood]
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          # Optional per-repo secret — only set for repos with a private
          # git-dependency package.json entry (e.g.
          # "eslint-plugin-lab-react-standards": "github:...#main"). Empty
          # string for every other repo, which setup-node-yarn treats as
          # "skip ssh-agent setup".
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          # Optional per-repo secret — only set for repos whose postinstall
          # script needs `gh` CLI access to a sibling private repo (e.g.
          # gamecraft fetching a generated SDK release from
          # gamecraft-api). Empty string for every other repo, which
          # setup-node-yarn treats as "no GH_TOKEN for the install step".
          gh-token: ${{ secrets.GH_PAT }}
          # Only push-to-main writes a fresh node_modules cache entry — PR
          # runs (develop-ci.yml) only read it. See setup-node-yarn's
          # cache-write input description and README.md "Caching strategy".
          cache-write: 'true'

  lint:
    name: lint
    needs: setup
    runs-on: [self-hosted, catfood]
    steps:
      # cache-write true: only main-ci.yml writes a new .eslintcache entry
      # - see develop-ci.yml's read-only equivalent and cached-script's
      # cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: lint
          script-args: --cache --cache-location .eslintcache
          cache-path: .eslintcache
          cache-key-prefix: eslintcache
          cache-key-extra-glob-1: .eslintrc*
          cache-key-extra-glob-2: eslint.config.*
          cache-write: 'true'

  ls-lint:
    name: ls-lint
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_ls_lint && !inputs.is_dependabot }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - run: yarn lint:ls
        working-directory: ${{ inputs.working-directory }}

  typecheck:
    name: typecheck
    needs: setup
    runs-on: [self-hosted, catfood]
    steps:
      # cache-write true: only main-ci.yml writes a new tsconfig.tsbuildinfo
      # entry - see develop-ci.yml's read-only equivalent and cached-script's
      # cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: typecheck
          script-args: --incremental --tsBuildInfoFile tsconfig.tsbuildinfo
          cache-path: tsconfig.tsbuildinfo
          cache-key-prefix: tsbuildinfo
          cache-key-extra-glob-1: tsconfig*.json
          cache-write: 'true'

  build:
    name: build
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_build }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: build

  test:
    name: test
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_test && !inputs.is_dependabot }}
    steps:
      # cache-write true: only main-ci.yml writes a new .jestcache entry
      # (LAB-1333) - see develop-ci.yml's read-only equivalent and
      # cached-script's cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: test:coverage
          script-args: ${{ inputs.test_script_args }}
          cache-path: .jestcache
          cache-key-prefix: jestcache
          cache-key-extra-glob-1: jest.config.*
          cache-write: 'true'

  a11y:
    name: a11y
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_a11y && !inputs.is_dependabot }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - run: npx playwright install chromium
        working-directory: ${{ inputs.working-directory }}
      - run: yarn a11y
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: ${{ inputs.working-directory }}

  design-system:
    name: design-system
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_design_system && !inputs.is_dependabot }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - run: yarn design-system
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: ${{ inputs.working-directory }}

  dead-code:
    name: dead-code
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_dead_code && !inputs.is_dependabot }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - run: yarn dead-code
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: ${{ inputs.working-directory }}

  duplicate-code:
    name: duplicate-code
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_duplicate_code && !inputs.is_dependabot }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      # Advisory only (nextjs-ci v1.0.2, 2026-08-20): continue-on-error
      # keeps the job's own conclusion 'success' even when this step's
      # outcome is 'failure', so `deploy`'s `needs.*.result` check below
      # never sees this as a blocking failure. Confirmed root cause of a
      # stalled ai-harness-web deploy on 2026-08-20 - a pre-existing
      # repo-wide jscpd finding unrelated to that push's diff failed this
      # step and silently blocked deploy under the old plain `run:` step.
      - run: yarn duplicate-code
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: ${{ inputs.working-directory }}

  run-e2e-tests:
    name: run-e2e-tests
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_e2e && !inputs.is_dependabot }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - run: npx playwright install chromium
        working-directory: ${{ inputs.working-directory }}
      - run: yarn run-e2e-scan
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: ${{ inputs.working-directory }}

  react-tech-debt:
    name: react-tech-debt
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_react_tech_debt && !inputs.is_dependabot }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - run: yarn react-tech-debt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: ${{ inputs.working-directory }}

  max-lines:
    name: max-lines
    needs: setup
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_max_lines && !inputs.is_dependabot }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      # Advisory only (nextjs-ci v1.0.2, 2026-08-20) - same rationale as
      # duplicate-code's identical continue-on-error above.
      - run: yarn max-lines
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        working-directory: ${{ inputs.working-directory }}

  deploy:
    name: deploy
    runs-on: [self-hosted, catfood]
    needs:
      [
        lint,
        ls-lint,
        typecheck,
        build,
        test,
        a11y,
        design-system,
        dead-code,
        duplicate-code,
        run-e2e-tests,
        react-tech-debt,
        max-lines,
      ]
    # `duplicate-code`/`max-lines` stay in this list for ordering (deploy
    # waits for them to finish) but no longer block deploy on a finding:
    # both jobs' `run: yarn <script>` steps now set `continue-on-error:
    # true` (nextjs-ci v1.0.2, 2026-08-20), which keeps the job's own
    # conclusion 'success' even when the script exits non-zero - GitHub
    # Actions never counts a continue-on-error step's failure toward the
    # containing job's conclusion. So `needs.duplicate-code.result` /
    # `needs.max-lines.result` read 'success' below regardless of scan
    # outcome, and the `!contains(needs.*.result, 'failure')` check further
    # down doesn't need to change.
    #
    # Skipped-but-not-run gate jobs (enable_* false) must not block deploy,
    # only actual failures/cancellations should - hence checking needs.*.result
    # instead of relying on the default all-must-succeed job dependency
    # semantics, which treats "skipped" the same as "failed" for a needs chain.
    #
    # This *requires* always() up front: GitHub silently ANDs a bare
    # success() onto any if: that doesn't already reference one of
    # always()/success()/failure()/cancelled(). Without it, this condition
    # never actually overrides the default all-must-succeed behavior it's
    # trying to replace - any disabled (skipped) optional gate above still
    # auto-skips deploy, which is exactly what this comment says shouldn't
    # happen. Caught via landing-lab's main-ci run 2026-08-07: every
    # enable_* gate but ls-lint/build/test was false, so deploy silently
    # skipped every push to main despite all real jobs passing.
    if: >-
      always() && inputs.enable_deploy && !inputs.is_dependabot &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push to Dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: ${{ inputs.dokku_remote_url }}
          ssh_private_key: ${{ secrets.DOKKU_DEPLOY_SSH_KEY }}
          # See main-node-ci.yml's identical comment: without this, the
          # action pushes to the dokku remote's `master` ref by default,
          # which Dokku doesn't build from - the job reports green (git push
          # succeeds) but no actual deploy happens.
          branch: main

  slack-notification:
    name: slack-notification
    needs: [deploy]
    if: ${{ always() && inputs.enable_slack_notification && needs.deploy.result == 'failure' }}
    runs-on: [self-hosted, catfood]
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.repository }} deploy: ${{ needs.deploy.result }}"
            }
