name: Security Scan
run-name: Dependency & secret scan

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    uses: ./.github/workflows/security-scan.yml
    with:
      # Only the push-to-main run writes a fresh Trivy DB cache entry - PR
      # and weekly-schedule runs only read it. See security-scan.yml's
      # cache-write input description.
      cache-write: ${{ github.event_name == 'push' }}
