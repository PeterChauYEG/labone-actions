name: Security Scan
run-name: Dependency & secret scan

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    # The nested `changes` job in security-scan.yml requests
    # `pull-requests: read` (for dorny/paths-filter) - a reusable
    # workflow's job can't be granted more than the caller itself
    # grants, so this caller has to list that scope explicitly too, not
    # just `contents: read`. This was the actual cause of the
    # `startup_failure`s (confirmed via the GitHub web UI's validation
    # error, which the REST/GraphQL APIs never surfaced) - unrelated to
    # local-vs-remote-ref call syntax, which an earlier fix attempt
    # here wrongly assumed was the problem.
    uses: PeterChauYEG/labone-actions/.github/workflows/security-scan.yml@main
    with:
      # Only the push-to-main run writes a fresh Trivy DB cache entry - PR
      # and weekly-schedule runs only read it. See security-scan.yml's
      # cache-write input description.
      cache-write: ${{ github.event_name == 'push' }}
