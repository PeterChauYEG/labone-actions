name: Actionlint

# Reusable workflow: lints every workflow file in the calling repo's own
# `.github/workflows/` with actionlint (catches invalid expressions, unknown
# inputs on `uses:` reusable-workflow calls, shellcheck issues inside `run:`
# blocks, etc.). Callers are thin wrappers - see README.md for the full
# caller example. Extracted from this repo's own `ci.yml` (which has run
# actionlint against its own workflows since before this reusable workflow
# existed) so every other repo in the org gets the same check instead of
# each hand-rolling the same `curl | bash` install step.
#
# Pinned to the same actionlint version this repo's own `ci.yml` uses, so
# both stay in lockstep - bump both together if you bump this input's
# default.
#
# actionlint has no built-in knowledge of this org's custom self-hosted
# runner label ("catfood" - see every workflow's `runs-on: [self-hosted,
# catfood]`) and flags it as an unknown-label error unless told about it via
# a `.github/actionlint.yaml` config file (self-hosted-runner.labels).
# Writes/overwrites that file with the canonical label list before scanning
# - same "change lint config in one place" approach as setup-gdtoolkit's
# canonical .gdlintrc/.gdformatrc - so no caller repo needs its own copy.

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: Pinned actionlint version.
        type: string
        required: false
        default: '1.7.12'
      self_hosted_labels:
        description: >
          Comma-separated list of custom self-hosted runner labels this org
          uses (beyond actionlint's built-in "self-hosted"), written into a
          canonical .github/actionlint.yaml before scanning.
        type: string
        required: false
        default: 'catfood'
      pr_number:
        type: number
        required: false
        default: 0
      pr_url:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: [self-hosted, catfood]
    steps:
      - uses: actions/checkout@v7
      - name: Write canonical actionlint config
        shell: bash
        run: |
          mkdir -p .github
          {
            echo 'self-hosted-runner:'
            echo '  labels:'
            IFS=',' read -ra LABELS <<< "${{ inputs.self_hosted_labels }}"
            for label in "${LABELS[@]}"; do
              echo "    - ${label}"
            done
          } > .github/actionlint.yaml
      - id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) ${{ inputs.actionlint-version }}
          ./actionlint -color 2>&1 | tee actionlint-report.txt
      - name: File Linear ticket for failure
        # inputs.pr_number defaults to 0 - callers with no
        # scripts/file-linear-ticket.sh of their own omit pr_number/pr_url
        # entirely rather than wire up values for a script they can't run;
        # gate on that (not just scan.outcome) so this step cleanly skips
        # for them instead of erroring with "No such file or directory".
        # Always pass a real report-path argument (not just the job name) -
        # some callers' local file-linear-ticket.sh copies reference $2
        # directly without a "${2:-}" default and fail under `set -u` if
        # it's omitted entirely.
        if: steps.scan.outcome == 'failure' && inputs.pr_number != 0
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-linear-ticket.sh actionlint actionlint-report.txt
      - if: steps.scan.outcome == 'failure'
        run: exit 1
