name: Develop Rust CI

# Reusable PR-time CI for Rust CLI/tool repos (gdscript-lsp, ai-harness-cli).
# Callers are thin wrappers: `on: pull_request` -> `uses:
# PeterChauYEG/labone-actions/.github/workflows/develop-rust-ci.yml@main`
# with `secrets: inherit`. See README.md for the full caller example.
#
# Unlike develop-node-ci.yml, there is no shared `setup` + artifact-restore
# job here: cargo's own registry/git/target caching (via actions/cache,
# keyed on Cargo.lock's hash) already avoids redundant network fetches per
# job without needing a single upstream install step to fan out from.
#
# `fmt`/`clippy`/`test` are HARD gates, always on (test skips for
# dependabot). `build`, `dead-code` (cargo-machete), `duplicate-code`
# (cargo-dupes), `file-size` (plain wc -l scan) and `security-scan`/
# `dependency-audit` are all optional - gdscript-lsp and ai-harness-cli
# diverge on which of these they actually run today (see each input's
# description), so nothing beyond fmt/clippy/test is forced on.
#
# `pre_build_command` exists because ai-harness-cli needs to install two
# private-git SDK packages (via bespoke scripts + a deploy-key-style GH
# token) before cargo can even resolve its dependency graph - gdscript-lsp
# needs nothing here. This is caller-supplied arbitrary shell, not a
# boolean toggle, since there's no way to generalize "install my private
# deps" into a fixed shape. Left empty (no-op) by default.
#
# Every job that reports findings (fmt, clippy, test, dead-code,
# duplicate-code, file-size, security-scan, secret-scan, dependency-audit,
# tech-debt) runs its own check with `continue-on-error: true` and exposes
# `outcome`/`report` as job outputs, but no longer posts its own sticky
# comment or files its own Linear ticket - that's centralized in the single
# `danger-comment` aggregator job near the bottom of this file, which posts
# ONE sticky comment per run and files a deduped ticket (via
# scripts/file-linear-ticket.sh) per failing job. `pr_number`/`pr_url` are
# caller-supplied since a reusable workflow can't always see
# github.event.pull_request directly.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory (relative to the repo root) the Cargo project lives in.
        type: string
        required: false
        default: '.'
      pr_number:
        type: number
        required: false
        default: 0
      pr_url:
        type: string
        required: false
        default: ''
      pr_base_sha:
        description: >
          github.event.pull_request.base.sha from the caller. Only used by
          the `tech-debt` job (when `enable_tech_debt` is true) to compute
          a delta vs. the PR's base branch - see
          `.github/actions/tech-debt-report-rust`'s `base-sha` input.
          Leave empty (default) to skip the delta and get current-totals
          only; harmless to leave unset for every caller that doesn't
          enable `tech-debt`.
        type: string
        required: false
        default: ''
      is_dependabot:
        description: >
          Whether this PR was opened by dependabot[bot]. Caller must
          compute this from github.event.pull_request.user.login. fmt/
          clippy always run in full; test, build, and every optional scan
          job are skipped for dependabot PRs.
        type: boolean
        required: false
        default: false
      pre_build_command:
        description: >
          Arbitrary shell run once per job (fmt/clippy/test/build), after
          checkout and toolchain setup but before the job's actual cargo
          command - e.g. installing private-git SDK dependencies that
          `cargo check`/`build` need to resolve. Empty (no-op) by default.
        type: string
        required: false
        default: ''
      enable_build:
        description: Run `cargo build --release`.
        type: boolean
        default: false
      enable_dead_code:
        description: >
          Run a cargo-machete dead-dependency scan via
          `scripts/dead-code-scan.sh` (or scripts/ci/dead-code-scan.sh -
          set dead_code_script accordingly). Both existing callers run
          this today with the same pinned tool version, so default true.
        type: boolean
        default: true
      dead_code_script:
        description: Path (relative to working-directory) to the dead-code-scan script.
        type: string
        required: false
        default: 'scripts/dead-code-scan.sh'
      cargo_machete_version:
        description: >
          Informational only - cargo-machete is baked into the `rust`
          self-hosted runner image at build time (gha-runner-docker/images/
          rust/Dockerfile), not installed per-run. Keep this in sync with
          the image's pinned version if it ever changes.
        type: string
        required: false
        default: '0.9.2'
      enable_duplicate_code:
        description: >
          Run a cargo-dupes duplicate-code scan via
          scripts/ci/duplicate-code-scan.sh. Off by default - only
          ai-harness-cli has this today, gdscript-lsp has no equivalent.
        type: boolean
        default: false
      duplicate_code_script:
        description: Path (relative to working-directory) to the duplicate-code-scan script.
        type: string
        required: false
        default: 'scripts/ci/duplicate-code-scan.sh'
      cargo_dupes_version:
        description: Pinned cargo-dupes version.
        type: string
        required: false
        default: '0.2.1'
      enable_file_size:
        description: >
          Run a file-size scan via scripts/ci/file-size-scan.sh. Report-only
          by design (never fails the job) - off by default since only
          ai-harness-cli has this today.
        type: boolean
        default: false
      file_size_script:
        description: Path (relative to working-directory) to the file-size-scan script.
        type: string
        required: false
        default: 'scripts/ci/file-size-scan.sh'
      enable_security_scan:
        description: Run the Trivy filesystem vuln/secret scan (HIGH,CRITICAL fail).
        type: boolean
        default: true
      security_scan_trivyignores:
        description: >
          Comma-separated list of relative paths to .trivyignore file(s), or
          a single .trivyignore.yaml file, passed straight through to
          trivy-action's `trivyignores` input. Empty by default.
        type: string
        required: false
        default: ''
      enable_dependency_audit:
        description: >
          Run `cargo audit`. Off by default - neither gdscript-lsp nor
          ai-harness-cli has this today, so there's no established
          precedent to default on (unlike develop-node-ci.yml's
          dependency-audit, which mirrors an existing yarn-repo norm).
        type: boolean
        default: false
      enable_tech_debt:
        description: >
          Run the grep-based Rust tech-debt metrics report (TODO/FIXME/
          HACK comments, #[allow(...)] lint suppressions) and post it as
          a sticky PR comment. Opt-in, like develop-ci.yml's equivalent -
          defaults false since no consumer repo has this today.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      rust_source: ${{ steps.filter.outputs.rust_source }}
      rust_deps: ${{ steps.filter.outputs.rust_deps }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/rust-changes@main
        id: filter

  actionlint:
    name: actionlint
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    secrets: inherit
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
      pr_url: ${{ inputs.pr_url }}

  fmt:
    name: fmt
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ needs.changes.outputs.rust_source == 'true' }}
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment. Still a HARD gate via the final `exit 1` step.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-rust@main
        with:
          cache-key-prefix: fmt
          working-directory: ${{ inputs.working-directory }}
          components: rustfmt
          cache: 'false'
      - if: inputs.pre_build_command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre_build_command }}
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: cargo fmt -- --check 2>&1 | tee /tmp/fmt.log
      - name: Build fmt report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          outcome="${{ steps.scan.outcome }}"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "report<<FMT_REPORT_EOF"
            echo '### fmt'
            echo
            if [ "$outcome" = 'failure' ]; then
              echo '❌ cargo fmt -- --check failed:'
              echo '```'
              tail -n 60 /tmp/fmt.log 2>/dev/null || echo '(no log captured)'
              echo '```'
            else
              echo '✅ Formatting OK.'
            fi
            echo "FMT_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - if: steps.scan.outcome == 'failure'
        run: exit 1

  clippy:
    name: clippy
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ needs.changes.outputs.rust_source == 'true' || needs.changes.outputs.rust_deps == 'true' }}
    # Feeds the `danger-comment` aggregator below - see fmt's identical
    # comment above.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      # cache-key-prefix scopes this job's own cargo-clippy-${Cargo.lock
      # hash} entry, separate from the test/build jobs' cargo-test-/
      # cargo-build- entries below - each job restores/writes only what it
      # itself created (see README.md "Caching"), never another job's
      # entry, even though all three build the same dependency graph.
      # Restore-keys still fall back to main's same-job-scoped entry (e.g.
      # cargo-clippy-) on a miss, so a cold PR-branch cache is still rare.
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-rust@main
        with:
          cache-key-prefix: clippy
          working-directory: ${{ inputs.working-directory }}
          components: clippy
      - if: inputs.pre_build_command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre_build_command }}
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: cargo clippy -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: Build clippy report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          outcome="${{ steps.scan.outcome }}"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "report<<CLIPPY_REPORT_EOF"
            echo '### clippy'
            echo
            if [ "$outcome" = 'failure' ]; then
              echo '❌ cargo clippy -- -D warnings failed:'
              echo '```'
              tail -n 60 /tmp/clippy.log 2>/dev/null || echo '(no log captured)'
              echo '```'
            else
              echo '✅ No clippy warnings.'
            fi
            echo "CLIPPY_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - if: steps.scan.outcome == 'failure'
        run: exit 1

  test:
    name: test
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see fmt's identical
    # comment above.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      # cache-key-prefix scopes this job's own cargo-test-${Cargo.lock
      # hash} entry, separate from clippy/build's own entries - see
      # clippy's setup-rust step comment above.
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-rust@main
        with:
          cache-key-prefix: test
          working-directory: ${{ inputs.working-directory }}
      - if: inputs.pre_build_command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre_build_command }}
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: cargo test 2>&1 | tee /tmp/test.log
      - name: Build test report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          outcome="${{ steps.scan.outcome }}"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "report<<TEST_REPORT_EOF"
            echo '### test'
            echo
            if [ "$outcome" = 'failure' ]; then
              echo '❌ cargo test failed:'
              echo '```'
              tail -n 60 /tmp/test.log 2>/dev/null || echo '(no log captured)'
              echo '```'
            else
              echo '✅ Tests passed.'
            fi
            echo "TEST_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - if: steps.scan.outcome == 'failure'
        run: exit 1

  build:
    name: build
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ inputs.enable_build && !inputs.is_dependabot }}
    steps:
      # cache-key-prefix scopes this job's own cargo-build-${Cargo.lock
      # hash} entry, separate from clippy/test's own entries - see
      # clippy's setup-rust step comment above.
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-rust@main
        with:
          cache-key-prefix: build
          working-directory: ${{ inputs.working-directory }}
      - if: inputs.pre_build_command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre_build_command }}
      - working-directory: ${{ inputs.working-directory }}
        run: cargo build --release

  dead-code:
    name: dead-code
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ inputs.enable_dead_code && !inputs.is_dependabot && (needs.changes.outputs.rust_source == 'true' || needs.changes.outputs.rust_deps == 'true') }}
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment and scan-with-report's own header comment (develop-node-ci.yml)
    # for why this no longer posts its own sticky comment / files its own
    # Linear ticket. Advisory-only, unchanged - never fails the job.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-rust@main
        with:
          cache-key-prefix: dead-code
          working-directory: ${{ inputs.working-directory }}
          cache: 'false'
      # cargo-machete (pinned version: cargo_machete_version input) is baked
      # into the `rust` self-hosted runner image at build time (see
      # gha-runner-docker/images/rust/Dockerfile), so no per-run cache/
      # install step is needed here - unlike cargo-dupes below, which isn't
      # baked in.
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: bash ${{ inputs.dead_code_script }}
      - name: Build dead-code report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "outcome=${{ steps.scan.outcome }}" >> "$GITHUB_OUTPUT"
          {
            echo "report<<DEAD_CODE_REPORT_EOF"
            if [ -f "${{ inputs.working-directory }}/dead-code-report.md" ]; then
              cat "${{ inputs.working-directory }}/dead-code-report.md"
            else
              echo '### dead-code'
              echo
              echo '(no report written - see the dead-code job'"'"'s own log)'
            fi
            echo "DEAD_CODE_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

  duplicate-code:
    name: duplicate-code
    needs: changes
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ inputs.enable_duplicate_code && !inputs.is_dependabot && needs.changes.outputs.rust_source == 'true' }}
    # Feeds the `danger-comment` aggregator below - see dead-code's identical
    # comment above.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-rust@main
        with:
          cache-key-prefix: duplicate-code
          working-directory: ${{ inputs.working-directory }}
          cache: 'false'
      # Unlike cargo-machete (baked into the `rust` runner image), cargo-dupes
      # is NOT baked in - confirmed against gha-runner-docker/images/rust/
      # Dockerfile, which has no cargo-dupes install step. Keep this
      # cache/install step until the image bakes it in too.
      - uses: actions/cache@v6
        id: dupes-cache
        with:
          path: ~/.cargo/bin/cargo-dupes
          key: cargo-dupes-${{ inputs.cargo_dupes_version }}
      - if: steps.dupes-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-dupes --version ${{ inputs.cargo_dupes_version }} --locked
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: bash ${{ inputs.duplicate_code_script }}
      - name: Build duplicate-code report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "outcome=${{ steps.scan.outcome }}" >> "$GITHUB_OUTPUT"
          {
            echo "report<<DUPLICATE_CODE_REPORT_EOF"
            if [ -f "${{ inputs.working-directory }}/duplicate-code-report.md" ]; then
              cat "${{ inputs.working-directory }}/duplicate-code-report.md"
            else
              echo '### duplicate-code'
              echo
              echo '(no report written - see the duplicate-code job'"'"'s own log)'
            fi
            echo "DUPLICATE_CODE_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

  file-size:
    name: file-size
    needs: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_file_size && !inputs.is_dependabot && needs.changes.outputs.rust_source == 'true' }}
    # Feeds the `danger-comment` aggregator below - see dead-code's identical
    # comment above. Report-only by design, no ticket ever filed for this
    # one (matches today's behavior - this job never had a ticket-filing
    # step).
    outputs:
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        # Report-only by design - never fails the job, matching
        # ai-harness-cli's existing file-size-scan.sh behavior.
        run: bash ${{ inputs.file_size_script }}
      - name: Build file-size report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "report<<FILE_SIZE_REPORT_EOF"
            if [ -f "${{ inputs.working-directory }}/file-size-report.md" ]; then
              cat "${{ inputs.working-directory }}/file-size-report.md"
            else
              echo '### file-size'
              echo
              echo '(no report written - see the file-size job'"'"'s own log)'
            fi
            echo "FILE_SIZE_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

  security-scan:
    name: security-scan
    needs: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot && needs.changes.outputs.rust_deps == 'true' }}
    # Feeds the `danger-comment` aggregator below - see fmt's identical
    # comment further up. Still a HARD gate via the final `exit 1` step.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: vuln
          label: vulnerabilities
          report-heading: '### security-scan'
          working-directory: ${{ inputs.working-directory }}
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - if: ${{ steps.scan.outputs.outcome == 'failure' }}
        run: exit 1

  secret-scan:
    name: secret-scan
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: secret
          label: secrets
          report-heading: '### secret-scan'
          working-directory: ${{ inputs.working-directory }}
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - if: ${{ steps.scan.outputs.outcome == 'failure' }}
        run: exit 1

  dependency-audit:
    name: dependency-audit
    runs-on: [self-hosted, catfood, catfood-rust]
    if: ${{ inputs.enable_dependency_audit && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-rust@main
        with:
          cache-key-prefix: dependency-audit
          working-directory: ${{ inputs.working-directory }}
          cache: 'false'
      - run: cargo install cargo-audit --locked
      - id: scan
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: cargo audit 2>&1 | tee /tmp/dependency-audit.log
      - name: Build dependency-audit report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          outcome="${{ steps.scan.outcome }}"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "report<<DEPENDENCY_AUDIT_REPORT_EOF"
            echo '### dependency-audit'
            echo
            if [ "$outcome" = 'failure' ]; then
              echo '❌ Known vulnerabilities found:'
              echo '```'
              tail -n 60 /tmp/dependency-audit.log 2>/dev/null || echo '(no log captured)'
              echo '```'
            else
              echo '✅ No known vulnerabilities found.'
            fi
            echo "DEPENDENCY_AUDIT_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - if: steps.scan.outcome == 'failure'
        run: exit 1

  tech-debt:
    name: tech-debt
    needs: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_tech_debt && !inputs.is_dependabot && needs.changes.outputs.rust_source == 'true' }}
    permissions:
      contents: read
    outputs:
      report: ${{ steps.tech-debt-report.outputs.report }}
    steps:
      # No setup-rust call, no setup-node either: this is a plain grep over
      # the tracked .rs tree, no built workspace or Node runtime needed -
      # just check out the repo. tech-debt-report-rust only computes
      # metrics and emits a `report` output; posting it is now the
      # `danger-comment` aggregator below's job (see that job's header
      # comment) - the separate tech-debt-comment job this used to feed is
      # gone.
      - uses: actions/checkout@v7
      - uses: PeterChauYEG/labone-actions/.github/actions/tech-debt-report-rust@main
        id: tech-debt-report
        with:
          working-directory: ${{ inputs.working-directory }}
          pr-number: ${{ inputs.pr_number }}
          base-sha: ${{ inputs.pr_base_sha }}

  # Single aggregator for every scan/gate job above that reports findings:
  # fmt, clippy, test, dead-code, duplicate-code, file-size, security-scan,
  # secret-scan, dependency-audit, tech-debt. Posts ONE sticky PR comment
  # covering all of them and files (deduped, via scripts/file-linear-ticket.sh
  # - already per-PR-per-job deduped, see that script's own header) a Linear
  # ticket for whichever failed - instead of each independently generating
  # its own Dangerfile / posting its own sticky comment / filing its own
  # ticket, which is what this file did until now. `tech-debt` is
  # metrics-only and never fails, so it's included in the comment but never
  # gets a ticket; same for `file-size` (report-only by design, no ticket
  # today either).
  #
  # `if: always()` so this still runs (and can report) when an upstream job
  # failed - same rationale as required-checks' identical `if: always()`
  # below. Skips entirely only when every one of the ten upstream jobs was
  # skipped (e.g. a PR touching nothing Rust-related and every scan
  # disabled).
  #
  # `outcome` on each upstream job's outputs is that job's OWN verdict, not
  # `needs.<job>.result` - fmt/clippy/test/security-scan/secret-scan/
  # dependency-audit are still hard gates (their own final `exit 1` step
  # still makes `needs.<job>.result` 'failure' too), but dead-code/
  # duplicate-code are advisory-only and their jobs never fail - only
  # `outputs.outcome` reflects whether they actually found something.
  danger-comment:
    name: danger-comment
    needs:
      [
        fmt,
        clippy,
        test,
        dead-code,
        duplicate-code,
        file-size,
        security-scan,
        secret-scan,
        dependency-audit,
        tech-debt,
      ]
    if: |
      always() &&
      (needs.fmt.result != 'skipped' ||
       needs.clippy.result != 'skipped' ||
       needs.test.result != 'skipped' ||
       needs.dead-code.result != 'skipped' ||
       needs.duplicate-code.result != 'skipped' ||
       needs.file-size.result != 'skipped' ||
       needs.security-scan.result != 'skipped' ||
       needs.secret-scan.result != 'skipped' ||
       needs.dependency-audit.result != 'skipped' ||
       needs.tech-debt.result != 'skipped')
    runs-on: [self-hosted, catfood, catfood-minimal]
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Checked out separately (not the caller repo) purely to get
      # scripts/file-linear-ticket.sh, which lives in labone-actions
      # regardless of which repo calls this workflow.
      - uses: PeterChauYEG/labone-actions/.github/actions/build-danger-comment@main
        with:
          heading: '## Rust checks'
          sticky-header: rust-checks
          entries: |
            [
              {"name": "fmt", "result": ${{ toJSON(needs.fmt.result) }}, "report": ${{ toJSON(needs.fmt.outputs.report) }}},
              {"name": "clippy", "result": ${{ toJSON(needs.clippy.result) }}, "report": ${{ toJSON(needs.clippy.outputs.report) }}},
              {"name": "test", "result": ${{ toJSON(needs.test.result) }}, "report": ${{ toJSON(needs.test.outputs.report) }}},
              {"name": "dead-code", "result": ${{ toJSON(needs.dead-code.result) }}, "report": ${{ toJSON(needs.dead-code.outputs.report) }}},
              {"name": "duplicate-code", "result": ${{ toJSON(needs.duplicate-code.result) }}, "report": ${{ toJSON(needs.duplicate-code.outputs.report) }}},
              {"name": "file-size", "result": ${{ toJSON(needs.file-size.result) }}, "report": ${{ toJSON(needs.file-size.outputs.report) }}},
              {"name": "security-scan", "result": ${{ toJSON(needs.security-scan.result) }}, "report": ${{ toJSON(needs.security-scan.outputs.report) }}},
              {"name": "secret-scan", "result": ${{ toJSON(needs.secret-scan.result) }}, "report": ${{ toJSON(needs.secret-scan.outputs.report) }}},
              {"name": "dependency-audit", "result": ${{ toJSON(needs.dependency-audit.result) }}, "report": ${{ toJSON(needs.dependency-audit.outputs.report) }}},
              {"name": "tech-debt", "result": ${{ toJSON(needs.tech-debt.result) }}, "report": ${{ toJSON(needs.tech-debt.outputs.report) }}}
            ]
      - name: File Linear ticket for fmt
        if: ${{ needs.fmt.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh fmt /tmp/fmt-report.md
      - name: File Linear ticket for clippy
        if: ${{ needs.clippy.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh clippy /tmp/clippy-report.md
      - name: File Linear ticket for test
        if: ${{ needs.test.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh test /tmp/test-report.md
      - name: File Linear ticket for dead-code
        if: ${{ needs.dead-code.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh dead-code /tmp/dead-code-report.md
      - name: File Linear ticket for duplicate-code
        if: ${{ needs.duplicate-code.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh duplicate-code /tmp/duplicate-code-report.md
      - name: File Linear ticket for security-scan
        if: ${{ needs.security-scan.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh security-scan /tmp/security-scan-report.md
      - name: File Linear ticket for secret-scan
        if: ${{ needs.secret-scan.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh secret-scan /tmp/secret-scan-report.md
      - name: File Linear ticket for dependency-audit
        if: ${{ needs.dependency-audit.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh dependency-audit /tmp/dependency-audit-report.md

  # `danger-comment` above is deliberately excluded from `needs:` below -
  # purely advisory/reporting, like dead-code/duplicate-code/file-size, and
  # never fails on its own either.
  required-checks:
    name: required-checks
    needs: [changes, actionlint, fmt, clippy, test, build, dead-code, duplicate-code, file-size, security-scan, secret-scan, dependency-audit]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
