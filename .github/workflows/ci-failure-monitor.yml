name: CI Failure Monitor

on:
  workflow_call:
    inputs:
      conclusion:
        description: github.event.workflow_run.conclusion from the caller
        type: string
        required: true
      workflow_name:
        description: github.event.workflow_run.name from the caller
        type: string
        required: true
      run_url:
        description: github.event.workflow_run.html_url from the caller
        type: string
        required: true
      run_id:
        description: github.event.workflow_run.id from the caller
        type: string
        required: true
      repo_name:
        description: github.event.repository.name from the caller
        type: string
        required: true
    secrets:
      LINEAR_API_KEY:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout ops repo for project metadata
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: PeterChauYEG/ops
          path: .ops-metadata
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Linear ticket for CI failure
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RUN_URL: ${{ inputs.run_url }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "CI failure detected!"
          echo "  Repo: $REPO_NAME"
          echo "  Workflow: $WORKFLOW_NAME"
          echo "  Run URL: $RUN_URL"

          JOB_DETAILS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | "- **\(.name)**: \(.conclusion)"' \
            2>/dev/null || echo "")

          if [ -n "$JOB_DETAILS" ]; then
            ERROR_DETAILS="### Failed Jobs"$'\n'"$JOB_DETAILS"
          else
            ERROR_DETAILS="CI workflow failed. Check the workflow run for details."
          fi

          TITLE="🔴 CI failing on main: $REPO_NAME"
          DESCRIPTION="## CI Failure on Main Branch

          **Repository:** \`$REPO_NAME\`
          **Workflow:** \`$WORKFLOW_NAME\`
          **Detected:** $(date '+%Y-%m-%d %H:%M:%S')

          ### Details
          $ERROR_DETAILS

          ### Action Items
          - [ ] Investigate the failure
          - [ ] Fix the issue
          - [ ] Verify CI passes on main

          [View CI Run]($RUN_URL)"

          SEARCH_QUERY="query { issues( filter: { team: { key: { eq: \"LAB\" } }, state: { type: { nin: [\"completed\", \"cancelled\"] } }, title: { contains: \"CI failing on main: ${REPO_NAME}\" } }, first: 1 ) { nodes { id identifier title state { name } } } }"

          SEARCH_RESPONSE=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(echo "$SEARCH_QUERY" | jq -Rs '{query: .}')")

          EXISTING_COUNT=$(echo "$SEARCH_RESPONSE" | jq -r '.data.issues.nodes | length')

          if [[ "$EXISTING_COUNT" -gt 0 ]]; then
            EXISTING_ID=$(echo "$SEARCH_RESPONSE" | jq -r '.data.issues.nodes[0].identifier')
            EXISTING_STATE=$(echo "$SEARCH_RESPONSE" | jq -r '.data.issues.nodes[0].state.name')
            echo "Found existing ticket: $EXISTING_ID (status: $EXISTING_STATE) — skipping"
            exit 0
          fi

          STATES=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ workflowStates(filter: { team: { key: { eq: \"LAB\" } } }) { nodes { id name type } } }"}')

          BACKLOG_ID=$(echo "$STATES" | jq -r '.data.workflowStates.nodes[] | select(.name == "Backlog") | .id')

          if [[ -z "$BACKLOG_ID" || "$BACKLOG_ID" == "null" ]]; then
            echo "ERROR: Could not find Backlog state for LAB team" >&2
            exit 1
          fi

          TEAM_RESPONSE=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ teams(filter: { key: { eq: \"LAB\" } }) { nodes { id } } }"}')

          TEAM_ID=$(echo "$TEAM_RESPONSE" | jq -r '.data.teams.nodes[0].id')

          if [[ -z "$TEAM_ID" || "$TEAM_ID" == "null" ]]; then
            echo "ERROR: Could not find LAB team" >&2
            exit 1
          fi

          PROJECT_DATA=$(jq -r --arg repo "$REPO_NAME" '.projects[] | select(.name == $repo)' .ops-metadata/projects.json 2>/dev/null || echo "{}")
          PROJECT_TYPE=$(echo "$PROJECT_DATA" | jq -r '.type // "unknown"')
          LINEAR_PROJECT_ID=$(echo "$PROJECT_DATA" | jq -r '.linearProjectId // ""')

          echo "Project type: $PROJECT_TYPE"
          echo "Linear project ID: $LINEAR_PROJECT_ID"

          LABEL_ID=$(jq -r --arg type "$PROJECT_TYPE" '.labelsByType[$type].id // ""' .ops-metadata/linear-labels.json 2>/dev/null || echo "")

          MUTATION='mutation($teamId: String!, $title: String!, $description: String!, $stateId: String!, $projectId: String, $labelIds: [String!]) {
            issueCreate(input: {
              teamId: $teamId,
              title: $title,
              description: $description,
              stateId: $stateId,
              priority: 1,
              projectId: $projectId,
              labelIds: $labelIds
            }) {
              success
              issue { id identifier url }
            }
          }'

          VARIABLES=$(jq -n \
            --arg teamId "$TEAM_ID" \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg stateId "$BACKLOG_ID" \
            --arg projectId "$LINEAR_PROJECT_ID" \
            --arg labelId "$LABEL_ID" \
            '{
              teamId: $teamId,
              title: $title,
              description: $description,
              stateId: $stateId,
              projectId: (if $projectId != "" then $projectId else null end),
              labelIds: (if $labelId != "" then [$labelId] else [] end)
            }')

          CREATE_RESPONSE=$(jq -n \
            --arg mutation "$MUTATION" \
            --argjson variables "$VARIABLES" \
            '{query: $mutation, variables: $variables}' | \
            curl -s -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d @-)

          SUCCESS=$(echo "$CREATE_RESPONSE" | jq -r '.data.issueCreate.success')
          if [[ "$SUCCESS" == "true" ]]; then
            TICKET_ID=$(echo "$CREATE_RESPONSE" | jq -r '.data.issueCreate.issue.identifier')
            TICKET_URL=$(echo "$CREATE_RESPONSE" | jq -r '.data.issueCreate.issue.url')
            echo "✅ Created Linear ticket: $TICKET_ID"
            echo "   URL: $TICKET_URL"
          else
            echo "❌ Failed to create ticket" >&2
            echo "$CREATE_RESPONSE" | jq '.' >&2
            exit 1
          fi

      - name: Notify Slack
        if: always()
        env:
          REPO_NAME: ${{ inputs.repo_name }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RUN_URL: ${{ inputs.run_url }}
        run: |
          curl -s -X POST "https://hooks.slack.com/services/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" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \":red_circle: *CI failed on main* — \`${REPO_NAME}\` / ${WORKFLOW_NAME} — <${RUN_URL}|View run>\"}"
