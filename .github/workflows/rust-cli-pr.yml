name: Rust CLI PR Orchestrator

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory (relative to the repo root) the Cargo project lives in.
        type: string
        required: false
        default: '.'
      also_treat_actions_bot_as_dependabot:
        type: boolean
        required: false
        default: false
      pre_build_command:
        description: >
          Arbitrary shell run once per job (fmt/clippy/test), before the
          job's actual cargo command - e.g. installing private-git SDK
          dependencies. Empty (no-op) by default.
        type: string
        required: false
        default: ''
      enable_build:
        description: Run `cargo build --release`. Off by default for CLIs.
        type: boolean
        required: false
        default: false
      dead_code_script:
        type: string
        required: false
        default: 'scripts/dead-code-scan.sh'
      cargo_machete_version:
        type: string
        required: false
        default: '0.9.2'
      enable_duplicate_code:
        description: Only turn on if this repo has scripts/ci/duplicate-code-scan.sh.
        type: boolean
        default: false
      duplicate_code_script:
        type: string
        required: false
        default: 'scripts/ci/duplicate-code-scan.sh'
      cargo_dupes_version:
        type: string
        required: false
        default: '0.2.1'
      enable_file_size:
        description: Only turn on if this repo has scripts/ci/file-size-scan.sh.
        type: boolean
        default: false
      file_size_script:
        type: string
        required: false
        default: 'scripts/ci/file-size-scan.sh'
      security_scan_trivyignores:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust-ci:
    name: rust-ci
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
    uses: PeterChauYEG/labone-actions/.github/workflows/develop-rust-ci.yml@main
    secrets: inherit
    with:
      working-directory: ${{ inputs.working-directory }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
      is_dependabot: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (inputs.also_treat_actions_bot_as_dependabot && github.event.pull_request.user.login == 'github-actions[bot]') }}
      pre_build_command: ${{ inputs.pre_build_command }}
      enable_build: ${{ inputs.enable_build }}
      enable_dead_code: true
      dead_code_script: ${{ inputs.dead_code_script }}
      cargo_machete_version: ${{ inputs.cargo_machete_version }}
      enable_duplicate_code: ${{ inputs.enable_duplicate_code }}
      duplicate_code_script: ${{ inputs.duplicate_code_script }}
      cargo_dupes_version: ${{ inputs.cargo_dupes_version }}
      enable_file_size: ${{ inputs.enable_file_size }}
      file_size_script: ${{ inputs.file_size_script }}
      enable_security_scan: false
      security_scan_trivyignores: ${{ inputs.security_scan_trivyignores }}
      enable_dependency_audit: false
