name: Rust PR Orchestrator

# Thin orchestrator layer between a Rust CLI/tool repo's own develop.yml
# and develop-rust-ci.yml (LAB-2096). Bakes in what every existing rust
# caller repeats today - pr_number/pr_url/is_dependabot computation, the
# `if: github.event.action != 'closed'` guard, the PR concurrency group,
# the actionlint sibling job, and the `pull-requests: write` grant
# develop-rust-ci.yml's fmt/clippy/test/dead-code/duplicate-code/file-size
# jobs all need (every one of them declares its own job-level
# `permissions: pull-requests: write` for sticky-PR-comment/
# Linear-ticket-filing - same startup_failure risk documented for
# develop-node-ci.yml/develop-ci.yml in README.md). A caller repo
# `develop.yml` now only needs `uses: .../rust-pr.yml@main` with zero
# `with:` keys for the common case.
#
# github.event.pull_request is available here because the outermost
# trigger (the calling repo's own develop.yml) is still `pull_request` -
# that context flows transitively through the whole `workflow_call` chain.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory (relative to the repo root) the Cargo project lives in.
        type: string
        required: false
        default: '.'
      also_treat_actions_bot_as_dependabot:
        description: >
          OR'd into the computed is_dependabot expression - set true for a
          repo whose main.yml pre-creates check-runs for its own CalVer
          version-bump PR (opened by github-actions[bot]).
        type: boolean
        required: false
        default: false
      pre_build_command:
        description: >
          Arbitrary shell run once per job (fmt/clippy/test/build), before
          the job's actual cargo command - e.g. installing private-git SDK
          dependencies. Empty (no-op) by default.
        type: string
        required: false
        default: ''
      enable_build:
        description: Run `cargo build --release`.
        type: boolean
        default: false
      enable_dead_code:
        description: Run a cargo-machete dead-dependency scan.
        type: boolean
        default: true
      dead_code_script:
        description: Path (relative to working-directory) to the dead-code-scan script.
        type: string
        required: false
        default: 'scripts/dead-code-scan.sh'
      cargo_machete_version:
        description: Informational only - see develop-rust-ci.yml's identical input.
        type: string
        required: false
        default: '0.9.2'
      enable_duplicate_code:
        description: Run a cargo-dupes duplicate-code scan. Off by default.
        type: boolean
        default: false
      duplicate_code_script:
        description: Path (relative to working-directory) to the duplicate-code-scan script.
        type: string
        required: false
        default: 'scripts/ci/duplicate-code-scan.sh'
      cargo_dupes_version:
        description: Pinned cargo-dupes version.
        type: string
        required: false
        default: '0.2.1'
      enable_file_size:
        description: Run a file-size scan. Report-only, off by default.
        type: boolean
        default: false
      file_size_script:
        description: Path (relative to working-directory) to the file-size-scan script.
        type: string
        required: false
        default: 'scripts/ci/file-size-scan.sh'
      enable_security_scan:
        description: Run the Trivy filesystem vuln/secret scan (HIGH,CRITICAL fail).
        type: boolean
        default: true
      security_scan_trivyignores:
        description: >
          Comma-separated list of relative paths to .trivyignore file(s), or
          a single .trivyignore.yaml file.
        type: string
        required: false
        default: ''
      enable_dependency_audit:
        description: Run `cargo audit`. Off by default.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust-ci:
    name: rust-ci
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
    uses: PeterChauYEG/labone-actions/.github/workflows/develop-rust-ci.yml@main
    secrets: inherit
    with:
      working-directory: ${{ inputs.working-directory }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
      is_dependabot: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (inputs.also_treat_actions_bot_as_dependabot && github.event.pull_request.user.login == 'github-actions[bot]') }}
      pre_build_command: ${{ inputs.pre_build_command }}
      enable_build: ${{ inputs.enable_build }}
      enable_dead_code: ${{ inputs.enable_dead_code }}
      dead_code_script: ${{ inputs.dead_code_script }}
      cargo_machete_version: ${{ inputs.cargo_machete_version }}
      enable_duplicate_code: ${{ inputs.enable_duplicate_code }}
      duplicate_code_script: ${{ inputs.duplicate_code_script }}
      cargo_dupes_version: ${{ inputs.cargo_dupes_version }}
      enable_file_size: ${{ inputs.enable_file_size }}
      file_size_script: ${{ inputs.file_size_script }}
      enable_security_scan: ${{ inputs.enable_security_scan }}
      security_scan_trivyignores: ${{ inputs.security_scan_trivyignores }}
      enable_dependency_audit: ${{ inputs.enable_dependency_audit }}

  actionlint:
    if: github.event.action != 'closed'
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
