name: Godot PR Orchestrator

# Thin orchestrator layer between a Godot 4/GDScript repo's own develop.yml
# and godot-develop-ci.yml (LAB-2096). Bakes in what every existing godot
# caller repeats today - pr_number/pr_url/is_dependabot computation, the
# `if: github.event.action != 'closed'` guard, the PR concurrency group,
# the actionlint sibling job, and the `pull-requests: write` grant
# godot-develop-ci.yml's format/lint/duplicate-code/test jobs all need
# (every one of them declares its own job-level `permissions:
# pull-requests: write` for sticky-PR-comment/Linear-ticket-filing - a
# caller missing this fails the ENTIRE run with `startup_failure`, 0 jobs -
# see templates/godot-pr.yml's prior comment, now baked in here instead).
# A caller repo `develop.yml` now only needs `uses: .../godot-pr.yml@main`
# with zero `with:` keys for the common case.
#
# github.event.pull_request is available here because the outermost
# trigger (the calling repo's own develop.yml) is still `pull_request` -
# that context flows transitively through the whole `workflow_call` chain.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory (relative to the repo root) the Godot project lives in.
        type: string
        required: false
        default: '.'
      also_treat_actions_bot_as_dependabot:
        description: >
          OR'd into the computed is_dependabot expression - set true for a
          repo whose main.yml pre-creates check-runs for its own CalVer
          version-bump PR (opened by github-actions[bot]).
        type: boolean
        required: false
        default: false
      enable_test:
        description: >
          Run GUT tests under `tests-path`. Set false only for repos that
          structurally can't run GUT standalone (e.g. a plugin monorepo
          whose class_name symbols only resolve inside a separate host
          project) - document why in the caller if you do.
        type: boolean
        required: false
        default: true
      tests-path:
        description: GUT test directory, relative to working-directory.
        type: string
        required: false
        default: 'tests'

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  godot-ci:
    name: godot-ci
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
    uses: PeterChauYEG/labone-actions/.github/workflows/godot-develop-ci.yml@main
    secrets: inherit
    with:
      working-directory: ${{ inputs.working-directory }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
      is_dependabot: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (inputs.also_treat_actions_bot_as_dependabot && github.event.pull_request.user.login == 'github-actions[bot]') }}
      enable_test: ${{ inputs.enable_test }}
      tests-path: ${{ inputs.tests-path }}

  actionlint:
    if: github.event.action != 'closed'
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}

  # Add repo-specific bespoke jobs below as needed (e.g. dead-code,
  # a project-specific smoke test) - none of these are standardized in
  # godot-develop-ci.yml.
