name: Godot PR Orchestrator

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory (relative to the repo root) the Godot project lives in.
        type: string
        required: false
        default: '.'
      also_treat_actions_bot_as_dependabot:
        type: boolean
        required: false
        default: false
      enable_test:
        description: >
          Run GUT tests under `tests-path`. Set false only for repos that
          structurally can't run GUT standalone (e.g. a plugin monorepo
          whose class_name symbols only resolve inside a separate host
          project) - document why in the caller if you do.
        type: boolean
        required: false
        default: true
      tests-path:
        description: GUT test directory, relative to working-directory.
        type: string
        required: false
        default: 'tests'

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  godot-ci:
    name: godot-ci
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
    uses: PeterChauYEG/labone-actions/.github/workflows/godot-develop-ci.yml@main
    secrets: inherit
    with:
      working-directory: ${{ inputs.working-directory }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
      is_dependabot: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (inputs.also_treat_actions_bot_as_dependabot && github.event.pull_request.user.login == 'github-actions[bot]') }}
      enable_test: ${{ inputs.enable_test }}
      tests-path: ${{ inputs.tests-path }}

  actionlint:
    if: github.event.action != 'closed'
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    secrets: inherit
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
