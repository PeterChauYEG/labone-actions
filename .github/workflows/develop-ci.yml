name: Develop CI

# Reusable PR-time CI for yarn/Next.js-ish web repos. Callers are thin
# wrappers: `on: pull_request` -> `uses: PeterChauYEG/labone-actions/.github/workflows/develop-ci.yml@main`
# with `secrets: inherit`. See README.md for the full caller example and a
# stability note on the input/job names below (a phase-2 migration of
# laboratory-one-web depends on them being exact).
#
# Job coverage mirrors the design-system/dead-code/duplicate-code/
# react-tech-debt/max-lines jobs that today are hand-copied into
# laboratory-one-web's and ai-harness-web's develop.yml. Every job past
# lint/typecheck is optional via an `enable_*` boolean input (default true),
# following the pre-existing `enable_ls_lint` precedent, so a repo without
# (say) a `design-system` yarn script can turn that job off instead of being
# forced to run it.
#
# a11y and run-e2e-tests (Playwright/Chromium-based) were removed org-wide
# (fleet-wide decision to drop Playwright/Chromium/a11y/e2e CI support) -
# see the PR that removed enable_a11y/enable_e2e from this file.
#
# `tech-debt` is the one exception to that "default true"
# precedent: it's a brand-new grep-based metrics report (useEffect count,
# RN Animated usage, eslint-disable/@ts-ignore/`any` suppressions, TODO/
# FIXME/HACK comments, console.log), not a job any consumer repo already
# runs today, so `enable_tech_debt` defaults **false** - opt in per repo
# rather than suddenly appearing on every caller's next PR. Unlike the
# other scan jobs it never fails the job (it's a metrics report, not a
# gate) and doesn't need node_modules/yarn, so it's a plain
# `.github/actions/tech-debt-report` call with no `setup-node-yarn` step
# first. See that action's own header comment for the full metric list and
# the `pr_base_sha` input for the optional delta-vs-base-branch column.
#
# `danger-comment` is the single aggregator that posts ONE sticky PR comment
# covering peer-deps/security-scan/secret-scan/design-system/dead-code/
# duplicate-code/react-tech-debt/max-lines/tech-debt, and files a (deduped)
# Linear ticket for whichever of those failed. It replaces what used to be
# each of those jobs independently generating its own Dangerfile/comment/
# ticket (including the separate `tech-debt-comment` job, now gone) - see
# that job's own header comment below for the full rationale.
#
# Caching (LAB-1371): every job (not just `setup`) calls `setup-node-yarn`
# directly, which restores node_modules from a cache keyed on yarn.lock's
# hash (not the run id) and only runs `yarn install --frozen-lockfile`
# itself on a miss. Previously `setup` alone installed once and fanned the
# result out to every other job via a GitHub Actions artifact upload/
# download - that made every single run/job pair create its own artifact
# copy regardless of whether the lockfile had changed, which is what kept
# blowing the account-wide Actions artifact storage quota. See README.md
# "Caching strategy".

on:
  workflow_call:
    inputs:
      working-directory:
        description: >
          Directory (relative to the repo root) the Next.js/yarn app lives
          in. Defaults to `.` (repo root) so every existing caller keeps
          working with zero changes. Set this for a monorepo caller, e.g.
          `prototype`.
        type: string
        required: false
        default: '.'
      pr_number:
        description: >
          github.event.pull_request.number from the caller (required for
          correct concurrency grouping and for the Linear ticket / sticky
          comment steps below).
        type: number
        required: false
        default: 0
      pr_url:
        description: >
          github.event.pull_request.html_url from the caller (used by the
          Linear ticket-filing steps; reusable workflows can't see
          github.event.pull_request directly).
        type: string
        required: false
        default: ''
      pr_base_sha:
        description: >
          github.event.pull_request.base.sha from the caller. Only used by
          the `tech-debt` job (when `enable_tech_debt` is true) to compute
          a delta vs. the PR's base branch - see
          `.github/actions/tech-debt-report`'s `base-sha` input. Leave
          empty (default) to skip the delta and get current-totals only;
          harmless to leave unset for every caller that doesn't enable
          `tech-debt`.
        type: string
        required: false
        default: ''
      is_dependabot:
        description: >
          Whether this PR was opened by dependabot[bot]. Caller must compute
          this from github.event.pull_request.user.login, since reusable
          workflows can't see that context directly. When true, every
          optional scan/test job below is skipped except `lint`, `typecheck`
          and `build` (a broken build is exactly what a dependency bump can
          cause, so it stays on even for dependabot).
        type: boolean
        required: false
        default: false
      enable_ls_lint:
        description: Run the ls-lint file naming check.
        type: boolean
        default: true
      enable_build:
        description: Run `yarn build`.
        type: boolean
        default: true
      enable_test:
        description: Run `yarn test:coverage`.
        type: boolean
        default: true
      enable_design_system:
        description: Run `yarn design-system`, with PR sticky comment + Linear ticket filing on failure.
        type: boolean
        default: true
      enable_dead_code:
        description: Run `yarn dead-code`, with PR sticky comment + Linear ticket filing on failure.
        type: boolean
        default: true
      enable_duplicate_code:
        description: Run `yarn duplicate-code`, with PR sticky comment + Linear ticket filing on failure.
        type: boolean
        default: true
      enable_react_tech_debt:
        description: Run `yarn react-tech-debt`, with PR sticky comment on failure (no ticket).
        type: boolean
        default: true
      enable_max_lines:
        description: Run the max-lines scan, with PR sticky comment on failure (no ticket).
        type: boolean
        default: true
      max_lines_script_source:
        description: >
          Passed straight through to scan-with-report's `script-source`
          input for the max-lines job (see that action's own description).
          `'repo'` (default) keeps today's behavior — `yarn max-lines`,
          vendored into the caller repo. `'labone-actions'` runs this repo's
          shared scripts/max-lines-scan.mjs instead, so the caller only
          needs eslint.max-lines.config.mjs. Opt-in per caller while this
          migrates off vendored copies (pilot: gamecraft) — every other
          `enable_*`/scan job is unaffected.
        type: string
        required: false
        default: 'repo'
      enable_tech_debt:
        description: >
          Run the grep-based tech-debt metrics report (useEffect/Animated/
          eslint-disable/@ts-ignore/any/TODO-FIXME-HACK/console.log counts)
          and post it as a sticky PR comment. Opt-in, unlike every other
          `enable_*` above - defaults false since no consumer repo has this
          today. See this file's header comment.
        type: boolean
        default: false
      extra_deps_paths:
        description: >
          Space-separated list of additional paths (relative to
          working-directory) to carry from the `setup` job into every
          downstream job, beyond node_modules and .next/cache — e.g. a
          gitignored src/generated/ directory populated by a `postinstall`
          codegen script. Passed straight through to setup-node-yarn's
          extra-paths input.
        type: string
        required: false
        default: ''
      test_script_args:
        description: >
          Extra CLI args forwarded to the caller's `test:coverage` script.
          Defaults to Jest's cache flags (every existing caller runs Jest).
          A Vitest-based caller must override this - Vitest 4 removed the
          `--cacheDirectory` CLI flag ("Unknown option `--cacheDirectory`");
          pass `--cache` only, and set the cache directory via Vite's
          `cacheDir` config option in vitest.config.ts instead (point it at
          `.jestcache` to match `cache-path` below).
        type: string
        required: false
        default: '--cache --cacheDirectory .jestcache'
      enable_security_scan:
        description: Run the Trivy filesystem vulnerability scan (HIGH,CRITICAL fail).
        type: boolean
        default: true
      security_scan_trivyignores:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

# Scoped per repo+PR so callers don't cancel each other.
# pr_number must be passed explicitly because github.event.pull_request
# is not populated in the called workflow context.

jobs:
  changes:
    name: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      web_source: ${{ steps.filter.outputs.web_source }}
      web_deps: ${{ steps.filter.outputs.web_deps }}
      tsconfig: ${{ steps.filter.outputs.tsconfig }}
      eslint_config: ${{ steps.filter.outputs.eslint_config }}
      jest_config: ${{ steps.filter.outputs.jest_config }}
      react_ui: ${{ steps.filter.outputs.react_ui }}
      ls_lint: ${{ steps.filter.outputs.ls_lint }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/web-changes@main
        id: filter

  actionlint:
    name: actionlint
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    secrets: inherit
    uses: PeterChauYEG/labone-actions/.github/workflows/actionlint.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
      pr_url: ${{ inputs.pr_url }}

  setup:
    name: setup
    needs: changes
    runs-on: [self-hosted, catfood, catfood-node]
    # Deliberately narrower than (and independent of) the caller's own
    # workflow-level `concurrency:` group (grouped per PR number, see
    # templates/*-pr.yml and README.md "Concurrency" point 1) — this one is
    # scoped to just this job, per repo, with no PR number, so it queues
    # (never cancels) `yarn install --frozen-lockfile` runs from *different*
    # PRs of the same repo instead of letting them execute simultaneously on
    # the shared catfood runner pool. LAB-1301: budget PRs #170/#171/
    # #173-#176 landed on the runner host within seconds of each other and
    # were all OOM-killed ~28s into this step; PR #169 passed cleanly at a
    # quieter moment. Every other job in this workflow (lint/typecheck/
    # build/etc.) only restores the already-built deps artifact — cheap
    # enough to still run fully in parallel — so only this job needs
    # serializing. This is a job-level group, not the workflow-level one
    # main-ci.yml/main-node-ci.yml own, so it can't hit the parent/child
    # deadlock described in README.md "Concurrency" point 1.
    concurrency:
      group: catfood-yarn-install-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: setup
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          # Optional per-repo secret — only set for repos with a private
          # git-dependency package.json entry (e.g.
          # "eslint-plugin-lab-react-standards": "github:...#main"). Empty
          # string for every other repo, which setup-node-yarn treats as
          # "skip ssh-agent setup".
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          # Optional per-repo secret — only set for repos whose postinstall
          # script needs `gh` CLI access to a sibling private repo (e.g.
          # gamecraft fetching a generated SDK release from
          # gamecraft-api). Empty string for every other repo, which
          # setup-node-yarn treats as "no GH_TOKEN for the install step".
          gh-token: ${{ secrets.GH_PAT }}
          # PR runs only read the node_modules cache written by main-ci.yml
          # (via restore-keys/exact-key match against main's cache) — see
          # setup-node-yarn's cache-write input description and README.md
          # "Caching strategy".
          cache-write: 'false'

  peer-deps:
    name: peer-deps
    needs: changes
    # catfood-node, not catfood-minimal: this job's own steps run
    # `corepack enable` + `actions/setup-node@v7`, which need the Node
    # toolchain catfood-minimal deliberately excludes (see images/minimal's
    # own description in gha-runner-docker's README) - every job below that
    # actually needs Node stays on catfood-node the same way. Confirmed live
    # via gamecraft PR #305/#308: every peer-deps run failed immediately at
    # `corepack enable` (`corepack: command not found`, exit 127) since it
    # was scheduled on the Node-less image.
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ needs.changes.outputs.web_deps == 'true' }}
    # Feeds the `danger-comment` aggregator below. This stays a HARD gate
    # (unchanged from before - the check step's own failure still fails the
    # job via the final `exit 1` step) - continue-on-error here only lets
    # the job reach its own report/outcome-capturing step instead of
    # stopping dead, same pattern as security-scan/secret-scan below.
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.working-directory }}/package.json
      - name: Check for peer dependency conflicts
        id: check
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          yarn install --immutable 2>&1 | tee /tmp/peer-deps-check.log
          if grep -q "YN0060" /tmp/peer-deps-check.log; then
            echo "Peer dependency conflicts detected:"
            grep "YN0060" /tmp/peer-deps-check.log
            exit 1
          fi
      - name: Build peer-deps report
        id: result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          outcome="${{ steps.check.outcome }}"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          {
            echo "report<<PEER_DEPS_REPORT_EOF"
            echo '### peer-deps'
            echo
            if [ "$outcome" = 'failure' ]; then
              echo '❌ Peer dependency conflicts detected:'
              echo '```'
              tail -n 60 /tmp/peer-deps-check.log 2>/dev/null || echo '(no log captured)'
              echo '```'
            else
              echo '✅ No peer dependency conflicts detected.'
            fi
            echo "PEER_DEPS_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - if: ${{ steps.check.outcome == 'failure' }}
        run: exit 1

  security-scan:
    name: security-scan
    needs: changes
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot && needs.changes.outputs.web_deps == 'true' }}
    # Feeds the `danger-comment` aggregator below. Still a HARD gate,
    # unchanged - continue-on-error on the Trivy step only lets this job
    # reach its own report-capturing step instead of stopping dead; the
    # final `exit 1` step below restores the fail-the-job behavior.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: vuln
          label: vulnerabilities
          report-heading: '### security-scan'
          working-directory: ${{ inputs.working-directory }}
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - if: ${{ steps.scan.outputs.outcome == 'failure' }}
        run: exit 1

  secret-scan:
    name: secret-scan
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_security_scan && !inputs.is_dependabot }}
    # Feeds the `danger-comment` aggregator below - see security-scan's
    # identical comment above.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: secret
          label: secrets
          report-heading: '### secret-scan'
          working-directory: ${{ inputs.working-directory }}
          trivyignores: ${{ inputs.security_scan_trivyignores }}
      - if: ${{ steps.scan.outputs.outcome == 'failure' }}
        run: exit 1

  lint:
    name: lint
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ needs.changes.outputs.web_source == 'true' || needs.changes.outputs.web_deps == 'true' || needs.changes.outputs.eslint_config == 'true' }}
    steps:
      # --cache/--cache-location are passed through to the caller's `lint`
      # script (yarn forwards extra CLI args to the underlying command) —
      # assumes that script ultimately invokes eslint, true for every
      # existing caller. A miss is a no-op flag for a non-eslint script.
      # cache-write false: only main-ci.yml writes a new .eslintcache entry
      # - see cached-script's cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: lint
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: lint
          script-args: --cache --cache-location .eslintcache
          cache-path: .eslintcache
          cache-key-prefix: eslintcache
          cache-key-extra-glob-1: .eslintrc*
          cache-key-extra-glob-2: eslint.config.*
          cache-write: 'false'

  ls-lint:
    name: ls-lint
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_ls_lint && !inputs.is_dependabot && needs.changes.outputs.ls_lint == 'true' }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: ls-lint
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - run: yarn lint:ls
        working-directory: ${{ inputs.working-directory }}

  typecheck:
    name: typecheck
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    steps:
      # --incremental/--tsBuildInfoFile are passed through to the caller's
      # `typecheck` script (yarn forwards extra CLI args) — assumes that
      # script ultimately invokes tsc, true for every existing caller.
      # cache-write false: only main-ci.yml writes a new tsconfig.tsbuildinfo
      # entry - see cached-script's cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: typecheck
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: typecheck
          script-args: --incremental --tsBuildInfoFile tsconfig.tsbuildinfo
          cache-path: tsconfig.tsbuildinfo
          cache-key-prefix: tsbuildinfo
          cache-key-extra-glob-1: tsconfig*.json
          cache-write: 'false'

  build:
    name: build
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_build }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: build
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: build

  test:
    name: test
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_test && !inputs.is_dependabot }}
    steps:
      # test_script_args (default Jest's cache flags) is passed through to
      # the caller's `test:coverage` script (yarn forwards extra CLI args) —
      # see that input's description above for the Vitest caveat (LAB-1333).
      # cache-write false: only main-ci.yml writes a new .jestcache entry -
      # see cached-script's cache-write description.
      - uses: PeterChauYEG/labone-actions/.github/actions/cached-script@main
        with:
          deps-cache-key-prefix: test
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          script: test:coverage
          script-args: ${{ inputs.test_script_args }}
          cache-path: .jestcache
          cache-key-prefix: jestcache
          cache-key-extra-glob-1: jest.config.*
          cache-write: 'false'

  design-system:
    name: design-system
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_design_system && !inputs.is_dependabot && needs.changes.outputs.react_ui == 'true' }}
    # Feeds the `danger-comment` aggregator below - see that job's header
    # comment and scan-with-report's own header comment for why this no
    # longer posts its own sticky comment / files its own Linear ticket.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: design-system
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: design-system
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/design-system-report.md
          working-directory: ${{ inputs.working-directory }}
          blocking: 'false'

  dead-code:
    name: dead-code
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_dead_code && !inputs.is_dependabot && needs.changes.outputs.web_source == 'true' }}
    # Feeds the `danger-comment` aggregator below - see design-system's
    # identical comment above.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: dead-code
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: dead-code
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/dead-code-report.md
          working-directory: ${{ inputs.working-directory }}
          blocking: 'false'

  duplicate-code:
    name: duplicate-code
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_duplicate_code && !inputs.is_dependabot && needs.changes.outputs.web_source == 'true' }}
    # Feeds the `danger-comment` aggregator below - see design-system's
    # identical comment above.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: duplicate-code
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: duplicate-code
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/duplicate-code-report.md
          working-directory: ${{ inputs.working-directory }}
          blocking: 'false'

  react-tech-debt:
    name: react-tech-debt
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_react_tech_debt && !inputs.is_dependabot && needs.changes.outputs.react_ui == 'true' }}
    # Feeds the `danger-comment` aggregator below - see design-system's
    # identical comment above. NOTE: this job's own `enable_react_tech_debt`
    # input description above says "no ticket", but the old scan-with-report
    # call here never actually passed `file-ticket: 'false'` - it filed one
    # like every other scan job. Preserving that ACTUAL prior behavior
    # (aggregator files a ticket on failure) rather than the stale
    # description; the description should probably be fixed separately.
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: react-tech-debt
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: react-tech-debt
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/react-tech-debt-report.md
          working-directory: ${{ inputs.working-directory }}
          blocking: 'false'

  max-lines:
    name: max-lines
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-node]
    if: ${{ inputs.enable_max_lines && !inputs.is_dependabot && needs.changes.outputs.web_source == 'true' }}
    # Feeds the `danger-comment` aggregator below - see react-tech-debt's
    # identical "no ticket" discrepancy note above (same applies here).
    outputs:
      outcome: ${{ steps.scan.outputs.outcome }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/setup-node-yarn@main
        with:
          cache-key-prefix: max-lines
          working-directory: ${{ inputs.working-directory }}
          extra-paths: ${{ inputs.extra_deps_paths }}
          ssh-deploy-key: ${{ secrets.LAB_GIT_DEPS_SSH_KEY }}
          gh-token: ${{ secrets.GH_PAT }}
          cache-write: 'false'
      - uses: PeterChauYEG/labone-actions/.github/actions/scan-with-report@main
        id: scan
        with:
          script: max-lines
          script-source: ${{ inputs.max_lines_script_source }}
          gh-token: ${{ secrets.GH_PAT }}
          report-file: ${{ inputs.working-directory }}/max-lines-report.md
          working-directory: ${{ inputs.working-directory }}
          blocking: 'false'

  tech-debt:
    name: tech-debt
    needs: [setup, changes]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: ${{ inputs.enable_tech_debt && !inputs.is_dependabot && needs.changes.outputs.web_source == 'true' }}
    permissions:
      contents: read
    outputs:
      report: ${{ steps.tech-debt-report.outputs.report }}
    steps:
      # No setup-node-yarn call, no setup-node either: this is a plain grep
      # over the tracked .ts/.tsx tree, no installed node_modules or Node
      # runtime needed - just check out the repo, same as security-scan
      # above. tech-debt-report only computes metrics and emits a `report`
      # output; posting it is now the `danger-comment` aggregator below's
      # job (see that job's header comment) - the separate tech-debt-comment
      # job this used to feed is gone. Never fails (metrics report, not a
      # gate) and never files a Linear ticket - unlike every other job
      # feeding the aggregator, it has no `outcome` output and no
      # corresponding "File Linear ticket" step there.
      - uses: actions/checkout@v7
      - uses: PeterChauYEG/labone-actions/.github/actions/tech-debt-report@main
        id: tech-debt-report
        with:
          working-directory: ${{ inputs.working-directory }}
          pr-number: ${{ inputs.pr_number }}
          base-sha: ${{ inputs.pr_base_sha }}

  # Single aggregator for every scan/gate job above that reports findings:
  # peer-deps, security-scan, secret-scan, design-system, dead-code,
  # duplicate-code, react-tech-debt, max-lines, tech-debt. Posts ONE sticky
  # PR comment covering all nine and files (deduped, via
  # scripts/file-linear-ticket.sh - already per-PR-per-job deduped, see that
  # script's own header) a Linear ticket for whichever of the eight
  # ticket-eligible checks failed (tech-debt is metrics-only and never
  # fails, so it has no ticket step) - instead of each independently
  # generating its own Dangerfile / posting its own sticky comment / filing
  # its own ticket, which is what this repo did until now. See
  # develop-node-ci.yml's identical `danger-comment` job for the pattern
  # this was copied from.
  #
  # `if: always()` so this still runs (and can report) when an upstream job
  # failed - same rationale as required-checks' identical `if: always()`
  # below. The `needs.*.result != 'skipped'` check skips this job entirely
  # only when ALL NINE were skipped - any one running is enough to comment.
  #
  # `outcome` on each upstream job's outputs is that job's OWN verdict, not
  # `needs.<job>.result` - every job here except tech-debt is still a hard
  # gate or advisory-continue-on-error job whose own final step still makes
  # `needs.<job>.result` match `outputs.outcome` too, but using
  # `outputs.outcome` uniformly keeps this job's logic identical regardless
  # of which upstream jobs are blocking vs. advisory.
  danger-comment:
    name: danger-comment
    needs:
      [
        peer-deps,
        security-scan,
        secret-scan,
        design-system,
        dead-code,
        duplicate-code,
        react-tech-debt,
        max-lines,
        tech-debt,
      ]
    if: |
      always() &&
      (needs.peer-deps.result != 'skipped' ||
       needs.security-scan.result != 'skipped' ||
       needs.secret-scan.result != 'skipped' ||
       needs.design-system.result != 'skipped' ||
       needs.dead-code.result != 'skipped' ||
       needs.duplicate-code.result != 'skipped' ||
       needs.react-tech-debt.result != 'skipped' ||
       needs.max-lines.result != 'skipped' ||
       needs.tech-debt.result != 'skipped')
    runs-on: [self-hosted, catfood, catfood-node]
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Checked out separately (not the caller repo) purely to get
      # scripts/file-linear-ticket.sh, which lives in labone-actions
      # regardless of which repo calls this workflow.
      - name: Checkout labone-actions scripts
        uses: actions/checkout@v7
        with:
          repository: PeterChauYEG/labone-actions
          ref: main
          path: labone-actions
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - name: Prepare reports
        id: build
        shell: bash
        env:
          PEER_DEPS_RESULT: ${{ needs.peer-deps.result }}
          PEER_DEPS_REPORT: ${{ needs.peer-deps.outputs.report }}
          SECURITY_SCAN_RESULT: ${{ needs.security-scan.result }}
          SECURITY_SCAN_REPORT: ${{ needs.security-scan.outputs.report }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SECRET_SCAN_REPORT: ${{ needs.secret-scan.outputs.report }}
          DESIGN_SYSTEM_RESULT: ${{ needs.design-system.result }}
          DESIGN_SYSTEM_REPORT: ${{ needs.design-system.outputs.report }}
          DEAD_CODE_RESULT: ${{ needs.dead-code.result }}
          DEAD_CODE_REPORT: ${{ needs.dead-code.outputs.report }}
          DUPLICATE_CODE_RESULT: ${{ needs.duplicate-code.result }}
          DUPLICATE_CODE_REPORT: ${{ needs.duplicate-code.outputs.report }}
          REACT_TECH_DEBT_RESULT: ${{ needs.react-tech-debt.result }}
          REACT_TECH_DEBT_REPORT: ${{ needs.react-tech-debt.outputs.report }}
          MAX_LINES_RESULT: ${{ needs.max-lines.result }}
          MAX_LINES_REPORT: ${{ needs.max-lines.outputs.report }}
          TECH_DEBT_RESULT: ${{ needs.tech-debt.result }}
          TECH_DEBT_REPORT: ${{ needs.tech-debt.outputs.report }}
        run: |
          set -uo pipefail
          printf '%s\n' "$PEER_DEPS_REPORT" > /tmp/peer-deps-report.md
          printf '%s\n' "$SECURITY_SCAN_REPORT" > /tmp/security-scan-report.md
          printf '%s\n' "$SECRET_SCAN_REPORT" > /tmp/secret-scan-report.md
          printf '%s\n' "$DESIGN_SYSTEM_REPORT" > /tmp/design-system-report.md
          printf '%s\n' "$DEAD_CODE_REPORT" > /tmp/dead-code-report.md
          printf '%s\n' "$DUPLICATE_CODE_REPORT" > /tmp/duplicate-code-report.md
          printf '%s\n' "$REACT_TECH_DEBT_REPORT" > /tmp/react-tech-debt-report.md
          printf '%s\n' "$MAX_LINES_REPORT" > /tmp/max-lines-report.md
          {
            echo "report<<DANGER_COMMENT_REPORT_EOF"
            echo '## CI checks'
            echo
            [ "$PEER_DEPS_RESULT" != 'skipped' ] && { printf '%s\n\n' "$PEER_DEPS_REPORT"; }
            [ "$SECURITY_SCAN_RESULT" != 'skipped' ] && { printf '%s\n\n' "$SECURITY_SCAN_REPORT"; }
            [ "$SECRET_SCAN_RESULT" != 'skipped' ] && { printf '%s\n\n' "$SECRET_SCAN_REPORT"; }
            [ "$DESIGN_SYSTEM_RESULT" != 'skipped' ] && { printf '%s\n\n' "$DESIGN_SYSTEM_REPORT"; }
            [ "$DEAD_CODE_RESULT" != 'skipped' ] && { printf '%s\n\n' "$DEAD_CODE_REPORT"; }
            [ "$DUPLICATE_CODE_RESULT" != 'skipped' ] && { printf '%s\n\n' "$DUPLICATE_CODE_REPORT"; }
            [ "$REACT_TECH_DEBT_RESULT" != 'skipped' ] && { printf '%s\n\n' "$REACT_TECH_DEBT_REPORT"; }
            [ "$MAX_LINES_RESULT" != 'skipped' ] && { printf '%s\n\n' "$MAX_LINES_REPORT"; }
            [ "$TECH_DEBT_RESULT" != 'skipped' ] && { printf '%s\n\n' "$TECH_DEBT_REPORT"; }
            echo "DANGER_COMMENT_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: PeterChauYEG/labone-actions/.github/actions/post-danger-comment@main
        with:
          report: ${{ steps.build.outputs.report }}
          sticky-header: ci-scans
      - name: File Linear ticket for peer-deps
        if: ${{ needs.peer-deps.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh peer-deps /tmp/peer-deps-report.md
      - name: File Linear ticket for security-scan
        if: ${{ needs.security-scan.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh security-scan /tmp/security-scan-report.md
      - name: File Linear ticket for secret-scan
        if: ${{ needs.secret-scan.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh secret-scan /tmp/secret-scan-report.md
      - name: File Linear ticket for design-system
        if: ${{ needs.design-system.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh design-system /tmp/design-system-report.md
      - name: File Linear ticket for dead-code
        if: ${{ needs.dead-code.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh dead-code /tmp/dead-code-report.md
      - name: File Linear ticket for duplicate-code
        if: ${{ needs.duplicate-code.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh duplicate-code /tmp/duplicate-code-report.md
      - name: File Linear ticket for react-tech-debt
        if: ${{ needs.react-tech-debt.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh react-tech-debt /tmp/react-tech-debt-report.md
      - name: File Linear ticket for max-lines
        if: ${{ needs.max-lines.outputs.outcome == 'failure' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash labone-actions/scripts/file-linear-ticket.sh max-lines /tmp/max-lines-report.md

  # `needs:` lists every job in this file that's currently a REAL (blocking)
  # gate. Deliberately excludes `peer-deps` (see that job's own comment - it
  # was already a hard gate before this PR too, just not required-status'd
  # here; unchanged), `design-system`/`dead-code`/`duplicate-code`/
  # `react-tech-debt`/`max-lines`/`tech-debt` (advisory/report-only,
  # `blocking: 'false'` or metrics-only), and `danger-comment` (the
  # aggregated sticky-comment/Linear-ticket job - purely advisory/reporting,
  # never fails on its own). See develop-node-ci.yml's identical
  # `required-checks` comment for the full rationale.
  required-checks:
    name: required-checks
    needs: [lint, ls-lint, typecheck, build, test, actionlint, security-scan, secret-scan]
    runs-on: [self-hosted, catfood, catfood-minimal]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
