name: Develop CI

on:
  workflow_call:
    inputs:
      pr_number:
        description: github.event.pull_request.number from the caller (required for correct concurrency grouping)
        type: number
        required: false
        default: 0
      enable_ls_lint:
        description: Run ls-lint file naming check
        type: boolean
        default: true

permissions:
  contents: read

# Scoped per repo+PR so callers don't cancel each other.
# pr_number must be passed explicitly because github.event.pull_request
# is not populated in the called workflow context.
concurrency:
  group: ${{ github.repository }}-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, catfood]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  ls-lint:
    name: ls-lint
    runs-on: [self-hosted, catfood]
    if: ${{ inputs.enable_ls_lint }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --frozen-lockfile
      - run: yarn lint:ls

  typecheck:
    name: typecheck
    runs-on: [self-hosted, catfood]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
