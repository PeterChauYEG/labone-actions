name: Security Scan (Reusable)

on:
  workflow_call:
    inputs:
      scan-ref:
        description: Path to scan
        type: string
        default: '.'
      trivyignores:
        description: >
          Comma-separated list of relative paths to .trivyignore file(s), or
          a single .trivyignore.yaml file, passed straight through to
          trivy-action's own `trivyignores` input. NOT auto-detected —
          trivy-action only auto-discovers a plain `.trivyignore` in the
          scan root; a `.trivyignore.yaml` (the structured, path-scoped
          format) requires this input explicitly or its entries are
          silently ignored. Empty by default (no ignore file).
        type: string
        default: ''
      cache-write:
        description: >
          Whether the Trivy DB cache below should be allowed to write a new
          cache entry (true) or only read an existing one (false,
          read-only). The DB updates roughly daily, so only the
          push-to-main trigger needs to write - PR runs read whatever main
          last wrote via restore-keys, instead of every PR branch pulling
          and re-caching its own multi-hundred-MB copy of the DB. Default
          false (read-only); security.yml (this repo's own caller) passes
          true only when github.event_name == 'push'.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, catfood, catfood-minimal]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deps:
              - '**/package.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/requirements*.txt'
              - '**/pyproject.toml'
              - '**/Gemfile'
              - '**/Gemfile.lock'
              - '**/go.mod'
              - '**/go.sum'

  trivy-vuln:
    name: Trivy vulnerability scan
    needs: changes
    # aquasecurity/trivy-action is a Docker-container action -- needs the
    # Docker CLI on the runner host to execute at all, so this must not
    # land on an image without it.
    runs-on: [self-hosted, catfood, catfood-docker]
    if: >-
      always() &&
      (github.event_name == 'schedule' || needs.changes.outputs.deps == 'true')
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: vuln
          label: vulnerabilities
          report-heading: '### security-scan'
          working-directory: ${{ inputs.scan-ref }}
          trivyignores: ${{ inputs.trivyignores }}
          cache-db: 'true'
          cache-write: ${{ inputs.cache-write }}
      - if: steps.scan.outputs.outcome == 'failure'
        run: exit 1

  trivy-secret:
    name: Trivy secret scan
    # aquasecurity/trivy-action is a Docker-container action -- needs the
    # Docker CLI on the runner host to execute at all, so this must not
    # land on an image without it.
    runs-on: [self-hosted, catfood, catfood-docker]
    steps:
      - uses: PeterChauYEG/labone-actions/.github/actions/trivy-scan@main
        id: scan
        with:
          scanners: secret
          label: secrets
          report-heading: '### secret-scan'
          working-directory: ${{ inputs.scan-ref }}
          trivyignores: ${{ inputs.trivyignores }}
      - if: steps.scan.outputs.outcome == 'failure'
        run: exit 1
