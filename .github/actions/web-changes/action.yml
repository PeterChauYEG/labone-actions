name: Web changes
description: Shared path-filter outputs for web (Next.js/yarn) repos, used by both develop-ci.yml and main-ci.yml.

outputs:
  workflows:
    description: .github/workflows/** changed.
    value: ${{ steps.filter.outputs.workflows }}
  react_ui:
    description: .tsx/.jsx changed.
    value: ${{ steps.filter.outputs.react_ui }}
  web_source:
    description: Any TS/JS source file changed.
    value: ${{ steps.filter.outputs.web_source }}
  web_deps:
    description: package.json/lockfile changed.
    value: ${{ steps.filter.outputs.web_deps }}
  tsconfig:
    description: tsconfig*.json changed.
    value: ${{ steps.filter.outputs.tsconfig }}
  eslint_config:
    description: .eslintrc*/eslint.config.* changed.
    value: ${{ steps.filter.outputs.eslint_config }}
  jest_config:
    description: jest.config.*/vitest.config.* changed.
    value: ${{ steps.filter.outputs.jest_config }}
  web:
    description: Full union - anything build/e2e/setup would care about.
    value: ${{ steps.filter.outputs.web }}
  ls_lint:
    description: Source or .ls-lint.yml changed.
    value: ${{ steps.filter.outputs.ls_lint }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          workflows:
            - '.github/workflows/**'
          react_ui:
            - '**/*.tsx'
            - '**/*.jsx'
          web_source:
            - '**/*.ts'
            - '**/*.tsx'
            - '**/*.js'
            - '**/*.jsx'
            - '**/*.mjs'
            - '**/*.cjs'
          web_deps:
            - '**/package.json'
            - '**/yarn.lock'
            - '**/pnpm-lock.yaml'
            - '**/.yarnrc.yml'
          tsconfig:
            - '**/tsconfig*.json'
          eslint_config:
            - '**/.eslintrc*'
            - '**/eslint.config.*'
          jest_config:
            - '**/jest.config.*'
            - '**/vitest.config.*'
          web:
            - '**/*.ts'
            - '**/*.tsx'
            - '**/*.js'
            - '**/*.jsx'
            - '**/*.mjs'
            - '**/*.cjs'
            - '**/package.json'
            - '**/yarn.lock'
            - '**/pnpm-lock.yaml'
            - '**/.yarnrc.yml'
            - '**/tsconfig*.json'
            - '**/.eslintrc*'
            - '**/eslint.config.*'
            - '**/jest.config.*'
            - '**/vitest.config.*'
            - '**/next.config.*'
            - '**/tailwind.config.*'
            - '**/postcss.config.*'
            - '**/*.css'
            - '**/*.scss'
            - '**/public/**'
          ls_lint:
            - '**/*.ts'
            - '**/*.tsx'
            - '**/*.js'
            - '**/*.jsx'
            - '**/*.mjs'
            - '**/*.cjs'
            - '.ls-lint.yml'
