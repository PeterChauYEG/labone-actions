name: Post danger comment
description: >
  Posts/updates a single sticky PR comment with arbitrary markdown, via
  `danger ci --id` (same mechanism scan-with-report uses). Extracted so
  metrics-only actions (tech-debt-report, tech-debt-report-rust) can stay
  Node-free and run their grep/git-worktree steps on a minimal runner (e.g.
  catfood-minimal) — this is the one piece of that pipeline that actually
  needs Node/npx (for `npx danger`), so it's isolated into its own action
  and its own job, rather than every metrics job pulling in
  `actions/setup-node@v7` just for a comment step. Never fails the job;
  posting a report is a nice-to-have, not a pass/fail gate.

inputs:
  report:
    description: >
      Markdown content to post as the sticky PR comment body, e.g. the
      `report` output of tech-debt-report or tech-debt-report-rust.
    required: true
  sticky-header:
    description: Unique identifier for this comment, passed as danger's `--id`.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js for danger
      # Bare runtime only (no yarn install) — this action's own job may run
      # on a minimal/no-node runner otherwise, since the caller's metrics
      # step (tech-debt-report/tech-debt-report-rust) doesn't need Node
      # itself. See this action's header comment.
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Write report to file
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
      run: |
        set -euo pipefail
        report_file="$RUNNER_TEMP/post-danger-comment-report.md"
        printf '%s\n' "$REPORT" > "$report_file"
        echo "path=$report_file" >> "$GITHUB_OUTPUT"
      id: write-report

    - name: Generate Dangerfile
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/post-danger-comment-dangerfile.js" <<'DANGERFILE'
        const fs = require('fs')
        const reportPath = process.env.DANGER_REPORT_PATH

        if (reportPath && fs.existsSync(reportPath)) {
          markdown(fs.readFileSync(reportPath, 'utf8'))
        }
        DANGERFILE

    - name: Post sticky report comment via danger
      shell: bash
      env:
        DANGER_REPORT_PATH: ${{ steps.write-report.outputs.path }}
        DANGER_GITHUB_API_TOKEN: ${{ github.token }}
      run: npx --yes danger@14.0.7 ci --id "${{ inputs.sticky-header }}" --dangerfile "$RUNNER_TEMP/post-danger-comment-dangerfile.js"
