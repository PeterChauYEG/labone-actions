name: Python changes
description: Shared path-filter outputs for Python repos, used by develop-python-ci.yml.

outputs:
  workflows:
    description: .github/workflows/** changed.
    value: ${{ steps.filter.outputs.workflows }}
  python:
    description: Python source or dependency-declaration file changed.
    value: ${{ steps.filter.outputs.python }}
  python_deps:
    description: Dependency-declaration file changed.
    value: ${{ steps.filter.outputs.python_deps }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
      id: filter
      with:
        filters: |
          workflows:
            - '.github/workflows/**'
          python_deps:
            - '**/requirements*.txt'
            - '**/pyproject.toml'
            - '**/setup.cfg'
            - '**/setup.py'
          python:
            - '**/*.py'
            - '**/requirements*.txt'
            - '**/pyproject.toml'
            - '**/setup.cfg'
            - '**/setup.py'
