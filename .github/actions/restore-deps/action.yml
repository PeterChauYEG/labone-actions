name: Restore deps artifact
description: >
  Checkout and download the node_modules (+ .next/cache) artifact published
  by the sibling `setup-node-yarn` action's `setup` job, so this job can
  skip its own `yarn install`. Also enables Corepack + sets up Node.js from
  package.json, since most jobs need the `yarn` binary itself even though
  the dependency tree is restored, not reinstalled.

inputs:
  artifact-name:
    description: >
      Name of the deps artifact to download. Must match the `artifact-name`
      given to the `setup-node-yarn` action in this workflow's `setup` job.
    required: true
  working-directory:
    description: >
      Directory (relative to the repo root) the Next.js/yarn app lives in.
      Defaults to `.` (repo root), matching every existing caller. Must
      match the `working-directory` given to `setup-node-yarn` in this
      workflow's `setup` job.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v7
      with:
        node-version-file: '${{ inputs.working-directory }}/package.json'

    - name: Download deps artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: .

    - name: Extract deps tarball
      shell: bash
      # setup-node-yarn packs node_modules (+ .next/cache) into a single
      # tarball before upload instead of letting actions/upload-artifact
      # handle raw files directly, because that path was silently
      # dereferencing node_modules/.bin/* symlinks into plain-file copies
      # at the wrong location and losing exec bits on real binaries
      # (playwright/cli.js, jscpd, esbuild, @sentry/cli, ...). tar
      # preserves both correctly, so just untar it here.
      run: |
        tar -xzf deps.tar.gz
        rm -f deps.tar.gz
