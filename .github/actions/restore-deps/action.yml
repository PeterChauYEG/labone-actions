name: Restore deps artifact
description: >
  Checkout and download the node_modules (+ .next/cache) artifact published
  by the sibling `setup-node-yarn` action's `setup` job, so this job can
  skip its own `yarn install`. Also enables Corepack + sets up Node.js from
  package.json, since most jobs need the `yarn` binary itself even though
  the dependency tree is restored, not reinstalled.

inputs:
  artifact-name:
    description: >
      Name of the deps artifact to download. Must match the `artifact-name`
      given to the `setup-node-yarn` action in this workflow's `setup` job.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'

    - name: Download deps artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: .

    - name: Make node_modules executables runnable
      shell: bash
      # `chmod -R a+rX` looks right but capital X only *propagates* an
      # existing execute bit (or sets it on directories) — it never grants
      # execute on a plain file that has none. actions/upload-artifact's
      # zip round-trip commonly zeroes the execute bit on real binaries
      # (playwright/cli.js, esbuild, @sentry/cli, etc.), so files that had
      # no execute bit anywhere came out of `download-artifact` still
      # non-executable and this chmod was a no-op for them — hence e.g.
      # `npx playwright install` failing with "Permission denied". Force
      # execute on every regular file explicitly instead.
      run: |
        chmod -R a+rX node_modules
        find node_modules -type f -exec chmod a+x {} +
