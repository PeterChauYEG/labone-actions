name: Setup Node.js + Yarn
description: >
  Checkout, enable Corepack, setup Node.js from package.json, restore the
  Yarn cache, restore a node_modules cache keyed on yarn.lock (skipping
  `yarn install --frozen-lockfile` entirely on a hit — see `cache-write`
  input), running the install locally in every job that needs deps rather
  than installing once and fanning the result out via a GitHub Actions
  artifact. LAB-1371: the artifact approach (one unique upload per run,
  downloaded by every downstream job) is what was blowing the account-wide
  Actions artifact storage quota — every single run/job pair created its own
  copy regardless of whether the lockfile had actually changed. A cache
  entry keyed on yarn.lock's hash (not the run id) is naturally deduped
  across runs and jobs instead, and only churns when the lockfile itself
  changes. The tradeoff: on a genuine cache miss (new/changed lockfile),
  every job that calls this action re-runs its own full install rather than
  one job installing once for everyone — acceptable on self-hosted runners,
  and rare since most runs hit an already-warm cache entry.

inputs:
  working-directory:
    description: >
      Directory (relative to the repo root) the Next.js/yarn app lives in.
      Defaults to `.` (repo root), matching every existing caller. Set this
      when the app lives in a subdirectory of a monorepo, e.g. `prototype`.
    required: false
    default: '.'
  extra-paths:
    description: >
      Newline- or space-separated list of additional paths (relative to the
      repo root) to fold into the node_modules cache entry, beyond
      node_modules and .next/cache — e.g. a gitignored src/generated/
      directory populated by a `postinstall` codegen script.
    required: false
    default: ''
  extra-cache-key-glob-1:
    description: >
      Extra glob pattern (relative to working-directory) folded into the
      node_modules cache key's hashFiles alongside yarn.lock — e.g.
      `prisma/schema.prisma` for a repo whose `postinstall` script runs
      `prisma generate`. Without this, the cache key only changes when
      yarn.lock changes, so editing a `postinstall` codegen input (like the
      Prisma schema) without also touching a dependency leaves every job
      restoring the OLD node_modules — including its stale generated
      output — forever, since a cache hit skips `yarn install`
      (`postinstall`) entirely (see the `Install dependencies` step's `if:`
      below). Same failure mode extra-paths doesn't cover: extra-paths
      controls what gets swept into the cache entry, not when that entry is
      considered stale. A caller needing two extra patterns also has
      extra-cache-key-glob-2. Empty (default) matches every existing
      caller with zero behavior change.
    required: false
    default: ''
  extra-cache-key-glob-2:
    description: Second extra glob pattern - see extra-cache-key-glob-1.
    required: false
    default: ''
  ssh-deploy-key:
    description: >
      SSH private key (e.g. secrets.LAB_GIT_DEPS_SSH_KEY) for cloning
      private git-dependency packages during yarn install — e.g.
      "pkg": "github:PeterChauYEG/some-private-pkg#main" in package.json.
      Loaded into an ssh-agent before install. Leave empty (default) for
      repos with no private git dependencies.
    required: false
    default: ''
  gh-token:
    description: >
      GitHub token (e.g. secrets.GH_PAT) exposed as GH_TOKEN to the yarn
      install step only — for repos whose `postinstall` script shells out
      to the `gh` CLI against a *different* private repo (e.g. gamecraft's
      scripts/install-gamecraft-api-sdk.mjs running
      `gh release download --repo PeterChauYEG/gamecraft-api ...`). The
      ephemeral default GITHUB_TOKEN is scoped only to the calling repo, so
      `gh` can't see releases on a sibling private repo without this. Leave
      empty (default) for repos with no such cross-repo `gh` calls.
    required: false
    default: ''
  cache-write:
    description: >
      Whether the node_modules cache below should be allowed to write a new
      cache entry ('true') or only read an existing one ('false',
      read-only). Caches change infrequently, so only the push-to-main
      workflow's `setup` job (main-ci.yml / main-node-ci.yml) needs to
      write — every other job, on both PR and main runs, reads that same
      entry read-only via restore-keys instead of also paying to write a
      duplicate copy, which just churns/evicts the shared cache. 'false'
      (read-only) by default. String, not boolean — composite action inputs
      are always strings.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v7
      with:
        node-version-file: '${{ inputs.working-directory }}/package.json'

    - name: Cache Yarn cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ inputs.working-directory }}/.yarn/cache
          ${{ inputs.working-directory }}/.yarn/install-state.gz
        key: ${{ runner.os }}-yarn-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Compute node_modules cache paths
      # extra-paths is a dynamic, space-separated list - actions/cache's
      # `path:` input can't loop over one in YAML directly, so build the
      # full multiline path list (node_modules + .next/cache, if present,
      # + each extra path) once here and reference it from both cache steps
      # below via this step's output.
      id: cache-paths
      shell: bash
      run: |
        {
          echo "paths<<CACHE_PATHS_EOF"
          echo "${{ inputs.working-directory }}/node_modules"
          echo "${{ inputs.working-directory }}/.next/cache"
          for p in ${{ inputs.extra-paths }}; do
            echo "${{ inputs.working-directory }}/$p"
          done
          echo "CACHE_PATHS_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Cache node_modules
      # Highest-value cache here: without this, yarn install --frozen-lockfile
      # reinstalls/relinks the full tree every single run regardless of the
      # Yarn package cache above (that cache only avoids re-fetching over the
      # network, not the resolve/link cost). Keyed on yarn.lock's hash, same
      # as the Yarn cache. cache-write true (main-ci.yml/main-node-ci.yml's
      # `setup` job only) uses the normal restore+save action; cache-write
      # false (every other job) uses the read-only restore variant below
      # instead — see cache-write's input description.
      id: node-modules-cache
      if: inputs.cache-write == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.cache-paths.outputs.paths }}
        # cache-key-extra-glob-1/-2 are optional (default '') — naively
        # formatting an unset one as `{working-directory}/` (e.g. './')
        # hands hashFiles a bare directory reference instead of a glob,
        # which can error out the whole hashFiles() call rather than just
        # skip the empty pattern (same guard cached-script's own
        # extra-glob hashFiles already applies - see that action's
        # comment). Only fold each glob in when actually set.
        key: ${{ runner.os }}-node-modules-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory), (inputs.extra-cache-key-glob-1 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-1)) || '', (inputs.extra-cache-key-glob-2 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-2)) || '') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Restore node_modules (read-only)
      id: node-modules-restore
      if: inputs.cache-write != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cache-paths.outputs.paths }}
        key: ${{ runner.os }}-node-modules-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory), (inputs.extra-cache-key-glob-1 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-1)) || '', (inputs.extra-cache-key-glob-2 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-2)) || '') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Load SSH deploy key for private git dependencies
      if: inputs.ssh-deploy-key != ''
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ inputs.ssh-deploy-key }}

    - name: Trust github.com host key
      # Self-hosted Docker runners (unlike GitHub-hosted ones) don't ship
      # github.com pre-populated in known_hosts, so the git-dependency
      # clone above would otherwise fail host-key verification.
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

    - name: Route git+https git dependencies over SSH
      # package.json git-dependency entries are commonly written as
      # git+https://github.com/... (or resolve to that form), which ignores
      # the ssh-agent key loaded above entirely — https:// clones normally
      # ride on the credential actions/checkout leaves behind for the
      # *current* repo only, and dependabot-triggered runs get a
      # single-repo-scoped GITHUB_TOKEN that can't touch a sibling private
      # repo at all. Rewriting the URL scheme forces yarn to use the SSH
      # transport (and therefore the deploy key above) regardless of how
      # the dependency is declared.
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

    - name: Install dependencies
      # Skipped entirely on a node_modules cache hit — the restored tree
      # already matches this exact yarn.lock. Still runs when extra-paths is
      # set, though: those are postinstall-generated (e.g. SDK codegen)
      # outputs that only exist after a real install, so a cache hit there
      # can't be trusted to have already produced them unless they were also
      # captured into this same cache entry on a prior run.
      if: |
        (steps.node-modules-cache.outputs.cache-hit != 'true' &&
         steps.node-modules-restore.outputs.cache-hit != 'true') ||
        inputs.extra-paths != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Scoped to this step only (not job-wide) so a `postinstall` script's
        # `gh` CLI calls against a sibling private repo can authenticate,
        # without widening the token's blast radius to any other step.
        GH_TOKEN: ${{ inputs.gh-token }}
        # Yarn Berry's default networkConcurrency (8) opens that many
        # parallel fetch/extract workers, each holding its own decompression
        # buffers in memory at once — the single biggest install-time memory
        # driver on a cache miss (LAB-1301: budget PRs #170/#171/#173-#176
        # were OOM-killed ~28s into this exact step on the shared catfood
        # runner pool when several PRs' installs landed on the same host at
        # once). Capping it trades a few extra seconds of wall-clock for a
        # meaningfully lower peak RSS per concurrent install, so the same
        # runner host can absorb more overlapping PR pushes without any one
        # of them getting OOM-killed. Only takes effect on an actual
        # install (see the `if:` above) — a cache hit skips this step
        # entirely and pays no penalty.
        YARN_NETWORK_CONCURRENCY: '4'
      run: yarn install --frozen-lockfile
