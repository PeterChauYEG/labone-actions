name: Setup Node.js + Yarn (install + publish deps artifact)
description: >
  Checkout, enable Corepack, setup Node.js from package.json, restore the
  Yarn cache, run `yarn install --frozen-lockfile`, and publish the
  resulting node_modules (+ .next/cache, if present) as a build artifact so
  downstream jobs can restore it with the sibling `restore-deps` action
  instead of each running their own install. Intended to be used exactly
  once, by a workflow's `setup` job — see `restore-deps/action.yml` for the
  consumer side of this contract.

inputs:
  artifact-name:
    description: >
      Name for the uploaded deps artifact. Callers should pass something
      unique per-run (e.g. `deps-${{ github.run_id }}`) so concurrent runs
      never collide. Must match the `artifact-name` given to `restore-deps`.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'

    - name: Cache Yarn cache
      uses: actions/cache@v6
      with:
        path: |
          .yarn/cache
          .yarn/install-state.gz
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Check for .next/cache
      id: next-cache
      shell: bash
      run: |
        if [ -d .next/cache ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish deps artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          node_modules
          .next/cache
        if-no-files-found: ignore
        retention-days: 1
        include-hidden-files: true
