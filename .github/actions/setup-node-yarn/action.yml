name: Setup Node.js + Yarn (install + publish deps artifact)
description: >
  Checkout, enable Corepack, setup Node.js from package.json, restore the
  Yarn cache, restore a node_modules cache keyed on yarn.lock (skipping
  `yarn install --frozen-lockfile` entirely on a hit — see `cache-write`
  input), and publish the resulting node_modules (+ .next/cache, if
  present) as a build artifact so downstream jobs can restore it with the
  sibling `restore-deps` action instead of each running their own install.
  Intended to be used exactly once, by a workflow's `setup` job — see
  `restore-deps/action.yml` for the consumer side of this contract.

inputs:
  artifact-name:
    description: >
      Name for the uploaded deps artifact. Callers should pass something
      unique per-run (e.g. "deps-" followed by the run id) so concurrent
      runs never collide. Must match the `artifact-name` given to
      `restore-deps`.
    required: true
  working-directory:
    description: >
      Directory (relative to the repo root) the Next.js/yarn app lives in.
      Defaults to `.` (repo root), matching every existing caller. Set this
      when the app lives in a subdirectory of a monorepo, e.g. `prototype`.
    required: false
    default: '.'
  extra-paths:
    description: >
      Newline- or space-separated list of additional paths (relative to the
      repo root) to include in the deps tarball, beyond node_modules and
      .next/cache — e.g. a gitignored src/generated/ directory populated by
      a `postinstall` codegen script (yarn install runs postinstall in this
      job, but only node_modules/.next/cache normally make it into the
      artifact downstream jobs restore from).
    required: false
    default: ''
  ssh-deploy-key:
    description: >
      SSH private key (e.g. secrets.LAB_GIT_DEPS_SSH_KEY) for cloning
      private git-dependency packages during yarn install — e.g.
      "pkg": "github:PeterChauYEG/some-private-pkg#main" in package.json.
      Loaded into an ssh-agent before install. Leave empty (default) for
      repos with no private git dependencies.
    required: false
    default: ''
  gh-token:
    description: >
      GitHub token (e.g. secrets.GH_PAT) exposed as GH_TOKEN to the yarn
      install step only — for repos whose `postinstall` script shells out
      to the `gh` CLI against a *different* private repo (e.g. gamecraft's
      scripts/install-gamecraft-api-sdk.mjs running
      `gh release download --repo PeterChauYEG/gamecraft-api ...`). The
      ephemeral default GITHUB_TOKEN is scoped only to the calling repo, so
      `gh` can't see releases on a sibling private repo without this. Leave
      empty (default) for repos with no such cross-repo `gh` calls.
    required: false
    default: ''
  cache-write:
    description: >
      Whether the node_modules cache below should be allowed to write a new
      cache entry ('true') or only read an existing one ('false',
      read-only). Caches change infrequently, so only the push-to-main
      workflow (main-ci.yml / main-node-ci.yml) needs to write — PR runs
      (develop-ci.yml / develop-node-ci.yml) can read main's cache via
      restore-keys without also paying to write their own short-lived copy
      on every run, which just churns/evicts the shared cache. 'false'
      (read-only) by default. String, not boolean — composite action inputs
      are always strings.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v7
      with:
        node-version-file: '${{ inputs.working-directory }}/package.json'

    - name: Cache Yarn cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ inputs.working-directory }}/.yarn/cache
          ${{ inputs.working-directory }}/.yarn/install-state.gz
        key: ${{ runner.os }}-yarn-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Cache node_modules
      # Highest-value cache here: without this, yarn install --frozen-lockfile
      # reinstalls/relinks the full tree every single run regardless of the
      # Yarn package cache above (that cache only avoids re-fetching over the
      # network, not the resolve/link cost). Keyed on yarn.lock's hash, same
      # as the Yarn cache. cache-write true (main-ci.yml/main-node-ci.yml)
      # uses the normal restore+save action; cache-write false (every PR
      # run) uses the read-only restore variant below instead, so PR
      # branches never write their own short-lived copy — see cache-write's
      # input description.
      id: node-modules-cache
      if: inputs.cache-write == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Restore node_modules (read-only)
      id: node-modules-restore
      if: inputs.cache-write != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Load SSH deploy key for private git dependencies
      if: inputs.ssh-deploy-key != ''
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ inputs.ssh-deploy-key }}

    - name: Trust github.com host key
      # Self-hosted Docker runners (unlike GitHub-hosted ones) don't ship
      # github.com pre-populated in known_hosts, so the git-dependency
      # clone above would otherwise fail host-key verification.
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

    - name: Route git+https git dependencies over SSH
      # package.json git-dependency entries are commonly written as
      # git+https://github.com/... (or resolve to that form), which ignores
      # the ssh-agent key loaded above entirely — https:// clones normally
      # ride on the credential actions/checkout leaves behind for the
      # *current* repo only, and dependabot-triggered runs get a
      # single-repo-scoped GITHUB_TOKEN that can't touch a sibling private
      # repo at all. Rewriting the URL scheme forces yarn to use the SSH
      # transport (and therefore the deploy key above) regardless of how
      # the dependency is declared.
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

    - name: Install dependencies
      # Skipped entirely on a node_modules cache hit — the restored tree
      # already matches this exact yarn.lock. Still runs when extra-paths is
      # set, though: those are postinstall-generated (e.g. SDK codegen)
      # outputs the node_modules cache doesn't cover, so a cache hit there
      # can't be trusted to have already produced them.
      if: |
        (steps.node-modules-cache.outputs.cache-hit != 'true' &&
         steps.node-modules-restore.outputs.cache-hit != 'true') ||
        inputs.extra-paths != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Scoped to this step only (not job-wide) so a `postinstall` script's
        # `gh` CLI calls against a sibling private repo can authenticate,
        # without widening the token's blast radius to any other step.
        GH_TOKEN: ${{ inputs.gh-token }}
        # Yarn Berry's default networkConcurrency (8) opens that many
        # parallel fetch/extract workers, each holding its own decompression
        # buffers in memory at once — the single biggest install-time memory
        # driver on a cache miss (LAB-1301: budget PRs #170/#171/#173-#176
        # were OOM-killed ~28s into this exact step on the shared catfood
        # runner pool when several PRs' installs landed on the same host at
        # once). Capping it trades a few extra seconds of wall-clock for a
        # meaningfully lower peak RSS per concurrent install, so the same
        # runner host can absorb more overlapping PR pushes without any one
        # of them getting OOM-killed. Only takes effect on an actual
        # install (see the `if:` above) — a cache hit skips this step
        # entirely and pays no penalty.
        YARN_NETWORK_CONCURRENCY: '4'
      run: yarn install --frozen-lockfile

    - name: Archive deps into a single tarball
      shell: bash
      # actions/upload-artifact does not reliably round-trip symlinks or
      # exec permissions (see restore-deps/action.yml for the fallout: it
      # was silently dereferencing node_modules/.bin/* symlinks into plain
      # file copies at the wrong path, breaking every tool invoked via
      # `npx <bin>` or a `.bin/<bin>` shell-out with e.g.
      # "Cannot find module './lib/program'"). tar preserves both natively,
      # so archive node_modules (+ .next/cache, if present) ourselves and
      # upload the single tarball instead of raw files. Paths are qualified
      # with `working-directory` (a no-op `./node_modules` when it's the
      # default `.`) so the tarball still extracts to the right place in
      # restore-deps regardless of where the app lives in the caller repo.
      run: |
        NM_DIR="${{ inputs.working-directory }}/node_modules"
        NEXT_CACHE_DIR="${{ inputs.working-directory }}/.next/cache"
        EXTRA_PATHS=()
        for p in ${{ inputs.extra-paths }}; do
          EXTRA_PATHS+=("${{ inputs.working-directory }}/$p")
        done
        tar -czf deps.tar.gz "$NM_DIR" $( [ -d "$NEXT_CACHE_DIR" ] && echo "$NEXT_CACHE_DIR" ) "${EXTRA_PATHS[@]}"

    - name: Publish deps artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: deps.tar.gz
        retention-days: 1
