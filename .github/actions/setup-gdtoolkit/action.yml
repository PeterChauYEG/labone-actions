name: Setup gdtoolkit
description: >
  Install gdtoolkit (gdformat/gdlint) pinned to a fixed version via the shared
  `setup-python-uv` action (cached `uv tool install`, no more bare uncached
  `pip install --break-system-packages` per run), and install this repo's
  canonical, intentionally strict .gdlintrc/.gdformatrc into the caller's working directory —
  overwriting anything the caller repo has locally. This is what makes "change GDScript
  lint rules in one place" true: consumer repos must not keep their own .gdlintrc/.gdformatrc.
  Both configs exclude a directory literally named `gut` (matched by basename, not full path —
  gdtoolkit's excluded_directories pruning works the same way for both tools) so a vendored
  addons/gut/ GUT test-framework checkout is never linted/format-checked as if it were the
  repo's own code.

inputs:
  working-directory:
    description: Directory (relative to the repo root) the Godot project lives in.
    required: false
    default: '.'
  gdtoolkit-version:
    description: Pinned gdtoolkit version.
    required: false
    default: '4.5.0'

runs:
  using: composite
  steps:
    - uses: PeterChauYEG/labone-actions/.github/actions/setup-python-uv@main
      with:
        tool: gdtoolkit==${{ inputs.gdtoolkit-version }}
        cache-key-prefix: gdtoolkit

    - name: Install canonical .gdlintrc
      shell: bash
      run: cp "${{ github.action_path }}/gdlintrc" "${{ inputs.working-directory }}/.gdlintrc"

    - name: Install canonical .gdformatrc
      shell: bash
      run: cp "${{ github.action_path }}/gdformatrc" "${{ inputs.working-directory }}/.gdformatrc"
