name: Notify Slack of deploy result
description: >
  Posts a one-line Slack message reporting a deploy job's result.
  Previously copy-pasted identically as the `slack-notification` job body
  across main-ci.yml and main-node-ci.yml.

inputs:
  bot-token:
    description: Slack bot token (e.g. secrets.SLACK_BOT_TOKEN) used to call chat.postMessage.
    required: true
  deploy-result:
    description: The deploy job's own result (e.g. needs.deploy.result), e.g. `failure`.
    required: true
  channel:
    description: Slack channel to post the notification to.
    required: false
    default: '#release'

runs:
  using: composite
  steps:
    - name: Notify Slack
      uses: slackapi/slack-github-action@v2.1.1
      with:
        method: chat.postMessage
        token: ${{ inputs.bot-token }}
        payload: |
          {
            "channel": "${{ inputs.channel }}",
            "text": "${{ github.repository }} deploy: ${{ inputs.deploy-result }}"
          }
