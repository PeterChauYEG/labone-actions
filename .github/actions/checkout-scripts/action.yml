name: Checkout labone-actions scripts
description: >
  Sparse-checks-out this repo's own scripts/ directory into the caller
  job's workspace, for scripts that live in labone-actions regardless of
  which repo calls the containing reusable workflow/action (e.g.
  scripts/file-linear-ticket.sh, scripts/<scan>-scan.mjs). Previously
  copy-pasted identically (modulo `path`) across scan-with-report,
  build-danger-comment, and every develop-*-ci.yml's file-linear-tickets
  matrix job.

  Any caller-side `if:` gating whether this checkout should even run
  (e.g. only on script-source: labone-actions, or only for a matrix leg
  that actually failed) stays on the calling `uses:` step itself - a
  composite action's own steps can't see the caller's `inputs`/`needs`/
  `matrix` context to make that decision internally.

  LAB-5420: this repo (PeterChauYEG/labone-actions) is PUBLIC, so cloning
  it needs no credentials at all - every attempt below does a plain
  anonymous `git fetch`, with no `token`/`AUTHORIZATION` header, no
  reliance on the caller's ambient GITHUB_TOKEN (which is scoped to the
  calling repo only and 404s on ANY other repo regardless of visibility -
  see LAB-2929), and no reliance on the caller passing a correctly-scoped
  PAT (gamecraft's own `GH_PAT`, passed through scan-with-report's
  `gh-token`, hit exactly this: "Repository not found" on every attempt
  even though the repo is public and the PAT is valid for gamecraft's own
  needs - whatever scope mismatch caused that is irrelevant once the
  checkout itself doesn't need a token). `token` is kept as an opt-in
  fallback, used only on the final retry, for the day this repo goes
  private again - no existing caller needs to pass it for this to work.

inputs:
  path:
    description: >
      Checkout path, relative to the caller job's workspace. Different
      callers use different paths so their own repo-relative script
      references don't collide with a same-named directory in the
      checked-out caller repo.
    required: false
    default: 'labone-actions'
  token:
    description: >
      Optional token, used only as a last-resort fallback on the final
      retry below if every anonymous attempt fails. Not needed today -
      see this action's own header comment for why the default (no
      token) path is the reliable one now that this repo is public.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout labone-actions scripts
      shell: bash
      env:
        CHECKOUT_PATH: ${{ inputs.path }}
        CHECKOUT_TOKEN: ${{ inputs.token }}
      run: bash "${{ github.action_path }}/checkout.sh"
