name: Checkout labone-actions scripts
description: >
  Sparse-checks-out this repo's own scripts/ directory into the caller
  job's workspace, for scripts that live in labone-actions regardless of
  which repo calls the containing reusable workflow/action (e.g.
  scripts/file-linear-ticket.sh, scripts/<scan>-scan.mjs). Previously
  copy-pasted identically (modulo `path`) across scan-with-report,
  build-danger-comment, and every develop-*-ci.yml's file-linear-tickets
  matrix job.

  Any caller-side `if:` gating whether this checkout should even run
  (e.g. only on script-source: labone-actions, or only for a matrix leg
  that actually failed) stays on the calling `uses:` step itself - a
  composite action's own steps can't see the caller's `inputs`/`needs`/
  `matrix` context to make that decision internally.

inputs:
  path:
    description: >
      Checkout path, relative to the caller job's workspace. Different
      callers use different paths so their own repo-relative script
      references don't collide with a same-named directory in the
      checked-out caller repo.
    required: false
    default: 'labone-actions'
  token:
    description: >
      Token used to check out this (private) repo. Defaults to the caller
      job's ambient GITHUB_TOKEN, which relies on this repo's Settings ->
      Actions -> General -> Access grant covering the caller repo/org for
      cross-repo checkout to succeed. That grant has proven fragile
      (LAB-2929 - every caller of this action started failing with
      "Repository not found" with zero changes on either side), so pass
      an explicit PAT (e.g. secrets.GH_PAT, already used fleet-wide for
      this same cross-repo-access problem) here instead of relying on it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # actions/checkout's own built-in retry (3 attempts, ~10-15s apart) isn't
    # long enough to ride out the intermittent "Repository not found" bursts
    # this cross-org checkout hits even with an explicit token passed
    # (LAB-3496) - every ephemeral runner on this fleet's self-hosted host
    # shares a small pool of egress IPs, and a burst of concurrent checkouts
    # of this same private repo from several callers' CI at once appears to
    # trip GitHub's abuse/rate-limit detection, which surfaces as "not
    # found" rather than a 403/429. Retry the whole checkout step up to 3
    # times with a longer, increasing backoff (15s/45s) so a transient burst
    # has time to clear before giving up for real.
    - id: attempt1
      continue-on-error: true
      uses: actions/checkout@v7
      with:
        repository: PeterChauYEG/labone-actions
        ref: main
        path: ${{ inputs.path }}
        token: ${{ inputs.token || github.token }}
        sparse-checkout: |
          scripts
        sparse-checkout-cone-mode: true

    - name: Wait before retry 1
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Checkout of labone-actions failed, retrying in 15s"
        sleep 15

    - id: attempt2
      if: steps.attempt1.outcome == 'failure'
      continue-on-error: true
      uses: actions/checkout@v7
      with:
        repository: PeterChauYEG/labone-actions
        ref: main
        path: ${{ inputs.path }}
        token: ${{ inputs.token || github.token }}
        sparse-checkout: |
          scripts
        sparse-checkout-cone-mode: true

    - name: Wait before retry 2
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Checkout of labone-actions failed again, retrying in 45s"
        sleep 45

    - id: attempt3
      if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
      uses: actions/checkout@v7
      with:
        repository: PeterChauYEG/labone-actions
        ref: main
        path: ${{ inputs.path }}
        token: ${{ inputs.token || github.token }}
        sparse-checkout: |
          scripts
        sparse-checkout-cone-mode: true
