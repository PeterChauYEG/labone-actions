name: Node tech debt metrics report
description: >
  Grep-based tech-debt metrics for Node/NestJS backend-service consumer
  repos: counts lint/format disable comments (`eslint-disable`
  (-next-line)/`prettier-ignore`/`biome-ignore`), `@ts-ignore`/
  `@ts-expect-error` suppressions, `any` usage (": any" / "as any" /
  "@ts-nocheck"), TODO/FIXME/HACK comments, and `console.log` calls across
  every tracked `.ts`/`.tsx` file (respecting the repo's own .gitignore —
  see count-metrics.sh). Backend sibling of `tech-debt-report` (Web/Mobile
  TS/TSX) — same current-tree + optional base-sha delta shape, scoped to
  the five metrics that have a direct backend equivalent. `useEffect` call
  sites and RN `Animated.*` usage are dropped — see count-metrics.sh's own
  header for why. Emits the markdown table as this action's `report`
  output; it does not post anything itself — the caller posts `report` as
  a sticky PR comment via the separate `post-danger-comment` action. Never
  runs a yarn script, never needs node_modules, and never needs Node/npx
  either — just `actions/checkout@v7` — so it can run on a minimal runner
  (e.g. catfood-minimal); see develop-node-ci.yml's `tech-debt` job. Never
  fails the job; this is a metrics report, not a pass/fail gate.

inputs:
  working-directory:
    description: >
      Directory (relative to the repo root) the Node/NestJS service lives
      in. Defaults to `.` (repo root), matching every other action in this
      repo.
    required: false
    default: '.'
  pr-number:
    description: github.event.pull_request.number from the top-level caller.
    required: true
  base-sha:
    description: >
      github.event.pull_request.base.sha from the top-level caller. When
      set, this action also fetches and checks out that SHA into a
      throwaway `git worktree` and computes the same metrics there, so the
      report can show a delta vs. the PR's base branch. Leave empty (or
      unresolvable, e.g. a base SHA outside a shallow clone's fetchable
      history) to skip the delta — the report falls back to current-totals
      only rather than failing the job.
    required: false
    default: ''

outputs:
  report:
    description: >
      The full markdown tech-debt report (a `### Tech debt metrics`
      heading plus a table). Pass this straight through to
      `post-danger-comment`'s `report` input to post/update the sticky PR
      comment.
    value: ${{ steps.report.outputs.report }}

runs:
  using: composite
  steps:
    - name: Compute current tech debt metrics
      id: current
      shell: bash
      run: |
        set -uo pipefail
        read -r eslint_disable ts_ignore any_usage todo console_log <<< \
          "$(bash "${{ github.action_path }}/count-metrics.sh" "${{ inputs.working-directory }}")"
        {
          echo "eslint_disable=$eslint_disable"
          echo "ts_ignore=$ts_ignore"
          echo "any_usage=$any_usage"
          echo "todo=$todo"
          echo "console_log=$console_log"
        } >> "$GITHUB_OUTPUT"

    - name: Compute base branch tech debt metrics
      id: base
      if: inputs.base-sha != ''
      shell: bash
      # Deliberately not `set -e` at the top level — a fetch/worktree
      # failure here (e.g. a shallow clone that can't reach base-sha, or a
      # rewritten base branch) should degrade to "no delta", not fail the
      # whole job just for a nice-to-have metrics comment.
      run: |
        set -uo pipefail
        {
          set -e
          git fetch --depth=1 origin "${{ inputs.base-sha }}"
          worktree_dir="$(mktemp -d)"
          git worktree add --detach "$worktree_dir" "${{ inputs.base-sha }}" >/dev/null
          read -r eslint_disable ts_ignore any_usage todo console_log <<< \
            "$(bash "${{ github.action_path }}/count-metrics.sh" "$worktree_dir/${{ inputs.working-directory }}")"
          git worktree remove --force "$worktree_dir"
          {
            echo "eslint_disable=$eslint_disable"
            echo "ts_ignore=$ts_ignore"
            echo "any_usage=$any_usage"
            echo "todo=$todo"
            echo "console_log=$console_log"
          } >> "$GITHUB_OUTPUT"
        } || echo "::warning::tech-debt-report-node: couldn't compute base-branch metrics for ${{ inputs.base-sha }}, showing totals only"

    - name: Build tech debt report
      id: report
      shell: bash
      run: |
        set -euo pipefail
        has_base="${{ steps.base.outputs.eslint_disable != '' }}"

        fmt_row() {
          local label="$1" current="$2" base="$3"
          if [ -n "$base" ]; then
            local delta=$((current - base))
            local sign=''
            if [ "$delta" -gt 0 ]; then sign='+'; fi
            echo "| $label | $current | ${sign}${delta} |"
          else
            echo "| $label | $current |"
          fi
        }

        {
          echo "report<<TECH_DEBT_REPORT_EOF"
          echo '### Tech debt metrics'
          echo
          if [ "$has_base" = 'true' ]; then
            echo '| Metric | Count | Δ vs. base |'
            echo '|---|---|---|'
          else
            echo '| Metric | Count |'
            echo '|---|---|'
          fi
          fmt_row 'Lint/format disable comments' "${{ steps.current.outputs.eslint_disable }}" "${{ steps.base.outputs.eslint_disable }}"
          fmt_row '`@ts-ignore`/`@ts-expect-error`' "${{ steps.current.outputs.ts_ignore }}" "${{ steps.base.outputs.ts_ignore }}"
          fmt_row '`any` usage' "${{ steps.current.outputs.any_usage }}" "${{ steps.base.outputs.any_usage }}"
          fmt_row 'TODO/FIXME/HACK comments' "${{ steps.current.outputs.todo }}" "${{ steps.base.outputs.todo }}"
          fmt_row '`console.log` calls' "${{ steps.current.outputs.console_log }}" "${{ steps.base.outputs.console_log }}"
          echo "TECH_DEBT_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"
