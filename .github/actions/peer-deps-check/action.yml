name: Peer-deps check
description: >
  Checks out the repo, enables Corepack, sets up Node from the caller's own
  package.json, runs a fresh install, and reports whether it surfaced a
  peer-dependency conflict (yarn: `YN0060` in `yarn install --immutable`'s
  output; pnpm: any non-zero exit from `pnpm install --frozen-lockfile
  --strict-peer-dependencies`). Previously copy-pasted nearly identically as
  the `peer-deps` job body across develop-ci.yml, develop-node-ci.yml, and
  develop-mobile-ci.yml — only the package manager (yarn-only vs. yarn/pnpm
  branching) differed.

  Always uses `continue-on-error: true` internally and never fails the job
  on its own — same convention as trivy-scan/scan-with-report. A caller
  that wants this to be a hard gate (develop-ci.yml, develop-mobile-ci.yml)
  adds its own `if: steps.<id>.outputs.outcome == 'failure' -> exit 1` step
  right after; a caller that wants it advisory-only (develop-node-ci.yml)
  just doesn't.

  LAB-3473: unlike every other job in develop-*-ci.yml (setup/lint/
  typecheck/test/design-system/dead-code/etc.), this action doesn't go
  through setup-node-yarn, so it never got that action's `ssh-deploy-key`
  handling (ssh-agent + `insteadOf` rewrite of `https://github.com/` to
  `ssh://git@github.com/`) for private git-dependency packages (e.g.
  `"labone-eslint-plugin": "github:PeterChauYEG/labone-eslint-plugin#main"`).
  Without it, `yarn install`'s anonymous HTTPS clone of a private repo dies
  with `could not read Username for 'https://github.com': No such device or
  address` (exit 128) — a plain install/auth failure, not an actual peer-dep
  conflict, but one this action's own `install-failed` branch reports as if
  it might be one. See `ssh-deploy-key` below.

  A caller may not have `secrets.LAB_GIT_DEPS_SSH_KEY` wired into this
  action's own `with:` block yet (editing a caller's `.github/workflows/*`
  file requires the `workflow` OAuth scope, which not every automation
  token calling this repo's API has), so this action also falls back to
  rewriting `https://github.com/` to an authenticated
  `https://x-access-token:<gh-token>@github.com/` URL whenever `gh-token`
  is set and `ssh-deploy-key` isn't — reusing the same `gh-token` a caller
  already passes for GitHub Packages auth (see `gh-token` below), so a
  caller with a private git dependency and no `ssh-deploy-key` set still
  gets a working, authenticated clone instead of exit 128.

inputs:
  package-manager:
    description: '`yarn` or `pnpm`. Defaults to `yarn`.'
    required: false
    default: 'yarn'
  working-directory:
    description: Directory (relative to the repo root) the package.json lives in.
    required: false
    default: '.'
  gh-token:
    description: >
      GitHub token (e.g. secrets.GH_PAT) exposed as GH_TOKEN to the
      install steps only — needed whenever the repo's package.json (or a
      transitive dependency) pulls a private package from GitHub Packages
      (npm.pkg.github.com). Without this, a yarn `.yarnrc.yml` scope like
      `npmAuthToken: "${GH_TOKEN:-}"` falls back to empty and the install
      fails as an anonymous user (yarn YN0041) rather than surfacing an
      actual peer-dependency conflict. Leave empty (default) for repos
      with no such private-registry dependency.
    required: false
    default: ''
  ssh-deploy-key:
    description: >
      SSH private key (e.g. secrets.LAB_GIT_DEPS_SSH_KEY) for cloning
      private git-dependency packages during the install — e.g.
      "labone-eslint-plugin": "github:PeterChauYEG/labone-eslint-plugin#main"
      in package.json. Loaded into an ssh-agent and used to rewrite
      `https://github.com/` git URLs to `ssh://git@github.com/` before the
      install step runs — identical to setup-node-yarn's own
      `ssh-deploy-key` input (see that action's description). Leave empty
      (default) for repos with no private git dependencies.
    required: false
    default: ''

outputs:
  outcome:
    description: The install/check step's own outcome (`success`/`failure`).
    value: ${{ steps.result.outputs.outcome }}
  report:
    description: Markdown report for this check, for a `danger-comment`-style aggregator to consume.
    value: ${{ steps.result.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: ${{ inputs.working-directory }}/package.json

    - name: Load SSH deploy key for private git dependencies
      if: inputs.ssh-deploy-key != ''
      uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
      with:
        ssh-private-key: ${{ inputs.ssh-deploy-key }}

    - name: Trust github.com host key
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

    - name: Route git+https git dependencies over SSH
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

    - name: Authenticate git+https dependencies with gh-token
      # Fallback for callers that haven't (yet, or can't) set
      # ssh-deploy-key on this job - see this action's own top-of-file
      # LAB-3473 comment for why. Only kicks in when ssh-deploy-key is
      # empty so it never fights the SSH rewrite above.
      if: inputs.ssh-deploy-key == '' && inputs.gh-token != ''
      shell: bash
      run: git config --global url."https://x-access-token:${{ inputs.gh-token }}@github.com/".insteadOf "https://github.com/"

    - name: Check for peer dependency conflicts (yarn)
      id: check-yarn
      if: inputs.package-manager == 'yarn'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set +e
        yarn install --immutable 2>&1 | tee /tmp/peer-deps-check.log
        install_exit="${PIPESTATUS[0]}"
        set -e
        if grep -q "YN0060" /tmp/peer-deps-check.log; then
          echo "Peer dependency conflicts detected:"
          grep "YN0060" /tmp/peer-deps-check.log
          echo "peer-conflict" > /tmp/peer-deps-check.reason
          exit 1
        elif [ "$install_exit" -ne 0 ]; then
          echo "yarn install failed for a reason other than a peer-dependency conflict (no YN0060 - exit $install_exit)"
          echo "install-failed" > /tmp/peer-deps-check.reason
          exit 1
        fi

    - name: Check for peer dependency conflicts (pnpm)
      id: check-pnpm
      if: inputs.package-manager == 'pnpm'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set +e
        pnpm install --frozen-lockfile --strict-peer-dependencies 2>&1 | tee /tmp/peer-deps-check.log
        install_exit="${PIPESTATUS[0]}"
        set -e
        if [ "$install_exit" -ne 0 ]; then
          if grep -qi "ERR_PNPM_PEER_DEP_ISSUES\|peer dependenc" /tmp/peer-deps-check.log; then
            echo "peer-conflict" > /tmp/peer-deps-check.reason
          else
            echo "install-failed" > /tmp/peer-deps-check.reason
          fi
          exit 1
        fi

    - name: Build report
      id: result
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ inputs.package-manager == 'yarn' && steps.check-yarn.outcome || steps.check-pnpm.outcome }}
      run: |
        set -uo pipefail
        echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
        reason="$(cat /tmp/peer-deps-check.reason 2>/dev/null || echo '')"
        {
          echo "report<<PEER_DEPS_REPORT_EOF"
          echo '### peer-deps'
          echo
          if [ "$OUTCOME" = 'failure' ]; then
            if [ "$reason" = 'peer-conflict' ]; then
              echo '❌ Peer dependency conflicts detected:'
            else
              echo '❌ Install failed (not a peer-dependency conflict - see the log below for the real cause, e.g. a missing gh-token for a private-repo install script):'
            fi
            echo '```'
            tail -n 60 /tmp/peer-deps-check.log 2>/dev/null || echo '(no log captured)'
            echo '```'
          else
            echo '✅ No peer dependency conflicts detected.'
          fi
          echo "PEER_DEPS_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"
