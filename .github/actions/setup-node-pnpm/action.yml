name: Setup Node.js + pnpm
description: >
  pnpm sibling of `setup-node-yarn` (LAB-1268, cache-only LAB-1371) — same
  contract: checkout, enable Corepack, setup Node.js from package.json,
  configure a repo-local pnpm store directory and restore its cache, restore
  a node_modules cache keyed on pnpm-lock.yaml (skipping `pnpm install
  --frozen-lockfile` entirely on a hit — see `cache-write` input), running
  the install locally in every job that needs deps rather than installing
  once and fanning the result out via a GitHub Actions artifact. See
  `setup-node-yarn`'s description for why the artifact approach was dropped
  (it was the direct cause of repeatedly blowing the account-wide Actions
  artifact storage quota).

inputs:
  working-directory:
    description: >
      Directory (relative to the repo root) the pnpm app lives in. Defaults
      to `.` (repo root), matching every existing caller. Set this when the
      app lives in a subdirectory of a monorepo.
    required: false
    default: '.'
  extra-paths:
    description: >
      Newline- or space-separated list of additional paths (relative to the
      repo root) to fold into the node_modules cache entry, beyond
      node_modules and .next/cache — e.g. a gitignored src/generated/
      directory populated by a `postinstall` codegen script.
    required: false
    default: ''
  extra-cache-key-glob-1:
    description: >
      Extra glob pattern (relative to working-directory) folded into the
      node_modules cache key's hashFiles alongside pnpm-lock.yaml - e.g.
      `prisma/schema.prisma` for a repo whose `postinstall` script runs
      `prisma generate`. See `setup-node-yarn`'s identical input for the
      full rationale (a `postinstall` codegen input changing without a
      dependency change otherwise leaves every job restoring stale
      generated output forever). A caller needing two extra patterns also
      has extra-cache-key-glob-2. Empty (default) matches every existing
      caller with zero behavior change.
    required: false
    default: ''
  extra-cache-key-glob-2:
    description: Second extra glob pattern - see extra-cache-key-glob-1.
    required: false
    default: ''
  ssh-deploy-key:
    description: >
      SSH private key (e.g. secrets.LAB_GIT_DEPS_SSH_KEY) for cloning
      private git-dependency packages during pnpm install - e.g.
      "pkg": "github:PeterChauYEG/some-private-pkg#main" in package.json.
      Loaded into an ssh-agent before install. Leave empty (default) for
      repos with no private git dependencies.
    required: false
    default: ''
  gh-token:
    description: >
      GitHub token (e.g. secrets.GH_PAT) exposed as GH_TOKEN to the pnpm
      install step only - for repos whose `postinstall` script shells out
      to the `gh` CLI against a *different* private repo. The ephemeral
      default GITHUB_TOKEN is scoped only to the calling repo, so `gh` can't
      see releases on a sibling private repo without this. Leave empty
      (default) for repos with no such cross-repo `gh` calls.
    required: false
    default: ''
  cache-write:
    description: >
      Whether the node_modules cache below should be allowed to write a new
      cache entry ('true') or only read an existing one ('false',
      read-only). Caches change infrequently, so only the push-to-main
      workflow's `setup` job needs to write - every other job, on both PR
      and main runs, reads that same entry read-only via restore-keys
      instead of also paying to write a duplicate copy, which just
      churns/evicts the shared cache. 'false' (read-only) by default.
      String, not boolean - composite action inputs are always strings.
      Same convention as `setup-node-yarn`.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v7
      with:
        node-version-file: '${{ inputs.working-directory }}/package.json'

    - name: Configure pnpm store directory
      # Repo-local (rather than pnpm's default global `~/.local/share/pnpm/
      # store`) so it's cacheable the same way setup-node-yarn caches
      # `.yarn/cache` relative to working-directory - keeps this action
      # self-hosted-runner-friendly with no assumptions about a shared home
      # directory across runner instances.
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm config set store-dir .pnpm-store

    - name: Cache pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ inputs.working-directory }}/.pnpm-store
        key: ${{ runner.os }}-pnpm-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Compute node_modules cache paths
      # Same rationale as setup-node-yarn's identical step: extra-paths is a
      # dynamic, space-separated list that can't be looped over in a `path:`
      # input directly, so build the full multiline path list once here.
      id: cache-paths
      shell: bash
      run: |
        {
          echo "paths<<CACHE_PATHS_EOF"
          echo "${{ inputs.working-directory }}/node_modules"
          echo "${{ inputs.working-directory }}/.next/cache"
          for p in ${{ inputs.extra-paths }}; do
            echo "${{ inputs.working-directory }}/$p"
          done
          echo "CACHE_PATHS_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Cache node_modules
      # Same rationale as setup-node-yarn's node_modules cache: the pnpm
      # store cache above only avoids re-fetching over the network, not the
      # resolve/link cost of a full `pnpm install --frozen-lockfile`.
      # cache-write true (main-node-ci.yml's `setup` job only) uses the
      # normal restore+save action; cache-write false (every other job)
      # uses the read-only restore variant below instead - see cache-write's
      # input description.
      id: node-modules-cache
      if: inputs.cache-write == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.cache-paths.outputs.paths }}
        # extra-cache-key-glob-1/-2 are optional (default '') - guarded the
        # same way as setup-node-yarn's identical key - see that action's
        # comment.
        key: ${{ runner.os }}-node-modules-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), (inputs.extra-cache-key-glob-1 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-1)) || '', (inputs.extra-cache-key-glob-2 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-2)) || '') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Restore node_modules (read-only)
      id: node-modules-restore
      if: inputs.cache-write != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cache-paths.outputs.paths }}
        key: ${{ runner.os }}-node-modules-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), (inputs.extra-cache-key-glob-1 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-1)) || '', (inputs.extra-cache-key-glob-2 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-2)) || '') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Load SSH deploy key for private git dependencies
      if: inputs.ssh-deploy-key != ''
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ inputs.ssh-deploy-key }}

    - name: Trust github.com host key
      # Self-hosted Docker runners (unlike GitHub-hosted ones) don't ship
      # github.com pre-populated in known_hosts, so the git-dependency
      # clone above would otherwise fail host-key verification.
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

    - name: Route git+https git dependencies over SSH
      # package.json git-dependency entries are commonly written as
      # git+https://github.com/... (or resolve to that form), which ignores
      # the ssh-agent key loaded above entirely - https:// clones normally
      # ride on the credential actions/checkout leaves behind for the
      # *current* repo only, and dependabot-triggered runs get a
      # single-repo-scoped GITHUB_TOKEN that can't touch a sibling private
      # repo at all. Rewriting the URL scheme forces pnpm to use the SSH
      # transport (and therefore the deploy key above) regardless of how
      # the dependency is declared.
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

    - name: Install dependencies
      # Skipped entirely on a node_modules cache hit - the restored tree
      # already matches this exact pnpm-lock.yaml. Still runs when
      # extra-paths is set, though: those are postinstall-generated (e.g.
      # SDK codegen) outputs that only exist after a real install, so a
      # cache hit there can't be trusted to have already produced them
      # unless they were also captured into this same cache entry on a
      # prior run.
      if: |
        (steps.node-modules-cache.outputs.cache-hit != 'true' &&
         steps.node-modules-restore.outputs.cache-hit != 'true') ||
        inputs.extra-paths != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: pnpm install --frozen-lockfile
