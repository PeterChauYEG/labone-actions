name: Setup Node.js + pnpm
description: >
  pnpm sibling of `setup-node-yarn` — same content-addressed-bundle design,
  same rationale (drops GitHub's actions/cache network round-trip per job
  in favor of a host-local bind-mounted cache; node_modules is
  content-addressed by lockfile hash rather than shared as one mutable
  directory, since - unlike a compiler object cache - it's a full resolved
  tree tied to exactly one lockfile). See setup-node-yarn's own description
  for the full write-vs-read contract (cache-write: true only on
  main-ci.yml/main-node-ci.yml's `setup` job writes a new immutable
  `bundle-<hash>/`; every other job only ever reads one, falling back to a
  fully local, unshared install on a miss) and pruning (gha-cleanup-daily.sh
  removes any `bundle-*/` unused for 7 days).

  pnpm's own content-addressable store is an even more natural fit for the
  no-isolation shared tier than Yarn's package cache — it's already a
  global, content-addressed store by pnpm's own design — so it's shared
  read+write by every job regardless of cache-write, same as Yarn's.

inputs:
  cache-key-prefix:
    description: >
      No longer used to key the dependency cache itself - see
      setup-node-yarn's identical input for the full rationale. Kept only
      for caller backwards compatibility; still logged for debugging.
    required: true
  working-directory:
    description: >
      Directory (relative to the repo root) the pnpm app lives in. Defaults
      to `.` (repo root). Also namespaces this repo's shared dep-cache-main
      mount - see setup-node-yarn's identical input.
    required: false
    default: '.'
  extra-paths:
    description: >
      Newline- or space-separated list of additional paths (relative to
      working-directory) folded into the SAME content-addressed bundle as
      node_modules — e.g. a gitignored src/generated/ directory populated
      by a `postinstall` codegen script.
    required: false
    default: ''
  extra-cache-key-glob-1:
    description: >
      Extra glob pattern (relative to working-directory) folded into the
      bundle hash alongside pnpm-lock.yaml - see setup-node-yarn's
      identical input for the full rationale. A caller needing two extra
      patterns also has extra-cache-key-glob-2.
    required: false
    default: ''
  extra-cache-key-glob-2:
    description: Second extra glob pattern - see extra-cache-key-glob-1.
    required: false
    default: ''
  ssh-deploy-key:
    description: >
      SSH private key (e.g. secrets.LAB_GIT_DEPS_SSH_KEY) for cloning
      private git-dependency packages during pnpm install. Leave empty
      (default) for repos with no private git dependencies. Only relevant
      when this run actually installs - a symlink-only cache hit never
      invokes pnpm at all.
    required: false
    default: ''
  gh-token:
    description: >
      GitHub token (e.g. secrets.GH_PAT) exposed as GH_TOKEN to the pnpm
      install step only - for repos whose `postinstall` script shells out
      to the `gh` CLI against a *different* private repo. Leave empty
      (default) for repos with no such cross-repo `gh` calls.
    required: false
    default: ''
  cache-write:
    description: >
      'true' (main-ci.yml/main-node-ci.yml's `setup` job only) writes a new
      bundle into the shared host cache when this run's lockfile hash isn't
      already there. 'false' (default, every other job) only ever reads an
      existing bundle, falling back to a fully local, unshared install
      when no matching bundle exists yet. String, not boolean - composite
      action inputs are always strings.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v7
      with:
        node-version-file: '${{ inputs.working-directory }}/package.json'

    - name: Compute cache key + paths
      id: cache-key
      shell: bash
      run: |
        slug=$(echo "${{ inputs.working-directory }}" | tr -c 'A-Za-z0-9_.-' '-')
        hash="${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), (inputs.extra-cache-key-glob-1 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-1)) || '', (inputs.extra-cache-key-glob-2 != '' && format('{0}/{1}', inputs.working-directory, inputs.extra-cache-key-glob-2)) || '') }}"
        base="/root/.cache/dep-cache-main/wd-${slug}"
        echo "base=${base}" >> "$GITHUB_OUTPUT"
        echo "bundle=${base}/bundle-${hash}" >> "$GITHUB_OUTPUT"
        echo "pnpm-store=${base}/pnpm-store" >> "$GITHUB_OUTPUT"
        {
          echo "rel-paths<<REL_PATHS_EOF"
          echo "node_modules"
          echo ".next/cache"
          for p in ${{ inputs.extra-paths }}; do
            echo "$p"
          done
          echo "REL_PATHS_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "[setup-node-pnpm] cache-key-prefix='${{ inputs.cache-key-prefix }}' (unused for cache path, kept for log context) bundle=${base}/bundle-${hash}"

    - name: Load SSH deploy key for private git dependencies
      if: inputs.ssh-deploy-key != ''
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ inputs.ssh-deploy-key }}

    - name: Trust github.com host key
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

    - name: Route git+https git dependencies over SSH
      if: inputs.ssh-deploy-key != ''
      shell: bash
      run: git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"

    - name: Read bundle (cache hit) or install (cache-write / miss)
      id: install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        # Content-addressed, safe to share read+write across every job
        # regardless of cache-write - see this action's own description.
        PNPM_STORE: ${{ steps.cache-key.outputs.pnpm-store }}
        BUNDLE: ${{ steps.cache-key.outputs.bundle }}
        REL_PATHS: ${{ steps.cache-key.outputs.rel-paths }}
        CACHE_WRITE: ${{ inputs.cache-write }}
      run: |
        set -euo pipefail
        mkdir -p "$PNPM_STORE"
        pnpm config set store-dir "$PNPM_STORE"

        link_bundle() {
          local bundle="$1"
          while IFS= read -r rel; do
            [[ -z "$rel" ]] && continue
            mkdir -p "$(dirname "$rel")" "$(dirname "$bundle/$rel")"
            ln -sfn "$bundle/$rel" "$rel"
          done <<< "$REL_PATHS"
          touch "$bundle/.last-used"
        }

        if [[ -f "$BUNDLE/.complete" ]]; then
          echo "[setup-node-pnpm] bundle hit: $BUNDLE - symlinking, no install"
          link_bundle "$BUNDLE"
          exit 0
        fi

        if [[ "$CACHE_WRITE" == "true" ]]; then
          echo "[setup-node-pnpm] cache-write run, bundle miss: $BUNDLE - installing into shared cache"
          scratch="${BUNDLE}.tmp-${RANDOM}-$$"
          mkdir -p "$scratch"
          while IFS= read -r rel; do
            [[ -z "$rel" ]] && continue
            mkdir -p "$(dirname "$rel")" "$(dirname "$scratch/$rel")"
            ln -sfn "$scratch/$rel" "$rel"
          done <<< "$REL_PATHS"
          pnpm install --frozen-lockfile
          if [[ ! -d "$BUNDLE" ]]; then
            mv "$scratch" "$BUNDLE"
            touch "$BUNDLE/.complete"
          else
            rm -rf "$scratch"
          fi
          link_bundle "$BUNDLE"
          exit 0
        fi

        echo "[setup-node-pnpm] bundle miss on a non-cache-write run: $BUNDLE - installing locally, not shared"
        pnpm install --frozen-lockfile
