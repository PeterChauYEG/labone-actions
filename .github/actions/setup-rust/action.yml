name: Checkout + Rust toolchain + cargo cache
description: >
  Checkout, install the stable Rust toolchain (with the given components),
  and optionally restore/cache cargo state in two separate caches:
  ~/.cargo/registry and ~/.cargo/git (the downloaded crate sources) under
  one cargo-registry-${Cargo.lock hash} key shared across every job in the
  workflow run regardless of cache-key-prefix, since they're identical for
  any job building the same Cargo.lock; and target/ under a
  cargo-target-${cache-key-prefix}-${Cargo.lock hash} key kept per-job,
  since build output genuinely differs per job (different build
  flags/profile). Previously hand-copied (checkout + dtolnay/rust-toolchain
  + an identical actions/cache block) across fmt/clippy/test/build in
  develop-rust-ci.yml - every job building the same dependency graph shared
  one key already, just not one action.

inputs:
  cache-key-prefix:
    description: >
      Job/purpose identifier (e.g. 'fmt', 'clippy', 'test', 'build')
      folded into the cargo cache key so a job only ever restores/writes
      the cache entry it itself created, never one shared with a different
      job in the same workflow - even when every job builds from the exact
      same Cargo.lock. Required - see setup-node-yarn's identical input for
      the full rationale.
    required: true
  working-directory:
    description: Directory (relative to the repo root) the Cargo project lives in.
    required: false
    default: '.'
  components:
    description: >
      Comma-separated rustup component list forwarded to
      dtolnay/rust-toolchain (e.g. 'clippy', 'rustfmt'). Empty (default)
      installs no extra components - the plain stable toolchain.
    required: false
    default: ''
  cache:
    description: >
      Whether to restore/save the cargo registry+git+target cache.
      'true' (default) for any job that actually compiles (clippy/test/
      build); set 'false' for jobs that don't build against the full
      dependency graph (fmt only formats source, dead-code's
      cargo-machete is baked into the runner image, dependency-audit's
      cargo-audit is a standalone tool) - caching there would just pay
      the cache-save cost for no reuse benefit.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Cache cargo registry/git
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo target
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ inputs.working-directory }}/target
        key: ${{ runner.os }}-cargo-target-${{ inputs.cache-key-prefix }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-cargo-target-${{ inputs.cache-key-prefix }}-
