name: Scan with report
description: >
  Shared body for develop-ci.yml's scan jobs (design-system, dead-code,
  duplicate-code, react-tech-debt, max-lines): run a yarn script that writes
  a markdown report, expose that report plus the scan's pass/fail outcome as
  this action's outputs, then fail the containing job if the script failed
  and `blocking` is true. Callers must run `setup-node-yarn` (or the pnpm
  sibling) first — this action does not restore deps itself, since every
  caller in develop-ci.yml already does that as its own step.

  Posting a sticky PR comment and filing a Linear ticket on failure used to
  live in this action too, one independent comment/ticket per calling job.
  That's now centralized in each workflow's single `danger-comment`
  aggregator job instead (see develop-node-ci.yml's `danger-comment` job for
  the pattern) — one sticky comment per workflow run covering every scan,
  and ticket-filing's dedup logic living in exactly one place rather than
  copy-pasted per caller. This action only produces the raw material
  (`outcome`, `report`) that aggregator consumes.

inputs:
  script:
    description: yarn script to run, e.g. `design-system`.
    required: true
  working-directory:
    description: >
      Directory (relative to the repo root) the Next.js/yarn app lives in.
      Defaults to `.` (repo root), matching every existing caller. Applied
      to the `yarn <script>` step below; scan scripts write their report
      relative to their own cwd, so callers must pass a `report-file` that
      already accounts for this (e.g. the working-directory value joined
      with `design-system-report.md`).
    required: false
    default: '.'
  report-file:
    description: Path to the markdown report the script writes, e.g. `design-system-report.md`.
    required: true
  gh-token:
    description: >
      Optional per-repo secret (e.g. secrets.GH_PAT) forwarded as GH_TOKEN/
      GITHUB_TOKEN to the `yarn <script>` step below — only needed for repos
      whose script transitively needs `gh` CLI/GitHub REST access (e.g. a
      pretest/prebuild hook that installs a generated SDK from a sibling
      repo's release, same rationale as cached-script's identical input).
      Empty string for every other repo, which is a no-op. Callers must
      still restore deps via setup-node-yarn/-pnpm's own `gh-token` input
      first (this action doesn't do that itself).
    required: false
    default: ''
  blocking:
    description: >
      Whether a scan failure fails the containing job. Defaults to 'true'
      (today's behavior for every existing caller). Set to 'false' for
      report-only/advisory scans (e.g. dead-code, duplicate-code) that
      should keep scanning and reporting on failure, but never block
      auto-merge.
    required: false
    default: 'true'

outputs:
  outcome:
    description: '`success` or `failure` — the `yarn <script>` step''s own outcome.'
    value: ${{ steps.scan.outcome }}
  report:
    description: Contents of `report-file` (or a placeholder if it wasn't written).
    value: ${{ steps.report.outputs.report }}

runs:
  using: composite
  steps:
    - run: yarn ${{ inputs.script }}
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        GITHUB_TOKEN: ${{ inputs.gh-token }}

    - name: Capture report
      id: report
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        {
          echo "report<<SCAN_WITH_REPORT_EOF"
          if [ -f "${{ inputs.report-file }}" ]; then
            cat "${{ inputs.report-file }}"
          else
            echo "(no report written — see the ${{ inputs.script }} job's own log)"
          fi
          echo "SCAN_WITH_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"

    - if: steps.scan.outcome == 'failure' && inputs.blocking == 'true'
      shell: bash
      run: exit 1
