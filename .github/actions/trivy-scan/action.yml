name: Trivy scan
description: >
  Shared Trivy `fs` scan (vulnerabilities or secrets) — the body of every
  security-scan/secret-scan job, previously copy-pasted nearly identically
  across develop-ci.yml, develop-node-ci.yml, develop-rust-ci.yml,
  develop-python-ci.yml, develop-mobile-ci.yml, main-ci.yml,
  main-node-ci.yml, main-python-ci.yml, and main-rust-ci.yml. This repo's
  own security-scan.yml also uses it now (with `cache-db: 'true'` for its
  vuln scan), instead of hand-rolling its own second trivy-action
  invocation plus DB-cache/restore steps.

  Checks out the repo, runs Trivy with `continue-on-error: true`, and
  always captures `outcome`/`report` outputs (same convention as
  scan-with-report). Never fails the job on its own — a caller that wants
  this to be a hard gate (every `develop-*-ci.yml` caller today) adds its
  own `if: steps.<id>.outputs.outcome == 'failure' -> exit 1` step right
  after; a caller that just wants the scan to gate directly with no report
  (every `main-*-ci.yml` caller today) can ignore the outputs and do the
  same `exit 1` step, or skip it — Trivy's own `exit-code: '1'` plus
  `continue-on-error` is only there to let this action reach its own
  report-capturing step instead of stopping dead.

inputs:
  scanners:
    description: Trivy `scanners` value — `vuln` or `secret`.
    required: true
  label:
    description: >
      Human label for the report, e.g. `vulnerabilities` or `secrets`.
      Used as-is in both the success line ("No HIGH/CRITICAL <label>
      found.") and the failure line ("Trivy found HIGH/CRITICAL <label>:").
    required: true
  report-heading:
    description: Markdown heading for this scan's own report section, e.g. `### security-scan`.
    required: true
  working-directory:
    description: Directory (relative to the repo root) to scan.
    required: false
    default: '.'
  trivyignores:
    description: Path to a .trivyignore file, forwarded to trivy-action's own input of the same name.
    required: false
    default: ''
  cache-db:
    description: >
      When `'true'`, wraps the Trivy step with a date-keyed
      `actions/cache`/`actions/cache/restore` step against `.cache/trivy`
      and passes `cache: false` + `cache-dir: .cache/trivy` to trivy-action
      so this composite action manages the DB cache itself instead of
      trivy-action's own default caching. Default `'false'` (unaffected,
      today's behavior) for every existing caller.
    required: false
    default: 'false'
  cache-write:
    description: >
      Only used when `cache-db` is `'true'`. Whether this run may write a
      new cache entry (`'true'`) or only read an existing one via
      restore-keys (`'false'`) - only one trigger should write a given
      day's DB so others don't race to create their own multi-hundred-MB
      entry. Default `'false'` (read-only).
    required: false
    default: 'false'

outputs:
  outcome:
    description: The Trivy step's own outcome (`success`/`failure`).
    value: ${{ steps.result.outputs.outcome }}
  report:
    description: >
      Markdown report for this scan, for a `danger-comment`-style
      aggregator to consume. Also always written to $GITHUB_STEP_SUMMARY
      directly, so a finding is visible on the job run itself even for a
      caller (e.g. every `main-*-ci.yml`) with no PR to post an
      aggregated comment on.
    value: ${{ steps.result.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Compute Trivy DB cache date
      if: inputs.cache-db == 'true'
      id: trivy-date
      shell: bash
      run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Cache Trivy DB
      if: inputs.cache-db == 'true' && inputs.cache-write == 'true'
      uses: actions/cache@v6
      with:
        path: .cache/trivy
        key: trivy-db-${{ steps.trivy-date.outputs.date }}
        restore-keys: |
          trivy-db-

    - name: Restore Trivy DB (read-only)
      if: inputs.cache-db == 'true' && inputs.cache-write != 'true'
      uses: actions/cache/restore@v6
      with:
        path: .cache/trivy
        key: trivy-db-${{ steps.trivy-date.outputs.date }}
        restore-keys: |
          trivy-db-

    - name: Run Trivy (${{ inputs.label }})
      id: trivy
      if: inputs.cache-db != 'true'
      continue-on-error: true
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.working-directory }}
        scanners: ${{ inputs.scanners }}
        severity: HIGH,CRITICAL
        exit-code: '1'
        format: table
        output: trivy-${{ inputs.scanners }}-report.txt
        trivyignores: ${{ inputs.trivyignores }}

    - name: Run Trivy (${{ inputs.label }}, cached DB)
      id: trivy-cached
      if: inputs.cache-db == 'true'
      continue-on-error: true
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.working-directory }}
        scanners: ${{ inputs.scanners }}
        severity: HIGH,CRITICAL
        exit-code: '1'
        format: table
        output: trivy-${{ inputs.scanners }}-report.txt
        trivyignores: ${{ inputs.trivyignores }}
        cache: false
        cache-dir: .cache/trivy

    - name: Build report
      id: result
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ inputs.cache-db == 'true' && steps.trivy-cached.outcome || steps.trivy.outcome }}
        LABEL: ${{ inputs.label }}
        HEADING: ${{ inputs.report-heading }}
        REPORT_FILE: trivy-${{ inputs.scanners }}-report.txt
      run: |
        set -uo pipefail
        echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
        {
          echo "$HEADING"
          echo
          if [ "$OUTCOME" = 'failure' ]; then
            echo "❌ Trivy found HIGH/CRITICAL ${LABEL}:"
            echo '```'
            cat "$REPORT_FILE" 2>/dev/null || echo '(no report captured)'
            echo '```'
          else
            echo "✅ No HIGH/CRITICAL ${LABEL} found."
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY" > /tmp/trivy-scan-report-body.txt
        {
          echo "report<<TRIVY_SCAN_REPORT_EOF"
          cat /tmp/trivy-scan-report-body.txt
          echo "TRIVY_SCAN_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"
