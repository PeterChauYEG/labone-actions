name: Develop CI

run-name: PR CI

on:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  ci:
    uses: PeterChauYEG/labone-actions/.github/workflows/node-pr.yml@main
    secrets: inherit
    # with:
    #   Uncomment if this repo uses pnpm instead of yarn (LAB-1268) - e.g.
    #   a packageManager: pnpm@... + pnpm-lock.yaml repo:
    #   package_manager: pnpm
    #   Turn off any job your repo doesn't have a matching script for, e.g.:
    #   enable_build: false
    #   enable_test: false
    #   enable_dependency_audit: false   # mandatory false if this repo is Yarn Classic, not Berry
    #   Also fold in github-actions[bot] here if this repo's main.yml
    #   pre-creates check-runs for its own CalVer version-bump PR:
    #   also_treat_actions_bot_as_dependabot: true

  # Add repo-specific bespoke jobs below as needed - none of these are
  # standardized in develop-node-ci.yml (no shared-workflow equivalent
  # exists for them yet):
  #
  # ls-lint:
  #   name: ls-lint
  #   runs-on: [self-hosted, catfood]
  #   ...
  #
  # dead-code:
  #   name: dead-code
  #   runs-on: [self-hosted, catfood]
  #   ...
  #
  # duplicate-code:
  #   name: duplicate-code
  #   runs-on: [self-hosted, catfood]
  #   ...
