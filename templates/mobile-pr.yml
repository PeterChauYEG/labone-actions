name: Develop CI

run-name: PR CI

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main]

jobs:
  ci:
    uses: PeterChauYEG/labone-actions/.github/workflows/mobile-pr.yml@main
    secrets: inherit
    # with:
    #   Also fold in github-actions[bot] here if this repo's main.yml
    #   pre-creates check-runs for its own CalVer version-bump PR:
    #   also_treat_actions_bot_as_dependabot: true
    #
    #   Only turn on if this repo has .jscpd.json:
    #   enable_duplicate_code: true
    #
    #   Opt in to the grep-based tech-debt metrics report (useEffect/RN
    #   Animated/eslint-disable/@ts-ignore/any/TODO-FIXME-HACK/console.log
    #   counts), posted as a sticky PR comment. Off by default. Pass
    #   pr_base_sha too if you want a delta-vs-base-branch column:
    #   enable_tech_debt: true
    #   pr_base_sha: ${{ github.event.pull_request.base.sha }}
    #
    #   If a postinstall codegen step (e.g. an OpenAPI-generated SDK) writes
    #   outside node_modules, carry it through the deps artifact or every
    #   downstream job will fail with "Cannot find module '@/generated/...'":
    #   extra_deps_paths: 'src/generated'
