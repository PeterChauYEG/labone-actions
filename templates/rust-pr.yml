name: Develop CI

run-name: PR CI

on:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  rust-ci:
    uses: PeterChauYEG/labone-actions/.github/workflows/rust-pr.yml@main
    secrets: inherit
    # with:
    #   Arbitrary shell run before fmt/clippy/test/build's own cargo command
    #   - e.g. installing private-git SDK dependencies cargo needs to
    #   resolve the dependency graph:
    #   pre_build_command: |
    #     bash scripts/install-some-sdk.sh
    #
    #   Turn on optional jobs your repo actually has scripts for:
    #   enable_build: true
    #   enable_duplicate_code: true
    #   enable_file_size: true
    #
    #   Also fold in github-actions[bot] here if this repo's main.yml
    #   pre-creates check-runs for its own CalVer version-bump PR:
    #   also_treat_actions_bot_as_dependabot: true
